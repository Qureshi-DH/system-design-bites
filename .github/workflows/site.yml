# Builds the one page site and publishes it to GitHub Pages. While the repo is private
# every run is skipped. It runs on its own the moment the repo is made public, then on
# every push to main. Pages has to be set to deploy from GitHub Actions once, in the
# repo settings, before the first run can publish.
name: Site

on:
  push:
    branches: [main]
  public:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a deploy that has started is never cut off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
