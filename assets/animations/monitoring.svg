<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Monitoring</title><desc id="desc">A dashboard for a chat app's message service draws four panels in real time. Rate and error rate stay flat and normal. The p99 duration line climbs from 120 ms past its 500 ms threshold and the panel turns red, while the database connection pool fills to 50 of 50 with 300 requests waiting.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">MONITORING</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><rect x="36" y="64" width="357" height="116" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="52" y="88" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="start">Messages per second</text><text x="377" y="88" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="end" opacity="0">8,000/s<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.935;0.95;1" values="1;1;0;0"/></text><defs><clipPath id="monAr"><rect x="50" y="98" width="0" height="76"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0375;0.7875;0.9875;0.9938;1" values="0;0;329;329;0;0"/></rect></clipPath></defs><path d="M52,168 H377" stroke="#334155" stroke-width="1"/><g><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linea