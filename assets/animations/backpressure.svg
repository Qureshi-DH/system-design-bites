<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Backpressure</title><desc id="desc">Match servers send 15,000 events a second into a bounded buffer that a database writer drains at 10,000 a second. The buffer fills to its 50,000 limit, the ingester answers 503 with retry in 2 seconds, and the servers pause. The buffer drains and the servers resume at a pace the writer can keep up with.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">BACKPRESSURE</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M190,170 L300,170" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="16s" repeatCount="indefinite" values="0;-192"/></path><path d="M300,194 L190,194" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity="0.5"></path><path d="M480,180 L590,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="16s" repeatCount="indefinite" values="0;-192"/></path><rect x="30" y="146" width="160" height="68" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="1.6"/><rect x="27" y="143" width="166" height="74" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4;0.415;0.46;0.475;1" values="0;0;1;1;0;0"/></rect><text x="110" y="174" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Match servers</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.385;0.4;1" values="1;1;0;0"/><text x="110" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">15k events a sec</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4;0.415;0.635;0.65;1" values="0;0;1;1;0;0"/><text x="110" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#facc15" text-anchor="middle">paused, waiting</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.65;0.665;1" values="0;0;1;1"/><text x="110" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">10k events a sec</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4;0.415;0.635;0.65;1" values="0;0;1;1;0;0"/><rect x="56.36" y="228" width="107.28" height="24" rx="12" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="110" y="244.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">retry in 2 s</text></g><rect x="300" y="84" width="180" height="196" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="390" y="108" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Bounded buffer</text><text x="390" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">50,000 max</text><rect x="324" y="142" width="54" height="120" rx="3" fill="#172033" stroke="#334155"/><rect x="324" y="208" width="54" height="54" rx="3" fill="#fb923c"><animate attributeName="height" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.325;0.4125;0.65;1" values="54;120;120;54;54"/><animate attributeName="y" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.325;0.4125;0.65;1" values="208;142;142;208;208"/></rect><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0975;0.1125;1" values="1;1;0;0"/><text x="428" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">22,500</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1125;0.1275;0.21;0.225;1" values="0;0;1;1;0;0"/><text x="428" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">31,000</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.225;0.24;0.31;0.325;1" values="0;0;1;1;0;0"/><text x="428" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">40,000</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.325;0.34;0.4725;0.4875;1" values="0;0;1;1;0;0"/><text x="428" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#f87171" text-