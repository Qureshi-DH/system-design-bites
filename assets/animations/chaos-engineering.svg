<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Chaos engineering</title><desc id="desc">A chaos tool kills Redis 2, one of three cache nodes behind a feed service, while the team watches. Requests reroute to Redis 1 and Redis 3, and the p99 latency graph only bumps from 120 ms to 180 ms, well under the 300 ms abort line. Then the node comes back.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">CHAOS ENGINEERING</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M180,138 C256,138 256,84 330,84" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M180,138 C256,138 256,192 330,192" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2913;0.3063;0.825;0.84;1" values="1;1;0;0;1;1"/><path d="M180,138 L330,138" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><path d="M600,138 L452,138" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity="0.7"></path><rect x="40" y="108" width="140" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="110" y="136" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Feed service</text><text x="110" y="153" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">reads cache</text><rect x="600" y="108" width="160" height="60" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.6"/><text x="680" y="136" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Chaos tool</text><text x="680" y="153" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">kill one node</text><path d="M330,68.64 v30.72 a60,8.64 0 0 0 120,0 v-30.72" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="390" cy="68.64" rx="60" ry="8.64" fill="#172033" stroke="#475569" stroke-width="1.6"/><text x="390" y="93.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Redis 1</text><path d="M330,122.64 v30.72 a60,8.64 0 0 0 120,0 v-30.72" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="390" cy="122.64" rx="60" ry="8.64" fill="#172033" stroke="#475569" stroke-width="1.6"/><text x="390" y="147.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Redis 2</text><path d="M330,176.64 v30.72 a60,8.64 0 0 0 120,0 v-30.72" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="390" cy="176.64" rx="60" ry="8.64" fill="#172033" stroke="#475569" stroke-width="1.6"/><text x="390" y="201.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Redis 3</text><rect x="326" y="110" width="128" height="56" rx="8" fill="#0f172a" opacity="0"><animate attributeName="opac