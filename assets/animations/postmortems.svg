<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Postmortems</title><desc id="desc">After a 47 minute presale outage, the timeline is laid out: the sale opens, the database runs out of connections, the alert goes to email, and users complain 13 minutes later. Asking why, not who, gives three root causes, which become three action items with owners that get checked off one by one.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">POSTMORTEMS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><rect x="28" y="64" width="234" height="240" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="44" y="90" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="start">Timeline</text><rect x="290" y="64" width="220" height="240" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="306" y="90" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="start">Root causes</text><rect x="538" y="64" width="234" height="240" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="554" y="90" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="start">Action items</text><text x="306" y="110" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#facc15" text-anchor="start" opacity="0">ask why, not who<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.275;0.29;0.91;0.925;1" values="0;0;1;1;0;0"/></text><path d="M262,180 L290,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="16s" repeatCount="indefinite" values="0;-192"/></path><path d="M510,180 L538,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="16s" repeatCount="indefinite" values="0;-192"/></path><line x1="52" y1="112" x2="52" y2="262" stroke="#334155" stroke-width="2"/><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.225;0.2437;0.9062;0.925;1" values="0;0;1;1;0;0"/><rect x="38" y="186" width="214" height="86" rx="8" fill="#facc15" fill-opacity="0.1" stroke="#facc15" stroke-width="1.4"/><text x="145" y="292" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#facc15" text-anchor="middle">13 minutes nobody saw</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.0437;0.9062;0.925;1" values="0;0;1;1;0;0"/><circle cx="52" cy="122" r="5" fill="#94a3b8"/><text x="68" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">10:00</text><text x="68" y="135" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="start">presale opens</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.075;0.0938;0.9062;0.925;1" values="0;0;1;1;0;0"/><circle cx="52" cy="164" r="5" fill="#f87171"/><text x="68" y="160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">10:00:30</text><text x="68" y="177" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="start">DB out of connections</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.1437;0.9062;0.925;1" values="0;0;1;1;0;0"/><circle cx="52" cy="206" r="5" fill="#94a3b8"/><text x="68" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">10:02</text><text x="68" y="219" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="start">alert goes to email</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.175;0.1937;0.9062;0.925;1" values="0;0;1;1;0;0"/><circle cx="52" cy="248" r="5" fill="#94a3b8"/><text x="68" y="244" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">10:15</text><text x="68" y="261" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="start">users complain online</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3125;0.3312;0.9062;0.925;1" values="0;0;1;1;0;0"/><rect x="304" y="128" width="192" height="38" rx="8" fill="#fb923c" fill-opacity="0.12" stroke="#fb923c" stroke-width="1.3"/><text x="400" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">no connection pool</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3625;0.3812;0.9062;0.925;1" values="0;0;1;1;0;0"/><rect x="304" y="178" width="192" height="38" rx="8" fill="#fb923c" fill-opacity="0.12" stroke="#fb923c" stroke-width="1.3"/><text x="400" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">load test far too small</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4125;0.4312;0.9062;0.925;1" values="0;0;1;1;0;0"/><rect x="304" y="228" width="192" height="38" rx="8" fill="#fb923c" fill-opacity="0.12" stroke="#fb923c" stroke-width="1.3"/><text x="400" y="252" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">alert did not page</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5125;0.5312;0.9062;0.925;1" values="0;0;1;1;0;0"/><rect x="554" y="119" width="16" height="16" rx="4" fill="none" stroke="#475569" stroke-width="1.6"/><text x="582" y="132" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="start">add connection pooling</text><text x="582" y="149" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">Ana, due Friday</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.65;0.665;0.91;0.925;1" values="0;0;1;1;0;0"/><path d="M556,127 L560.2,131.2 L568,122.8" fill="none" stroke="#4ade80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.55;0.5688;0.9062;0.925;1" values="0;0;1;1;0;0"/><rect x="554" y="169" width="16" height="16" rx="4" fill="none" stroke="#475569" stroke-width="1.6"/><text x="582" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="start">load test at 2x peak</text><text x="582" y="199" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">Raj, before next sale</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7125;0.7275;0.91;0.925;1" values="0;0;1;1;0;0"/><path d="M556,177 L560.2,181.2 L568,172.8" fill="none" stroke="#4ade80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5875;0.6063;0.9062;0.925;1" values="0;0;1;1;0;0"/><rect x="554" y="219" width="16" height="16" rx="4" fill="none" stroke="#475569" stroke-width="1.6"/><text x="582" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="start">send DB alerts to pager</text><text x="582" y="249" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">Mei, due Friday</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.775;0.79;0.91;0.925;1" values="0;0;1;1;0;0"/><path d="M556,227 L560.2,231.2 L568,222.8" fill="none" stroke="#4ade80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.8125;0.8275;0.91;0.925;1" values="0;0;1;1;0;0"/><rect x="560.44" y="272" width="189.12" height="24" rx="12" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="655" y="288.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">next presale runs clean</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.254;0.296;0.3;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.25;0.3;1" path="M262,180 L290,180"/><circle r="6" fill="#facc15"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.45;0.454;0.496;0.5;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.45;0.5;1" path="M510,180 L538,180"/><circle r="6" fill="#facc15"></circle></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Facts, then causes, then fixes with owners. Blame systems, not people.</text></svg>
