<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Anycast</title><desc id="desc">Sites in New York, London, Madrid, and Tokyo all announce the same address, 203.0.113.10. Viewers in Boston, Lisbon, and Tokyo each reach the nearest site by network path, Lisbon landing in Madrid, 15 ms away. Madrid fails and withdraws its route, one video segment is lost and retried, and Lisbon's requests now land in London until Madrid announces again.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">ANYCAST</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M110,238 L110,140" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M690,238 L690,140" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M420,238 C420,190 490,190 490,140" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><path d="M380,238 C380,190 310,190 310,140" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4225;0.4375;0.8375;0.8525;1" values="1;1;0;0;1;1"/><path d="M420,238 C420,190 490,190 490,140" fill="none" stroke="#475569" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></g><g opacity="0"><animate attributeName="opacity" dur="