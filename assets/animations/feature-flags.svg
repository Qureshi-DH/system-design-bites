m-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle">3% of payments fail</text></g></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Same deployed code. The flag sends 5% to the new checkout, then kills it.</text></svg>
