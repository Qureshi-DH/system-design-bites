<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Event driven architecture</title><desc id="desc">The order service publishes OrderPlaced for order 7781 onto an event broker and moves on. Payments and email react on their own. Payments publishes PaymentCaptured, the restaurant hears it and publishes FoodReady, and dispatch hears that and finds a courier.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">EVENT DRIVEN ARCHITECTURE</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><rect x="40" y="173" width="720" height="18" rx="9" fill="#172033" stroke="#facc15" stroke-width="1.6"/><text x="40" y="214" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#facc15" text-anchor="start">event broker</text><path d="M112,130 L112,173" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M262,238 L262,191" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M430,130 L430,173" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M598,238 L598,191" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M680,130 L680,173" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="44" y="78" width="136" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="41" y="75" width="142" height="58" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0125;0.0275;0.0725;0.0875;1" values="0;0;1;1;0;0"/></rect><text x="112" y="102" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Order service</text><text x="112" y="119" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">order 7781</text><rect x="194" y="238" width="136" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="191" y="235" width="142" height="58" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.215;0.3225;0.3375;1" values="0;0;1;1;0;0"/></rect><text x="262" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Payments</text><text x="262" y="279" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">charges card</text><rect x="362" y="78" width="136" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="359" y="75" width="142" height="58" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4625;0.4775;0.5975;0.6125;1" values="0;0;1;1;0;0"/></rect><text x="430" y="102" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Restaurant</text><text x="430" y="119" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">starts cooking</text><rect x="530" y="238" width="136" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="527" y="235" width="142" height="58" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7375;0.7525;0.885;0.9;1" values="0;0;1;1;0;0"/></rect><text x="598" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Dispatch</text><text x="598" y="279" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">finds courier</text><rect x="612" y="78" width="136" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="609" y="75" width="142" height="58" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2625;0.2775;0.36;0.375;1" values="0;0;1;1;0;0"/></rect><text x="680" y="102" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Email</text><text x="680" y="119" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">sends receipt</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0375;0.0415;0.0835;0.0875;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0375;0.0875;1" path="M112,130 L112,182"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0875;0.0915;0.196;0.2;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0875;0.2;1" path="M112,182 L262,182 L262,238"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">OrderPlaced</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0875;0.0915;0.2585;0.2625;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0875;0.2625;1" path="M112,182 L680,182 L680,130"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3375;0.3415;0.4585;0.4625;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3375;0.4625;1" path="M262,238 L262,182 L430,182 L430,130"/><circle r="6" fill="#a78bfa"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">PaymentCaptured</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6125;0.6165;0.7335;0.7375;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6125;0.7375;1" path="M430,130 L430,182 L598,182 L598,238"/><circle r="6" fill="#60a5fa"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">FoodReady</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.375;0.39;0.935;0.95;1" values="0;0;1;1;0;0"/><path d="M755,104 L759.9,108.9 L769,99.1" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.875;0.89;0.96;0.975;1" values="0;0;1;1;0;0"/><path d="M673,264 L677.9,268.9 L687,259.1" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0875;0.1025;0.935;0.95;1" values="0;0;1;1;0;0"/><rect x="349.39" y="252.5" width="161.22" height="23" rx="11.5" fill="#facc15" fill-opacity="0.16" stroke="#facc15" stroke-width="1.2"/><text x="430" y="267.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle">all tagged order 7781</text></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Nobody calls anybody. Each service hears an event and publishes the next.</text></svg>
