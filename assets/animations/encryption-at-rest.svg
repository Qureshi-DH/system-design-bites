no-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle">data key</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2333;0.2373;0.3182;0.3222;1" values="0;0;1;1;0;0"/><animateMotion dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2333;0.3222;1" path="M196,175 L600,175"/><circle r="6" fill="#a78bfa"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">x9#Qf 7Lk2</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3556;0.3596;0.4404;0.4444;1" values="0;0;1;1;0;0"/><animateMotion dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3556;0.4444;1" path="M600,195 L196,195"/><circle r="6" fill="#a78bfa"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">x9#Qf 7Lk2</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4444;0.4484;0.496;0.5;1" values="0;0;1;1;0;0"/><animateMotion dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4444;0.5;1" path="M150,140 C150,97 250,97 310,97"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">unwrap key</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5111;0.5151;0.5627;0.5667;1" values="0;0;1;1;0;0"/><animateMotion dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5111;0.5667;1" path="M310,97 C250,97 150,97 150,140"/><circle r="6" fill="#facc15"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle">key</text></g><g><animateTransform type="translate" attributeName="transform" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6222;0.7111;0.9778;1" values="270,-100;270,-100;0,0;0,0;0,0"/><g><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6389;0.6722;0.9444;0.9778;1" values="0;0;1;1;0;0"/><path d="M330,246 v52 a75,10 0 0 0 150,0 v-52" fill="#1e293b" stroke="#f87171" stroke-width="1.6"/><ellipse cx="405" cy="246" rx="75" ry="10" fill="#172033" stroke="#f87171" stroke-width="1.6"/><text x="405" y="270" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Stolen snapshot</text><text x="405" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#a78bfa" text-anchor="middle">x9#Qf 7Lk2</text></g></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7222;0.7356;0.9533;0.9667;1" values="0;0;1;1;0;0"/><rect x="519.39" y="260.5" width="161.22" height="23" rx="11.5" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="600" y="275.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle">no KMS access, no key</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7556;0.7689;0.9533;0.9667;1" values="0;0;1;1;0;0"/><rect x="556.9" y="286.5" width="86.2" height="23" rx="11.5" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="600" y="301.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle">just noise</text></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Data on disk is scrambled. Only the app, with a key from KMS, can read it.</text></svg>
