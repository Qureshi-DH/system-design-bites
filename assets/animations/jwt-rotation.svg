<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">JWT rotation</title><desc id="desc">The auth service signs tokens with key k7 and the feed service checks them against its cached key set. Key k8 is published to the key set and the feed service fetches it. Signing switches to k8, and both new k8 tokens and older k7 tokens verify by key ID. Once the last k7 token has expired, k7 is removed.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">JWT ROTATION</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M121,150 L121,214" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><path d="M206,115 L320,115" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M470,115 C540,115 560,170 590,170" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M206,262 C400,262 500,236 590,236" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><rect x="36" y="80" width="170" height="70" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><rect x="33" y="77" width="176" height="76" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4;0.4133;0.4422;0.4556;1" values="0;0;1;1;0;0"/></rect><text x="121" y="108" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Auth service</text><text x="121" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#60a5fa" text-anchor="middle" opacity="0">signs with k7<animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3867;0.4;1" values="1;1;0;0"/></text><text x="121" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#a78bfa" text-anchor="middle" opacity="0">signs with k8<animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4;0.4133;0.9533;0.9667;1" values="0;0;1;1;0;0"/></text><rect x="36" y="214" width="170" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="121" y="240" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Key set (JWKS)</text><g><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7444;0.7778;0.9556;1" values="1;1;0;0;1"/><rect x="76.0" y="262" width="40" height="24" rx="12" fill="#60a5fa" fill-opacity="0.18" stroke="#60a5fa" stroke-width="1.4"/><text x="96" y="278.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle">k7</text></g><g><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.2222;0.9556;0.9889;1" values="0;0;1;1;0;0"/><rect x="126.0" y="262" width="40" height="24" rx="12" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa" stroke-width="1.4"/><text x="146" y="278.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle">k8</text></g><circle cx="146" cy="274" r="14" fill="none" stroke="#facc15" stroke-width="2" opacity="0"><animate attributeName="r" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2056;0.2944;1" values="14;14;34;34"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2056;0.2067;0.2944;1" values="0;0;0.9;0;0"/></circle><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7222;0.7356;0.7533;0.7667;1" values="0;0;1;1;0;0"/><path d="M89,267 L103,281 M103,267 L89,281" stroke="#f87171" stroke-width="3" stroke-linecap="round"/></g><rect x="320" y="80" width="150" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="395" y="113" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Mobile app</text><text x="395" y="130" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">holds tokens</text><rect x="590" y="140" width="176" height="120" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="678" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Feed service</text><text x="678" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">cached keys</text><g><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.8333;0.8667;0.9556;1" values="1;1;0;0;1"/><rect x="633.0" y="210" width="40" height="24" rx="12" fill="#60a5fa" fill-opacity="0.18" stroke="#60a5fa" stroke-width="1.4"/><text x="653" y="226.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle">k7</text></g><g><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3333;0.3556;0.9556;0.9889;1" values="0;0;1;1;0;0"/><rect x="683.0" y="210" width="40" height="24" rx="12" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa" stroke-width="1.4"/><text x="703" y="226.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle">k8</text></g><text x="395" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#facc15" text-anchor="middle" opacity="0">Signing with k7<animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1867;0.2;1" values="1;1;0;0"/></text><text x="395" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#facc15" text-anchor="middle" opacity="0">Step 1: publish k8, let caches fetch it<animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.2133;0.3867;0.4;1" values="0;0;1;1;0;0"/></text><text x="395" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#facc15" text-anchor="middle" opacity="0">Step 2: start signing with k8<animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4;0.4133;0.5978;0.6111;1" values="0;0;1;1;0;0"/></text><text x="395" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#facc15" text-anchor="middle" opacity="0">Step 3: retire k7 once its tokens expire<animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6111;0.6244;0.9533;0.9667;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0222;0.0262;0.0738;0.0778;1" values="0;0;1;1;0;0"/><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0222;0.0778;1" path="M206,115 L320,115"/><circle r="6" fill="#60a5fa"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">kid k7</text></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0889;0.0929;0.1516;0.1556;1" values="0;0;1;1;0;0"/><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0889;0.1556;1" path="M470,115 C540,115 560,170 590,170"/><circle r="6" fill="#60a5fa"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">kid k7</text></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1556;0.1689;0.2311;0.2444;1" values="0;0;1;1;0;0"/><rect x="621.26" y="104.5" width="113.48" height="23" rx="11.5" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="678" y="119.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">k7 token valid</text></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1778;0.1818;0.2071;0.2111;1" values="0;0;1;1;0;0"/><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1778;0.2111;1" path="M121,150 L121,214"/><circle r="5" fill="#a78bfa"></circle></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2556;0.2596;0.3404;0.3444;1" values="0;0;1;1;0;0"/><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2556;0.3444;1" path="M206,262 C400,262 500,236 590,236"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">refresh cache</text></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4333;0.4373;0.4849;0.4889;1" values="0;0;1;1;0;0"/><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4333;0.4889;1" path="M206,115 L320,115"/><circle r="6" fill="#a78bfa"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">kid k8</text></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5;0.504;0.5627;0.5667;1" values="0;0;1;1;0;0"/><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.5667;1" path="M470,115 C540,115 560,170 590,170"/><circle r="6" fill="#a78bfa"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">kid k8</text></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5667;0.58;0.62;0.6333;1" values="0;0;1;1;0;0"/><rect x="621.26" y="104.5" width="113.48" height="23" rx="11.5" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="678" y="119.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">k8 token valid</text></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6111;0.6151;0.6738;0.6778;1" values="0;0;1;1;0;0"/><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6111;0.6778;1" path="M470,115 C540,115 560,170 590,170"/><circle r="6" fill="#60a5fa"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">older kid k7</text></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6778;0.6911;0.7311;0.7444;1" values="0;0;1;1;0;0"/><rect x="587.16" y="104.5" width="181.68" height="23" rx="11.5" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="678" y="119.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">old k7 token still valid</text></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7667;0.7707;0.8404;0.8444;1" values="0;0;1;1;0;0"/><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7667;0.8444;1" path="M206,262 C400,262 500,236 590,236"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">refresh cache</text></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.8556;0.8689;0.9533;0.9667;1" values="0;0;1;1;0;0"/><rect x="552.11" y="104.5" width="215.78" height="23" rx="11.5" fill="#facc15" fill-opacity="0.16" stroke="#facc15" stroke-width="1.2"/><text x="660" y="119.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle">k7 retired, nobody logged out</text></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Publish k8 first, then sign with it. Retire k7 after its tokens expire.</text></svg>
