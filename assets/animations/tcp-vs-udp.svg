t></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2143;0.2314;0.39;0.4071;1" values="0;0;1;1;0;0"/><rect x="497.44" y="274" width="189.12" height="24" rx="12" fill="#fb923c" fill-opacity="0.16" stroke="#fb923c" stroke-width="1.2"/><text x="592" y="290.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">2 is gone, nobody waits</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4143;0.4314;0.94;0.9571;1" values="0;0;1;1;0;0"/><rect x="501.16" y="274" width="181.68" height="24" rx="12" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="592" y="290.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">done sooner, 2 skipped</text></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">TCP resends the lost packet and waits. UDP skips it and moves on.</text></svg>
