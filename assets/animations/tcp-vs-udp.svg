<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">TCP vs UDP</title><desc id="desc">Split view. On the left, TCP sends packets 1 to 4, packet 2 is lost, packets 3 and 4 wait while the receiver asks for 2 again, then all four reach the app in order. On the right, UDP loses packet 2 too, but delivers 1, 3 and 4 right away and finishes sooner.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">TCP VS UDP</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M400,66 L400,304" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><text x="200" y="78" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#facc15" text-anchor="middle">TCP</text><text x="200" y="97" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">resends, in order</text><path d="M128,140 L272,140" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="32" y="114" width="96" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="80" y="145.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Sender</text><rect x="272" y="114" width="96" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="320" y="145.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Receiver</text><text x="200" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">delivered to the app</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0429;0.0469;0.1817;0.1857;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0429;0.1857;1" path="M128,140 L272,140"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">1</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1143;0.1183;0.1817;0.1857;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1143;0.1857;1" path="M128,140 L200,140"/><circle r="6" fill="#22d3ee"><animate attributeName="fill" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1786" values="#22d3ee;#f87171"/></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">2</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1857;0.1897;0.3246;0.3286;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1857;0.3286;1" path="M128,140 L272,140"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">3</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2571;0.2611;0.396;0.4;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2571;0.4;1" path="M128,140 L272,140"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">4</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1857;0.2029;0.3971;0.4143;1" values="0;0;1;1;0;0"/><path d="M192,132 L208,148 M208,132 L192,148" stroke="#f87171" stroke-width="3" stroke-linecap="round"/></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3429;0.3469;0.4531;0.4571;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3429;0.4571;1" path="M272,140 L128,140"/><circle r="6" fill="#a78bfa"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">need 2</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4714;0.4754;0.6103;0.6143;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4714;0.6143;1" path="M128,140 L272,140"/><circle r="6" fill="#facc15"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle">2 again</text></g><rect x="107" y="218" width="36" height="34" rx="7" fill="#172033" stroke="#334155" stroke-width="1.4"/><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1929;0.21;0.94;0.9571;1" values="0;0;1;1;0;0"/><rect x="107" y="218" width="36" height="34" rx="7" fill="#4ade80" fill-opacity="0.22" stroke="#4ade80" stroke-width="1.8"/><text x="125" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle">1</text></g><rect x="157" y="218" width="36" height="34" rx="7" fill="#172033" stroke="#334155" stroke-width="1.4"/><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6214;0.6386;0.94;0.9571;1" values="0;0;1;1;0;0"/><rect x="157" y="218" width="36" height="34" rx="7" fill="#4ade80" fill-opacity="0.22" stroke="#4ade80" stroke-width="1.8"/><text x="175" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle">2</text></g><rect x="207" y="218" width="36" height="34" rx="7" fill="#172033" stroke="#334155" stroke-width="1.4"/><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3357;0.3529;0.6043;0.6214;1" values="0;0;1;1;0;0"/><rect x="207" y="218" width="36" height="34" rx="7" fill="#fb923c" fill-opacity="0.0" stroke="#fb923c" stroke-width="1.8"/><text x="225" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#fb923c" text-anchor="middle">3</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6214;0.6386;0.94;0.9571;1" values="0;0;1;1;0;0"/><rect x="207" y="218" width="36" height="34" rx="7" fill="#4ade80" fill-opacity="0.22" stroke="#4ade80" stroke-width="1.8"/><text x="225" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle">3</text></g><rect x="257" y="218" width="36" height="34" rx="7" fill="#172033" stroke="#334155" stroke-width="1.4"/><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4071;0.4243;0.6043;0.6214;1" values="0;0;1;1;0;0"/><rect x="257" y="218" width="36" height="34" rx="7" fill="#fb923c" fill-opacity="0.0" stroke="#fb923c" stroke-width="1.8"/><text x="275" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#fb923c" text-anchor="middle">4</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6214;0.6386;0.94;0.9571;1" values="0;0;1;1;0;0"/><rect x="257" y="218" width="36" height="34" rx="7" fill="#4ade80" fill-opacity="0.22" stroke="#4ade80" stroke-width="1.8"/><text x="275" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle">4</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3429;0.36;0.5971;0.6143;1" values="0;0;1;1;0;0"/><rect x="124.04" y="274" width="151.92" height="24" rx="12" fill="#fb923c" fill-opacity="0.16" stroke="#fb923c" stroke-width="1.2"/><text x="200" y="290.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">3 and 4 wait for 2</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6286;0.6457;0.94;0.9571;1" values="0;0;1;1;0;0"/><rect x="135.2" y="274" width="129.6" height="24" rx="12" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="200" y="290.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">all 4, in order</text></g><text x="592" y="78" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#facc15" text-anchor="middle">UDP</text><text x="592" y="97" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">no resends, no waiting</text><path d="M520,140 L664,140" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="424" y="114" width="96" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="472" y="145.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Sender</text><rect x="664" y="114" width="96" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="712" y="145.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Receiver</text><text x="592" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">delivered to the app</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0429;0.0469;0.1817;0.1857;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0429;0.1857;1" path="M520,140 L664,140"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">1</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1143;0.1183;0.1817;0.1857;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1143;0.1857;1" path="M520,140 L592,140"/><circle r="6" fill="#22d3ee"><animate attributeName="fill" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1786" values="#22d3ee;#f87171"/></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">2</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1857;0.1897;0.3246;0.3286;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1857;0.3286;1" path="M520,140 L664,140"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">3</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2571;0.2611;0.396;0.4;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2571;0.4;1" path="M520,140 L664,140"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">4</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1857;0.2029;0.3971;0.4143;1" values="0;0;1;1;0;0"/><path d="M584,132 L600,148 M600,132 L584,148" stroke="#f87171" stroke-width="3" stroke-linecap="round"/></g><rect x="499" y="218" width="36" height="34" rx="7" fill="#172033" stroke="#334155" stroke-width="1.4"/><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1929;0.21;0.94;0.