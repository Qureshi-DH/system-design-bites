<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Pareto principle</title><desc id="desc">A profile of a dashboard's 60 endpoints, sorted by total server time. The planned rewrite target, charting, turns out to be 2%. The top 3 endpoints take 78%, and GET /reports/summary alone takes 60%. One index and one batched query take it from 900 ms to 120 ms, and total server time drops to 48%.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">PARETO PRINCIPLE</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><rect x="40" y="96" width="9" height="9" rx="2" fill="#f87171"/><rect x="51.5" y="96" width="9" height="9" rx="2" fill="#fb923c"/><rect x="63" y="96" width="9" height="9" rx="2" fill="#fb923c"/><rect x="74.5" y="96" width="9" height="9" rx="2" fill="#475569"/><rect x="86" y="96" width="9" height="9" rx="2" fill="#475569"/><rect x="97.5" y="96" width="9" height="9" rx="2" fill="#475569"/><rect x="109" y="96" width="9" height="9" rx="2" fill="#475569"/><rect x="120.5" y="96" width="9" height="9" rx="2" fill="#475569"/><rect x="132" y="96" width="9" height="9" rx="2" fill="#475569"/><rect x="143.5" y="96" width="9" height="9" rx="2" fill="#475569"/><rect x="155" y="96" width="9" height="9" rx="2" fill="#475569"/><rect x="166.5" y="96" width="9" height="9" rx="2" fill="#475569"/><rect x="178" y="96" width="9" height="9" rx="2" fill="#475569"/><rect x="189.5" y="96" width="9" height="9" rx="2" fill="#475569"/><rect x="201" y="96" width="9" height="9" rx="2" fill="#475569"/><rect x="212.5" 