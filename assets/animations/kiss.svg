<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">KISS</title><desc id="desc">The same new order goes through two designs. The simple one stores it in Postgres and the restaurant tablet picks it up by polling every 5 seconds. The fancy one also stores it in Postgres, then passes it through Kafka, an event router, a notification service and a WebSocket gateway. Both tablets light up at the same moment, but the fancy design has four extra systems to run.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">KISS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><line x1="400" y1="62" x2="400" y2="312" stroke="#334155" stroke-width="1.4" stroke-dasharray="4 6"/><text x="204" y="76" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#facc15" text-anchor="middle">Simple: ships this week</text><path d="M126,119 L160,119" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M256,119 L290,119" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M208.0,164 L208.0,142" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><text x="220" y="157" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">poll every 5 s</text><rect x="30" y="96" width="96" height="46" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="78" y="123.55" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Customer app</text><rect x="160" y="96" width="96" height="46" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="208" y="123.55" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Order API</text><path d="M290,103 v32 a48,9 0 0 0 96,0 v-32" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="338" cy="103" rx="48" ry="9" fill="#172033" stroke="#475569" stroke-width="1.6"/><text x="338" y="122.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Postgres</text><text x="338" y="138.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">orders table</text><rect x="160" y="164" width="96" height="46" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="208" y="185" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Tablet</text><text x="208" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">restaurant</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0375;0.0415;0.0835;0.0875;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0375;0.0875;1" path="M126,119 L160,119"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,