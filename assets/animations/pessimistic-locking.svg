<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Pessimistic locking</title><desc id="desc">Buyer A locks seat 14C with SELECT FOR UPDATE. Buyer B asks for the same row and waits in line while a timer counts. A marks the seat held and commits, the lock passes to B, and B sees the seat is already held and gets a clean seat taken answer.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">PESSIMISTIC LOCKING</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M200,100 C360,100 380,155 570,155" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M200,236 C360,236 380,205 498,205 L570,205" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="40" y="72" width="160" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="120" y="98" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Buyer A</text><text x="120" y="115" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">hold seat 14C</text><rect x="40" y="208" width="160" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="120" y="234" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Buyer B</text><text x="120" y="251" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">hold seat 14C</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3714;0.3886;0.8971;0.9143;1" values="0;0;1;1;0;0"/><rect x="36.6" y="140" width="166.8" height="24" rx="12" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="120" y="156.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">seat held for 10 min</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4714;0.4886;0.8971;0.9143;1" values="0;0;1;1;0;0"/><rect x="47.76" y="278" width="144.48" height="24" rx="12" fill="#fb923c" fill-opacity="0.16" stroke="#fb923c" stroke-width="1.2"/><text x="120" y="294.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">sorry, seat taken</text></g><path d="M570,114 v132 a85,10 0 0 0 170,0 v-132" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="655" cy="114" rx="85" ry="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1143;0.1314;0.4686;0.4857;1" values="0;0;1;1;0;0"/><path d="M570,114 v132 a85,10 0 0 0 170,0 v-132" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><ellipse cx="655" cy="114" rx="85" ry="10" fill="#172033" stroke="#facc15" stroke-width="1.6"/></g><text x="655" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Postgres</text><text x="655" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">seat 14C</text><g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1929;0.2143;0.9143;0.9357;1" values="1;1;0;0;1;1"/><text x="655" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#4ade80" text-anchor="middle">free</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2143;0.2357;0.8929;0.9143;1" values="0;0;1;1;0;0"/><text x="655" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#fb923c" text-anchor="middle">held</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1143;0.1357;0.4643;0.4857;1" values="0;0;1;1;0;0"/><path d="M611,235 v-5 a5,5 0 0 1 10,0 v5" fill="none" stroke="#fb923c" stroke-width="2.2"/><rect x="608" y="235" width="16" height="12" rx="2.5" fill="#fb923c"/></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1143;0.1357;0.3214;0.3429;1" values="0;0;1;1;0;0"/><text x="630" y="240" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#facc15" text-anchor="start">locked by A</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3429;0.3643;0.4643;0.4857;1" values="0;0;1;1;0;0"/><text x="630" y="240" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#facc15" text-anchor="start">locked by B</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1571;0.1714;0.1857;0.2;1" values="0;0;1;1;0;0"/><text x="498" y="236" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">waits 1 ms</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.2143;0.2286;0.2429;1" values="0;0;1;1;0;0"/><text x="498" y="236" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">waits 2 ms</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2429;0.2571;0.2714;0.2857;1" values="0;0;1;1;0;0"/><text x="498" y="236" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">waits 3 ms</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2857;0.3048;0.3238;0.3429;1" values="0;0;1;1;0;0"/><text x="498" y="236" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">waits 4 ms</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0286;0.0326;0.1103;0.1143;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0286;0.1143;1" path="M200,100 C360,100 380,155 570,155"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">FOR UPDATE</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0714;0.0754;0.3389;0.3429;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0714;0.1571;1" path="M200,236 C360,236 380,205 498,205"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">FOR UPDATE</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1429;0.1469;0.2103;0.2143;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1429;0.2143;1" path="M200,100 C360,100 380,155 570,155"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">mark held</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2357;0.2397;0.296;0.3;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2357;0.3;1" path="M200,100 C360,100 380,155 570,155"/><circle r="6" fill="#4ade80"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">COMMIT</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3071;0.3111;0.3674;0.3714;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3071;0.3714;1" path="M570,155 C380,155 360,100 200,100"/><circle r="6" fill="#4ade80"></circle></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3429;0.3469;0.3746;0.3786;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3429;0.3786;1" path="M498,205 L570,205"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3857;0.3897;0.4531;0.4571;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3857;0.4571;1" path="M570,205 L498,205 C380,205 360,236 200,236"/><circle r="6" fill="#fb923c"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle">taken</text></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">B waits for A's lock, then sees the seat is taken. No double booking.</text></svg>
