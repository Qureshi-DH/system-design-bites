ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#22d3ee" text-anchor="start">cache</text><rect x="206" y="68" width="244" height="188" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="222" y="94" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#facc15" text-anchor="start">terraform plan</text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.1437;0.9062;0.925;1" values="0;0;1;1;0;0"/><circle cx="234" cy="128" r="11" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.6"/><path d="M229,128 L239,128 M234,123 L234,133" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round"/><text x="254" y="133" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="start">cache</text><text x="436" y="133" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="end">add</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.45;0.4688;0.4937;0.5125;1" values="0;0;1;1;0;0"/><rect x="216" y="112" width="224" height="32" rx="7" fill="#facc15" fill-opacity="0.12"/></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.175;0.1937;0.9062;0.925;1" values="0;0;1;1;0;0"/><circle cx="234" cy="166" r="11" fill="#facc15" fill-opacity="0.16" stroke="#facc15" stroke-width="1.6"/><path d="M228,167.5 C230,162 233,163 234,166 C235,169 238,170 240,164.5" fill="none" stroke="#facc15" stroke-width="2.2" stroke-linecap="round"/><text x="254" y="171" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-