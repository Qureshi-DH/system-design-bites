<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Outbox pattern</title><desc id="desc">The purchase API writes the ticket row and an outbox row in one database transaction, and both appear at the same commit. A relay reads the unsent outbox row and tries to publish, but Kafka is down, so the row waits as unsent. When Kafka comes back the relay publishes, the email service gets the event, and the row is marked sent.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">OUTBOX PATTERN</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><rect x="196" y="74" width="268" height="226" rx="12" fill="none" stroke="#facc15" stroke-width="1.4" stroke-dasharray="6 5" opacity="0.7"/><rect x="193" y="71" width="274" height="232" rx="14" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0938;0.1087;0.1663;0.1812;1" values="0;0;1;1;0;0"/></rect><text x="330" y="92" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#facc15" text-anchor="middle">one transaction</text><path d="M160,170 C188,170 190,151 216,151" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="16s" repeatCount="indefinite" values="0;-192"/></path><path d="M160,190 C188,190 190,243 216,243" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="16s" repeatCount="indefinite" values="0;-192"/></path><path d="M444,243 L500,243" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="16s" repeatCount="indefinite" values="0;-192"/></path><path d="M620,242 L660,242" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="16s" repeatCount="indefinite" values="0;-192"/></path><path d="M715,214 L715,154" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="16s" repeatCount="indefinite" values="0;-192"/></path><rect x="30" y="150" width="130" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="95" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Purchase API</text><text x="95" y="195" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">fan buys ticket</text><rect x="216" y="104" width="228" height="64" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><line x1="216" y1="134" x2="444" y2="134" stroke="#334155" stroke-width="1.4"/><text x="230" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="start">tickets</text><rect x="216" y="196" width="228" height="64" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><line x1="216" y1="226" x2="444" y2="226" stroke="#334155" stroke-width="1.4"/><text x="230" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="start">outbox</text><text x="230" y="157" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#4ade80" text-anchor="start" opacity="0">ticket 9812, show 77<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0938;0.1087;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><text x="230" y="249" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#22d3ee" text-anchor="start" opacity="0">TicketPurchased<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0938;0.1087;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0938;0.1087;0.7225;0.7375;1" values="0;0;1;1;0;0"/><rect x="374.54" y="232.5" width="58.92" height="23" rx="11.5" fill="#fb923c" fill-opacity="0.16" stroke="#fb923c" stroke-width="1.2"/><text x="404" y="247.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle">unsent</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7375;0.7525;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="381.36" y="232.5" width="45.28" height="23" rx="11.5" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="404" y="247.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">sent</text></g><circle cx="404" cy="244" r="14" fill="none" stroke="#fb923c" stroke-width="2" opacity="0"><animate attributeName="r" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2687;0.3688;1" values="14;14;34;34"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2687;0.27;0.3688;1" values="0;0;0.9;0;0"/></circle><circle cx="404" cy="244" r="14" fill="none" stroke="#fb923c" stroke-width="2" opacity="0"><animate attributeName="r" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4188;0.5188;1" values="14;14;34;34"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4188;0.42;0.5188;1" values="0;0;0.9;0;0"/></circle><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0938;0.1087;0.1912;0.2062;1" values="0;0;1;1;0;0"/><rect x="300.54" y="268.5" width="58.92" height="23" rx="11.5" fill="#facc15" fill-opacity="0.16" stroke="#facc15" stroke-width="1.2"/><text x="330" y="283.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle">commit</text></g><rect x="500" y="214" width="120" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="560" y="246.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Outbox relay</text><rect x="650" y="98" width="120" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="710" y="130.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Email service</text><rect x="660" y="214" width="110" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="657" y="211" width="116" height="62" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6125;0.6275;0.66;0.675;1" values="0;0;1;1;0;0"/></rect><text x="715" y="247.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Kafka</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.14;0.5225;0.5375;1" values="0;0;1;1;0;0"/><rect x="660" y="214" width="110" height="56" rx="10" fill="none" stroke="#f87171" stroke-width="1.6"/></g><text x="715" y="290" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle" opacity="0">down<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.14;0.5225;0.5375;1" values="0;0;1;1;0;0"/></text><text x="715" y="290" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle" opacity="0">back up<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5375;0.5525;0.6725;0.6875;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.029;0.0835;0.0875;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.025;0.0875;1" path="M160,170 C188,170 190,151 216,151"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.029;0.0835;0.0875;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.025;0.0875;1" path="M160,190 C188,190 190,243 216,243"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1625;0.