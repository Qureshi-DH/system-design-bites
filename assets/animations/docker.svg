<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Docker</title><desc id="desc">Each line of a Dockerfile adds a layer to the geocoder image, from Python at the bottom to the app code on top. The finished image is pushed to a registry as one unit, then a laptop, a CI runner and a production server all pull it and run the same version 42.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">DOCKER</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><rect x="28" y="76" width="192" height="200" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="44" y="102" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="start">Dockerfile</text><rect x="36" y="118" width="176" height="22" rx="5" fill="#facc15" fill-opacity="0.15" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0312;0.0413;0.0737;0.0837;1" values="0;0;1;1;0;0"/></rect><text x="44" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#e2e8f0" text-anchor="start">FROM python:3.12</text><rect x="36" y="146" width="176" height="22" rx="5" fill="#facc15" fill-opacity="0.15" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0837;0.0937;0.1262;0.1362;1" values="0;0;1;1;0;0"/></rect><text x="44" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#e2e8f0" text-anchor="start">RUN apt install geos</text><rect x="36" y="174" width="176" height="22" rx="5" fill="#facc15" fill-opacity="0.15" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1362;0.1462;0.1787;0.1887;1" values="0;0;1;1;0;0"/></rect><text x="44" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#e2e8f0" text-anchor="start">RUN pip install</text><rect x="36" y="202" width="176" height="22" rx="5" fill="#facc15" fill-opacity="0.15" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1888;0.1988;0.2312;0.2412;1" values="0;0;1;1;0;0"/></rect><text x="44" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#e2e8f0" text-anchor="start">COPY . .</text><rect x="36" y="230" width="176" height="22" rx="5" fill="#facc15" fill-opacity="0.15" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2412;0.2512;0.2838;0.2938;1" values="0;0;1;1;0;0"/></rect><text x="44" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#e2e8f0" text-anchor="start">CMD server.py</text><defs><marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><path d="M220,176 L254,176" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow1)"></path><path d="M392,214 C410,214 406,190 424,190" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M528,182 C556,182 550,104 578,104" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" 