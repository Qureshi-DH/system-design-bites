<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Service mesh</title><desc id="desc">Two pods, each with an app and a sidecar proxy. The control plane hands both sidecars their config and certificates. The home page app calls its own sidecar, the sidecars talk over an encrypted mTLS link, the first try times out and the sidecar retries on its own, and the metrics dashboard records it all.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">SERVICE MESH</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M325,80 C262,80 244,112 244,152" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity="0.6"></path><path d="M475,80 C538,80 556,112 556,152" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity="0.6"></path><path d="M244,218 C244,282 284,282 325,282" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><path d="M302,185 L498,185" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"></path><path d="M168,185 L186,185" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M614,185 L632,185" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="36" y="118" width="280" height="118" rx="10" fill="#172033" stro