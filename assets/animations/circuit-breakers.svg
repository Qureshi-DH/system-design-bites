<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Circuit breakers</title><desc id="desc">A trip service calls a maps API that is down. Three slow failures trip the circuit breaker open, and the next calls bounce back instantly without touching the network. After a cool down the breaker goes half open, one trial call succeeds because the maps API is back, and the breaker closes again.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">CIRCUIT BREAKERS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M190,172 L368,172" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M432,172 L610,172" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="40" y="142" width="150" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="115" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Trip service</text><text x="115" y="187" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">driver ETA</text><rect x="610" y="142" width="150" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="685" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Maps API</text><text x="685" y="187" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">down<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0187;0.0338;0.56;0.575;1" values="0;0;1;1;0;0"/></text><text x="685" y="187" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">back up<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.575;0.59;0.9475;0.9625;1" values="0;0;1;1;0;0"/></text><text x="685" y="187" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">down<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.9625;0.975;1" values="0;0;1;1"/></text><rect x="610" y="142" width="150" height="60" rx="10" fill="none" stroke-width="1.6"><animate attributeName="stroke" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5687;0.5813;0.9563;0.9688;1" values="#f87171;#f87171;#4ade80;#4ade80;#f87171;#f87171"/></rect><rect x="318" y="104" width="164" height="140" rx="10" fill="#172033" stroke="#facc15" stroke-width="1.6"/><text x="400" y="127" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Circuit breaker</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.029;0.1023;0.1063;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.025;0.0813;1" path="M192,172 L608,172"/><circle r="6" fill="#22d3ee"></circle></g><g opacit