<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Cache eviction</title><desc id="desc">A cache with 4 slots keeps profiles in order of last use. Reading Ben moves Ben to the most recent end. Then a new profile, Eve, arrives while the cache is full, so Ana, the least recently used, is pushed out and everyone else shifts down one slot.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">CACHE EVICTION</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M160,178 L210,178" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="40" y="148" width="120" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="100" y="183.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">App</text><rect x="210" y="72" width="470" height="190" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="445" y="98" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Redis cache, 4 slots, LRU</text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3812;0.3962;0.5475;0.5625;1" values="0;0;1;1;0;0"/><rect x="604.12" y="82" width="47.76" height="24" rx="12" fill="#fb923c" fill-opacity="0.16" stroke="#fb923c" stroke-width="1.2"/><text x="628" y="98.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">full</text></g><rect x="240" y="150" width="90" height="50" rx="10" fill="#172033" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="350" y="150" width="90" height="50" rx="10" fill="#172033" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="460" y="150" width="90" height="50" rx="10" fill="#172033" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="570" y="150" width="90" height="50" rx="10" fill="#172033" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4"/><text x="240" y="234" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">most recent</text><text x="660" y="234" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="end">least recent</text><path d="M330,230 L566,230" stroke="#334155" stroke-width="1.6"/><path d="M566,225 L576,230 L566,235 z" fill="#334155"/><text x="733" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle" opacity="0">evicted<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4875;0.5025;0.76;0.775;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0375;0.0415;0.096;0.1;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0375;0.1;1" path="M160,178 L222,178 C222,146 250,134 300,134 L505,134"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">GET Ben</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.204;0.2273;0.2313;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2;0.2313;1" path="M210,178 L160,178"/><circle r="6" fill="#4ade80"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">hit</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.325;0.329;0.3772;0.3812;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.325;0.3812;1" path="M160,178 L222,178 C222,146 250,134 285,134"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">SET Eve</text></g><g><animateTransform type="translate" attributeName="transform" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1437;0.1812;0.4625;0.5125;0.9437;0.945;1" values="0,0;0,0;110,0;110,0;220,0;220,0;0,0;0,0"/><g><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.9125;0.9375;0.95;0.9812;1" values="1;1;0;0;1;1"/><rect x="245" y="155" width="80" height="40" rx="9" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.6"/><text x="285" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">Dee</text></g></g><g><animateTransform type="translate" attributeName="transform" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1437;0.1812;0.4625;0.5125;0.9437;0.945;1" values="0,0;0,0;110,0;110,0;220,0;220,