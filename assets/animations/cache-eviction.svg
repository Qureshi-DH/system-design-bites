e="#f87171" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3937;0.4088;0.76;0.775;1" values="0;0;1;1;0;0"/></rect><text x="615" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">Ana</text></g></g><g><animateTransform type="translate" attributeName="transform" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5125;0.55;1" values="0,-46;0,-46;0,0;0,0"/><g><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5062;0.5312;0.9125;0.9375;1" values="0;0;1;1;0;0"/><rect x="245" y="155" width="80" height="40" rx="9" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.6"/><text x="285" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">Eve</text></g></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">A new key arrives in a full cache. The least recently used one is evicted.</text></svg>
