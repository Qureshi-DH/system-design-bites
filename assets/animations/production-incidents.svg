<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Production incidents</title><desc id="desc">At 19:05 the food delivery app's order success drops from 99 to 60 percent and an alert fires. A SEV1 is declared and a commander assigns an engineer to recent deploys and the support lead to the status page. The 18:58 deploy is rolled back, orders recover, and the status page goes from investigating to resolved.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">PRODUCTION INCIDENTS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.275;0.2938;0.9062;0.925;1" values="0;0;1;1;0;0"/><path d="M370,156 C370,180 320,176 320,200" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M430,156 C430,180 480,176 480,200" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M550,228 C600,228 682,236 682,212" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.425;0.4437;0.9062;0.925;1" values="0;0;1;1;0;0"/><path d="M320,256 L320,276" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite"