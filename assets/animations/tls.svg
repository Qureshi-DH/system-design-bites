<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">TLS</title><desc id="desc">The wallet app sends a hello with its key share. The server answers with its certificate and key share. The app checks that a trusted CA signed the certificate, the domain matches, and it has not expired. Both sides derive the same session keys without sending them, and from then on a snooper on the fake wifi hotspot sees only noise.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">TLS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M190,112 L610,112" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M190,150 L610,150" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M400,150 L400,236" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><rect x="40" y="96" width="150" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="115" y="129" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Wallet app</text><text x="115" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">client</text><rect x="610" y="96" width="150" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="685" y="129" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Server</text><text x="685" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">api.wallet.example</text><rect x="330" y="236" width="140" height="54" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.6"/><text x="400" y="261" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Snooper</text><text x="400" y="278" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">fake wifi hotspot</text><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4111;0.4244;0.9533;0.9667;1" values="0;0;1;1;0;0"/><rect x="68.49" y="66.5" width="93.02" height="23" rx="11.5" fill="#facc15" fill-opacity="0.16" stroke="#facc15" stroke-width="1.2"/><text x="115" y="81.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle">session key</text></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4111;0.4244;0.9533;0.9667;1" values="0;0;1;1;0;0"/><rect x="638.49" y="66.5" width="93.02" height="23" rx="11.5" fill="#facc15" fill-opacity="0.16" stroke="#facc15" stroke-width="1.2"/><text x="685" y="81.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle">session key</text></g><text x="400" y="82" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#facc15" text-anchor="middle" opacity="0">same keys on both ends, never sent<animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4111;0.4244;0.5644;0.5778;1" values="0;0;1;1;0;0"/></text><circle cx="115" cy="78" r="10" fill="none" stroke="#facc15" stroke-width="2" opacity="0"><animate attributeName="r" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4111;0.5;1" values="10;10;40;40"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4111;0.4122;0.5;1" values="0;0;0.9;0;0"/></circle><circle cx="685" cy="78" r="10" fill="none" stroke="#facc15" stroke-width="2" opacity="0"><animate attributeName="r" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4111;0.5;1" values="10;10;40;40"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4111;0.4122;0.5;1" values="0;0;0.9;0;0"/></circle><text x="40" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="0">client checks the certificate<animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2889;0.3022;0.9533;0.9667;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3;0.3133;0.9533;0.9667;1" values="0;0;1;1;0;0"/><path d="M46,212 L50.2,216.2 L58,207.8" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start" opacity="0">signed by a trusted CA<animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3;0.3133;0.9533;0.9667;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3333;0.3467;0.9533;0.9667;1" values="0;0;1;1;0;0"/><path d="M46,236 L50.2,240.2 L58,231.8" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66" y="240" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start" opacity="0">domain matches<animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3333;0.3467;0.9533;0.9667;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3667;0.38;0.9533;0.9667;1" values="0;0;1;1;0;0"/><path d="M46,260 L50.2,264.2 L58,255.8" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66" y="264" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start" opacity="0">not expired<animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3667;0.38;0.9533;0.9667;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0333;0.0373;0.1404;0.1444;1" values="0;0;1;1;0;0"/><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0333;0.1444;1" path="M190,112 L610,112"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">hello, key share</text></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1667;0.1707;0.2738;0.2778;1" values="0;0;1;1;0;0"/><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1667;0.2778;1" path="M610,150 L190,150"/><circle r="6" fill="#a78bfa"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">certificate, key share</text></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5111;0.5156;0.5956;0.6;1" values="0;0;1;1;0;0"/><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5111;0.6;1" path="M190,112 L610,112"/><circle r="11" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/><rect x="-7" y="-4" width="14" height="11" rx="2" fill="#facc15"/><path d="M-4.5,-4 v-3.5 a4.5,4.5 0 0 1 9,0 v3.5" fill="none" stroke="#facc15" stroke-width="2.2"/><text y="-17" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle">GET /balance</text></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6222;0.6267;0.7067;0.7111;1" values="0;0;1;1;0;0"/><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6222;0.7111;1" path="M610,150 L190,150"/><circle r="11" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/><rect x="-7" y="-4" width="14" height="11" rx="2" fill="#facc15"/><path d="M-4.5,-4 v-3.5 a4.5,4.5 0 0 1 9,0 v3.5" fill="none" stroke="#facc15" stroke-width="2.2"/><text y="-17" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle">200 OK</text></g><g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7333;0.7378;0.8178;0.8222;1" values="0;0;1;1;0;0"/><animateMotion dur="9s" repeatCount="indefini