-opacity="0.16" stroke="#22d3ee" stroke-width="1.2"/><text x="718" y="135.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">order 501</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.175;0.179;0.2397;0.2437;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.175;0.2437;1" path="M530,150 L386,150"/><circle r="6" fill="#4ade80"><animate attributeName="fill" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2313" values="#4ade80;#f87171"/></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">ok</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2437;0.2587;0.3475;0.3625;1" values="0;0;1;1;0;0"/><path d="M373,141 L391,159 M391,141 L373,159" stroke="#f87171" stroke-width="3" stroke-linecap="round"/></g><text x="144" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#fb923c" text-anchor="middle" opacity="0">waiting 1 s<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.265;0.335;0.35;1" values="0;0;1;1;0;0"/></text><text x="144" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#fb923c" text-anchor="middle" opacity="0">waiting 2 s<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.35;0.365;0.435;0.45;1" values="0;0;1;1;0;0"/></text><text x="144" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#f87171" text-anchor="middle" opacity="0">timeout at 3 s<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.45;0.465;0.5475;0.5625;1" values="0;0;1;1;0;0"/></text><text x="144" y="240" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#fb923c" text-anchor="middle" font-style="italic" opacity="0">dead, or just slow?<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.35;0.365;0.56;0.575;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.55;0.554;0.6585;0.6625;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.55;0.6625;1" path="M234,150 L530,150"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">retry 501</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6687;0.6837;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="678.31" y="152.5" width="79.38" height="23" rx="11.5" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="718" y="167.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle">order 501</text></g><text x="718" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle" opacity="0">twice<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6687;0.6837;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" d