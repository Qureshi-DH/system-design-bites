<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Cron jobs</title><desc id="desc">At 08:00 the clock fires. On the left the cron library runs inside three API replicas, so all three send the usage email and the customer gets it three times. On the right one Kubernetes CronJob fires once, checks whether today's report was already sent, and sends one email. A rare double run is skipped.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">CRON JOBS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><rect x="362" y="58" width="76" height="28" rx="14" fill="#1e293b" stroke="#facc15" stroke-width="1.4"/><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.135;0.15;1" values="1;1;0;0"/><text x="400" y="77" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">07:59</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.15;0.165;0.9475;0.9625;1" values="0;0;1;1;0;0"/><text x="400" y="77" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#facc15" text-anchor="middle">08:00</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.9625;0.975;1" values="0;0;1;1"/><text x="400" y="77" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" f