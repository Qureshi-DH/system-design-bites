<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">DRY</title><desc id="desc">A ride sharing surge cap drops from 3x to 2.5x. On the left the rule is copied in the rider app, the pricing service and the receipts job, and only pricing gets the change, so estimates run high and receipts disagree with charges. On the right only the pricing service holds the rule, the app asks it for a quote and receipts read the saved fare, so all agree.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">DRY</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><line x1="400" y1="62" x2="400" y2="312" stroke="#334155" stroke-width="1.4" stroke-dasharray="4 6"/><text x="208" y="76" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#facc15" text-anchor="middle">Rule in 3 places</text><rect x="30" y="150" width="96" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="78" y="172" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Rider app</text><rect x="160" y="150" width="96" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="208" y="172" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Pricing</text><rect x="290" y="150" width="96" height="56" rx="10" fill="#1e293b" stroke="#475