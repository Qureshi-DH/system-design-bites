;0.3375;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1937;0.2087;0.3225;0.3375;1" values="0;0;1;1;0;0"/><rect x="716.12" y="222" width="47.76" height="24" rx="12" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="740" y="238.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">5 ms</text></g><rect x="500" y="220" width="16" height="28" rx="3" fill="#4ade80" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3563;0.3713;0.5475;0.5625;1" values="0;0;1;1;0;0"/></rect><text x="200" y="210" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#22d3ee" text-anchor="start" opacity="0">after row 120,000<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3375;0.3525;0.5475;0.5625;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3563;0.3713;0.5475;0.5625;1" values="0;0;1;1;0;0"/><rect x="716.12" y="222" width="47.76" height="24" rx="12" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="740" y="238.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">5 ms</text></g><rect x="650" y="220" width="16" height="28" rx="3" fill="#4ade80" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5813;0.5963;0.9225;0.9375;1" values="0;0;1;1;0;0"/></rect><text x="200" y="210" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#22d3ee" text-anchor="start" opacity="0">