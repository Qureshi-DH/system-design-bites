<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Pagination</title><desc id="desc">Two ways to page through 200,000 wallet transactions. With offset pagination, each deeper page walks past more rows and throws them away, so page time grows from 5 ms to 2.4 seconds. With a cursor, the index jumps straight to the right spot and every page takes 5 ms.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">PAGINATION</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><text x="40" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e2e8f0" text-anchor="start">Offset</text><text x="40" y="145" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">skip, then scan</text><rect x="200" y="114" width="500" height="28" rx="4" fill="#172033" stroke="#334155"/><path d="M210,118 v20 M220,118 v20 M230,118 v20 M240,118 v20 M250,118 v20 M260,118 v20 M270,118 v20 M280,118 v20 M290,118 v20 M300,118 v20 M310,118 v20 M320,118 v20 M330,118 v20 M340,118 v20 M350,118 v20 M360,118 v20 M370,118 v20 M380,118 v20 M390,118 v20 M400,118 v20 M410,118 v20 M420,118 v20 M430,118 v20 M440,118 v20 M450,118 v20 M460,118 v20 M470,118 v20 M480,118 v20 M490,118 v20 M500,118 v20 M510,118 v20 M520,118 v20 M530,118 v20 M540,118 v20 M550,118 v20 M560,118 v20 M570,118 v20 M580,118 v20 M590,118 v20 M600,118 v20 M610,118 v20 M620,118 v20 M630,118 v20 M640,118 v20 M650,118 v20 M660,118 v20 M670,118 v20 M680,118 v20 M690,118 v20" stroke="#334155" stroke-width="1" opacity="0.7"/><text x="700" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">200,000 rows</text><rect x="200" y="114" width="0" height="28" rx="4" fill="#fb923c" fill-opacity="0.35" stroke="#fb923c" stroke-width="1"><animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.0312;0.1725;0.175;0.225;0.335;0.3375;0.4375;0.56;0.5625;0.7125;0.935;0.9375;1" values="0;0;0;0;0;150;150;0;300;300;0;450;450;0;0"/></rect><text x="200" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#fb923c" text-anchor="start" opacity="0">walked past, thrown away<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2062;0.2213;0.91;0.925;1" values="0;0;1;1;0;0"/></text><rect x="200" y="114" width="16" height="28" rx="3" fill="#4ade80" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0312;0.0462;0.16;0.175;1" values="0;0;1;1;0;0"/></rect><text x="200" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#22d3ee" text-anchor="start" opacity="0">offset 0<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.04;0.16;0.175;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0312;0.0462;0.16;0.175;1" values="0;0;1;1;0;0"/><rect x="716.12" y="116" width="47.76" height="24" rx="12" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="740" y="132.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-