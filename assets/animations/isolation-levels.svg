<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Isolation levels</title><desc id="desc">Two fans try to buy the last concert seat at the same moment. Both read 1 seat left before either writes. At read committed both writes land and the seat is sold twice. At serializable Fan B gets an error, retries, sees 0 seats and only one ticket exists.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">ISOLATION LEVELS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M400,64 L400,316" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><text x="206" y="74" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Read committed</text><path d="M128,120 C194,120 194,170 250,170" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M128,260 C194,260 194,206 250,206" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="32" y="96" width="96" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="32" y="236" width="96" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="80" y="116" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Fan A</text><text x="80" y="25