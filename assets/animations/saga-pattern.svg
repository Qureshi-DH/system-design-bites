-anchor="middle">step 2</text><rect x="315" y="98" width="170" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="400" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Hotel</text><text x="665" y="84" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">step 3</text><rect x="580" y="98" width="170" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="665" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Payment</text><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0562;0.075;0.9375;0.9563;1" values="1;1;0;0;1;1"/><text x="135" y="141" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">book seat</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.075;0.0938;0.5562;0.575;1" values="0;0;1;1;0;0"/><text x="135" y="141" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">seat 14A booked</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.575;0.5938;0.9187;0.9375;1" values="0;0;1;1;0;0"/><text x="135" y="141" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">cancelled</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.075;0.0938;0.5562;0.575;1" values="0;0;1;1;0;0"/><rect x="50" y="98" width="170" height="56" rx="10" fill="none" stroke="#4ade80" stroke-width="2"/></g><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1688;0.1875;0.9375;0.9563;1" values="1;1;0;0;1;1"/><text x="400" y="141" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">book room</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1875;0.2062;0.4313;0.45;1" values="0;0;1;1;0;0"/><text x="400" y="141" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">room booked</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.45;0.4688;0.9187;0.9375;1" values="0;0;1;1;0;0"/><text x="400" y="141" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">cancelled</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1875;0.2062;0.4313;0.45;1" values="0;0;1;1;0;0"/><rect x="315" y="98" width="170" height="56" rx="10" fill="none" stroke="#4ade80" stroke-width="2"/></g><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2812;0.3;0.9375;0.9563;1" values="1;1;0;0;1;1"/><text x="665" y="141" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">charge $860</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3;0.3187;0.9187;0.9375;1" values="0;0;1;1;0;0"/><text x="665" y="141" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">card declined</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3;0.3187;0.9187;0.9375;1" values="0;0;1;1;0;0"/><rect x="580" y="98" width="170" height="56" rx="10" fill="none" stroke="#f87171" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3625;0.3775;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="315" y="212" width="170" height="48" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="1.6"/><text x="400" y="234" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Cancel hotel</text><text x="400" y="251" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">undo step 2</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4875;0.5025;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="50" y="212" width="170" height="48" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="1.6"/><text x="135" y="234" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Cancel flight</text><text x="135" y="251" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">undo step 1</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.625;0.64;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="600.2" y="272" width="12