<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Chesterton's fence</title><desc id="desc">A nightly cron restarts the comments service at 4:00, and memory climbs 300 MB a day between restarts. Left: an engineer deletes the cron without asking why, memory climbs for 5 days and the service dies out of memory. Right: the engineer first finds the leak in old chat history, upgrades the library, watches memory stay flat for a week, and only then deletes the cron.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">CHESTERTON'S FENCE</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><text x="206" y="72" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="middle">Remove it first</text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.135;0.15;0.975;0.9833;1" values="1;1;0;0;1;1"/><path d="M176,111 L236,111" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path></g><text x="206" y="104" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">restarts<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.135;0.15;0.975;0.9833;1" values="1;1;0;0;1;1"/></text><text x="44" y="160" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">memory per server</text><path d="M44,268 L374,268" fill="none" stroke="#334155" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M44,178 L374,178" fill="none" stroke="#f87171" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><text x="374" y="172" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#f87171" text-anchor="end">memory limit</text><path d="M44,258 L74,242 L74,258 L104,242 L104,258" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round"/><text x="74" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">4:00 resets</text><g><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.1625;0.9375;0.975;0.9938;1" values="1;1;0.3;0.3;0.3;1;1"/><rect x="36" y="86" width="140" height="50" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="106" y="109" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Nightly cron</text><text x="106" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">restart at 4:00</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.14;0.9225;0.9375;1" values="0;0;1;1;0;0"/><path d="M92,97 L120,125 M120,97 L92,125" stroke="#f87171" stroke-width="3" stroke-linecap="round"/></g><rect x="236" y="86" width="140" height="50" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="306" y="109" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Comments</text><text x="306" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">service</text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.575;0.59;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="236" y="86" width="140" height="50" rx="10" fill="none" stroke="#f87171" stroke-width="2.5"/></g><path d="M104.0,258.0 L254.0,178.0" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="170.0 170.0" stroke-dashoffset="170.0"><animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.175;0.575;0.9738;0.975;1" values="170.0;170.0;0.0;0;170.0;170.0"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.9375;0.9625;0.975;0.9762;1" values="1;1;0;0;1;1"/></path><text x="179" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="end" opacity="0">+300 MB a day<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3;0.315;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.575;0.59;0.9225;0.9375;1" values="0;0;1;1;0;0"/><path d="M246,170 L262,186 M262,170 L246,186" stroke="#f87171" stroke-width="3" stroke-linecap="round"/></g><circle cx="254" cy="178" r="8" fill="none" stroke="#f87171" stroke-width="2" opacity="0"><animate attributeName="r" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.575;0.675;1" values="8;8;30;30"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.575;0.5762;0.675;1" values="0;0;0.9;0;0"/></circle><text x="260" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="start" opacity="0">day 5<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.575;0.59;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><text x="206" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">deleted it: no comment, no ticket<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.14;0.5475;0.5625;1" values="0;0;1;1;0;0"/></text><text x="206" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle" opacity="0">5 days later: out of memory, comments down<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.575;0.59;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><text x="594" y="72" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle">Ask why first</text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.635;0.65;0.975;0.9833;1" values="1;1;0;0;1;1"/><path d="M564,111 L624,111" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path></g><text x="594" y="104" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">restarts<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.635;0.65;0.975;0.9833;1" values="1;1;0;0;1;1"/></text><text x="432" y="160" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">memory per server</text><path d="M432,268 L762,268" fill="none" stroke="#334155" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M432,178 L762,178" fill="none" stroke="#f87171" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><text x="762" y="172" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#f87171" text-anchor="end">memory limit</text><path d="M432,258 L462,242 L462,258 L492,242 L492,258" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round"/><text x="462" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">4:00 resets</text><g><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.625;0.6625;0.9375;0.975;0.9938;1" values="1;1;0.3;0.3;0.3;1;1"/><rect x="424" y="86" width="140" height="50" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="421" y="83" width="146" height="56" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.075;0.09;0.2225;0.2375;1" values="0;0;1;1;0;0"/></rect><text x="494" y="109" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Nightly cron</text><text x="494" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">restart at 4:00</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.625;0.64;0.9225;0.9375;1" values="0;0;1;1;0;0"/><path d="M482,111 L490.4,119.4 L506,102.6" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="624" y="86" width="140" height="50" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="694" y="109" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Comments</text><text x="694" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">service</text><path d="M492.0,258.0 L522.0,242.0 L522.0,258.0 L762.0,258.0" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="290.0 290.0" stroke-dashoffset="290.0"><animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.175;0.2306;0.2307;0.675;0.9738;0.975;1" values="290.0;290.0;256.0;240.0;0.0;0;290.0;290.0"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.9375;0.9625;0.975;0.9762;1" values="1;1;0;0;1;1"/></path><text x="526" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="start" opacity="0">library upgraded<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.265;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><text x="627" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">flat for a week<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.45;0.465;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><line x1="732" y1="218" x2="732" y2="262" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3 3" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.625;0.64;0.9225;0.9375;1" values="0;0;1;1;0;0"/></line><text x="732" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle" opacity="0">then delete<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.625;0.64;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><text x="594" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#facc15" text-anchor="middle" opacity="0">old chat history: a leak in an image library<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.075;0.09;0.235;0.25;1" values="0;0;1;1;0;0"/></text><text x="594" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4ade80" text-anchor="middle" opacity="0">upgrade the library, watch memory stay flat<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.265;0.61;0.625;1" values="0;0;1;1;0;0"/></text><text x="594" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle" opacity="0">now the cron can go, with a commit message<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.625;0.64;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><path d="M400,62 L400,312" fill="none" stroke="#334155" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">The odd cron was hiding a 300 MB a day leak. Ask why, then remove it.</text></svg>
