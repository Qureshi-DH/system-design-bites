<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Gossip protocol</title><desc id="desc">Node 1 hears that node 23 is back up. In round 1 it tells node 2. In round 2 both of them tell one more node each, and in round 3 all four tell one more. After three rounds all 8 nodes know, with no central server involved.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">GOSSIP PROTOCOL</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.14;0.86;0.875;1" values="0;0;1;1;0;0"/><path d="M130,186 Q302,148 400,81" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"></path></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3;0.315;0.86;0.875;1" values="0;0;1;1;0;0"/><path d="M130,186 L209,260" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"></path></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3;0.315;0.86;0.875;1" values="0;0;1;1;0;0"/><path d="M400,81 Q498,148 670,186" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"></path></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.475;0.49;0.86;0.875;1" values="0