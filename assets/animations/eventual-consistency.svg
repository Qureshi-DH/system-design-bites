<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Eventual consistency</title><desc id="desc">Priya renames herself from Pri to Priya K. The write lands on the US replica and spreads to the EU and Asia replicas in the background. A friend in Berlin reads the EU replica too early and sees the old name. Moments later every replica has Priya K, and the friend's next read shows the new name.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">EVENTUAL CONSISTENCY</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M140,180 L190,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M330,170 C390,170 390,104 450,104" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity="0.6"><animate attributeName="stroke-dashoffset" dur="14s" repeatCount="indefinite" values="0;-168"/></path><path d="M330,200 C390,200 390,260 450,260" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity="0.6"><animate attributeName="stroke-dashoffset" dur="14s" repeatCount="indefinite" values="0;-168"/></path><path d="M650,104 L590,104" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><text x="410" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle" opacity="0">syncing<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1286;0.1457;0.4686;0.4857;1" values="0;0;1;1;0;0"/></text><rect x="24" y="150" width="116" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="82" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Priya's phone</text><text x="82" y="195" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">renames</text><rect x="650" y="76" width="120" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="710" y="102" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Friend</text><text x="710" y="119" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">in Berlin</text><path d="M190,152 v56 a70,10 0 0 0 140,0 v-56" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><ellipse cx="260" cy="152" rx="70" ry="10" fill="#172033" stroke="#facc15" stroke-width="1.6"/><ellipse cx="260" cy="180" rx="76" ry="44" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1143;0.1314;0.1543;0.1714;1" values="0;0;1;1;0;0"/></ellipse><path d="M450,76 v56 a70,10 0 0 0 140,0 v-56" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="520" cy="76" rx="70" ry="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><ellipse cx="520" cy="104" rx="76" ry="44" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2643;0.281;0.2