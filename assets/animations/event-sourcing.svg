<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Event sourcing</title><desc id="desc">A wallet service appends three events to an append only event store: AccountOpened, MoneyDeposited 100 and MoneyWithdrawn 30. The balance is computed, not saved as the truth. Replaying the events in order steps it from 0 to 100 to 70.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">EVENT SOURCING</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><rect x="210" y="74" width="330" height="208" rx="12" fill="#172033" stroke="#475569" stroke-width="1.4"/><text x="375" y="98" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">Event store, append only</text><path d="M170,112 C198,112 198,129.0 226,129.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M170,112 C198,112 198,169.0 226,169.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M170,112 C198,112 198,209.0 226,209.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M524,129.0 C564,129.0 560,180.0 600,180.0" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"></path><path d="M524,169.0 C564,169.0 560,180.0 600,180.0" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"></path><path d="M524,209.0 C564,209.0 560,180.0 600,180.0" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"></path><rect x="30" y="84" width="140" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="100" y="110" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Wallet service</text><text x="100" y="127" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">appends events</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.115;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="226" y="112" width="298" height="34" rx="7" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/><text x="240" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="start">#1 AccountOpened</text></g><rect x="223" y="109" width="304" height="40" rx="9" fill="none" stroke="#facc15" stroke-width="2.4" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.375;0.39;0.4475;0.4625;1" values="0;0;1;1;0;0"/></rect><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1875;0.2025;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="226" y="152" width="298" height="34" rx="7" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/><text x="240" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="start">#2 MoneyDeposited 100</text></g><rect x="223" y="149" width="304" height="40" rx="9" fill="none" stroke="#facc15" stroke-width="2.4" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4625;0.4775;0.535;0.55;1" values="0;0;1;1;0;0"/></rect><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.275;0.29;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="226" y="192" width="298" height="34" rx="7" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/><text x="240" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="start">#3 MoneyWithdrawn 30</text></g><rect x="223" y="189" width="304" height="40" rx="9" fill="none" stroke="#facc15" stroke-width="2.4" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.55;0.565;0.6225;0.6375;1" values="0;0;1;1;0;0"/></rect><rect x="226" y="232" width="298" height="34" rx="7" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="4 4"/><text x="375" y="254" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">next event appends here</text><rect x="600" y="130" width="160" height="100" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><rect x="597" y="127" width="166" height="106" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.575;0.59;0.66;0.675;1" values="0;0;1;1;0;0"/></rect><text x="680" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">Current balance</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4163;0.4313;1" values="1;1;0;0"/><text x="680" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="28" font-weight="700" fill="#64748b" text-anchor="middle">?</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4313;0.4463;0.5038;0.5188;1" values="0;0;1;1;0;0"/><text x="680" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="28" font-weight="700" fill="#e2e8f0" text-anchor="middle">$0</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5188;0.5338;0.5913;0.6063;1" values="0;0;1;1;0;0"/><text x="680" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="28" font-weight="700" fill="#e2e8f0" text-anchor="middle">$100</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6063;0.6213;0.935;0.95;1" values="0;0;1;1;0;0"/><text x="680" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="28" font-weight="700" fill="#4ade80" text-anchor="middle">$70</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.95;0.965;1" values="0;0;1;1"/><text x="680" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="28" font-weight="700" fill="#64748b" text-anchor="middle">?</text></g><text x="680" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">computed from events</text><text x="680" y="116" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#facc15" text-anchor="middle" opacity="0">replaying<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3625;0.3775;0.635;0.65;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0438;0.0478;0.096;0.1;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0438;0.1;1" path="M170,112 C198,112 198,129.0 226,129.0"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1313;0.1353;0.1835;0.1875;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1313;0.1875;1" path="M170,112 C198,112 198,169.0 226,169.0"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2188;0.2228;0.271;0.275;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2188;0.275;1" path="M170,112 C198,112 198,209.0 226,209.0"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3812;0.3852;0.4273;0.4313;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3812;0.4313;1" path="M524,129.0 C564,129.0 560,180.0 600,180.0"/><circle r="6" fill="#facc15"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4688;0.4728;0.5148;0.5188;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4688;0.5188;1" path="M524,169.0 C564,169.0 560,180.0 600,180.0"/><circle r="6" fill="#facc15"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5563;0.5603;0.6023;0.6063;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5563;0.6063;1" path="M524,209.0 C564,209.0 560,180.0 600,180.0"/><circle r="6" fill="#facc15"></circle></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Events are only appended. Replay them in order and you get the balance.</text></svg>
