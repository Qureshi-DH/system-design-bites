<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Encryption in transit</title><desc id="desc">Before: TLS ends at the load balancer, so the hops to the trip service and to Postgres travel in plain text and a compromised container reads the rider's GPS and card token. After: every hop is locked, and the same snooper sees only noise.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">ENCRYPTION IN TRANSIT</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4725;0.4875;1" values="1;1;0;0"/><rect x="286.84" y="60" width="226.32" height="24" rx="12" fill="#fb923c" fill-opacity="0.16" stroke="#fb923c" stroke-width="1.2"/><text x="400" y="76.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">before: TLS only at the edge</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5;0.515;0.96;0.975;1" values="0;0;1;1;0;0"/><rect x="305.44" y="60" width="189.12" height="24" rx="12" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="400" y="76.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">after: TLS on every hop</text></g><path d="M156,150 L220,150" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M350,150 L414,150" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M544,150 L610,150" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M382,208 L405,240" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><path d="M577,208 L465,240" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><rect x="36" y="122" width="120" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="96" y="154.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Rider app</text><rect x="220" y="122" width="130" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="285" y="154.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Load balancer</text><rect x="414" y="122" width="130" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="479" y="154.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Trip service</text><path d="M610,114 v72 a75,10 0 0 0 150,0 v-72" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="685" cy="114" rx="75" ry="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><text x="685" y="154" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Postgres</text><text x="685" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">trips</text><rect x="330" y="240" width="180" height="54" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.6"/><text x="420" y="265" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Snooper</text><text x="420" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">compromised container</text><rect x="180" y="171" width="16" height="12" rx="2.5" fill="#4ade80"/><path d="M183,171 v-4 a5,5 0 0 1 10,0 v4" fill="none" stroke="#4ade80" stroke-width="2.4"/><text x="188" y="200" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">TLS</text><g><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4875;0.5;0.975;1" values="1;1;0;0;1"/><rect x="374" y="171" width="16" height="12" rx="2.5" fill="#f87171"/><path d="M387,171 v-4 a5,5 0 0 0 -10,0 v-2" fill="none" stroke="#f87171" stroke-width="2.4"/><text x="382" y="200" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle">plain</text></g><g><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4875;0.5;0.975;1" values="0;0;1;1;0"/><rect x="374" y="171" width="16" height="12" rx="2.5" fill="#4ade80"/><path d="M377,171 v-4 a5,5 0 0 1 10,0 v4" fill="none" stroke="#4ade80" stroke-width="2.4"/><text x="382" y="200" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">TLS</text></g><g><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4875;0.5;0.975;1" va