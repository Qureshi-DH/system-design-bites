<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Idempotency</title><desc id="desc">A food delivery app sends a POST with idempotency key 7f3a. The order service saves order 1001 with the key and charges the card, but the reply is lost on the way back. The app retries with the same key, the service finds the key, returns the saved order and the charge counter stays at 1.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">IDEMPOTENCY</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M170,160 L320,160" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M480,160 L600,160" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="40" y="130" width="130" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="105" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Mobile app</text><text x="105" y="175" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">Place order</text><rect x="320" y="130" width="160" height="60" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="400" y="165.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Order service</text><path d="M600,106 v108 a80,10 0 0 0 160,0 v-108" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="680" cy="106" rx="80" ry="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><text x="680" y="132" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Database</text><text x="680" y="150" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">idempotency keys</text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1812;0.1962;0.935;0.95;1" values="0;0;1;1;0;0"/><rect x="614" y="164" width="132" height="30" rx="6" fill="#172033" stroke="#4ade80" stroke-width="1.2"/><text x="680" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">7f3a: order 1001</text></g><rect x="611" y="161" width="138" height="36" rx="8" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5625;0.5775;0.6475;0.6625;1" values="0;0;1;1;0;0"/></rect><rect x="320" y="236" width="160" height="66" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="400" y="258" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">Card charges</text><text x="400" y="290" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#e2e8f0" text-anchor="middle" opacity="0">0<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1663;0.1812;1" values="1;1;0;0"/></text><text x="400" y="290" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#e2e8f0" text-anchor="middle" opacity="0">1<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1812;0.1962;0.935;0.95;1" values="0;0;1;1;0;0"/></text><text x="400" y="290" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#e2e8f0" text-anchor="middle" opacity="0">0<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.95;0.965;1" values="0;0;1;1"/></text><circle cx="400" cy="282" r="14" fill="none" stroke="#4ade80" stroke-width="2" opacity="0"><animate attributeName="r" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1812;0.2812;1" values="14;14;34;34"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1812;0.1825;0.2812;1" values="0;0;0.9;0;0"/></circle><circle cx="400" cy="282" r="14" fill="none" stroke="#facc15" stroke-width="2" opacity="0"><animate attributeName="r" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.675;0.775;1" values="14;14;34;34"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.675;0.6763;0.775;1" values="0;0;0.9;0;0"/></circle><text x="520" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#4ade80" text-anchor="start" opacity="0">still 1<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.675;0.69;0.935;0.95;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0375;0.0415;0.1085;0.1125;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0375;0.1125;1" path="M172,160 L318,160"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">key 7f3a</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.129;0.171;0.175;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.125;0.175;1" path="M482,160 L598,160"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">save</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.204;0.2397;0.2437;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2;0.2437;1" path="M318,160 L246,160"/><circle r="6" fill="#4ade80"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">200 OK</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2437;0.2587;0.335;0.35;1" values="0;0;1;1;0;0"/><path d="M238,152 L254,168 M254,152 L238,168" stroke="#f87171" stroke-width="3" stroke-linecap="round"/></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2437;0.2587;0.385;0.4;1" values="0;0;1;1;0;0"/><rect x="199.8" y="104" width="92.4" height="24" rx="12" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="246" y="120.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">reply lost</text></g><text x="105" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" opacity="0">no reply<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2875;0.3025;0.36;0.375;1" values="0;0;1;1;0;0"/></text><text x="105" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" opacity="0">retry, same key<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.375;0.39;0.7225;0.7375;1" values="0;0;1;1;0;0"/></text><text x="105" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" opacity="0">1 order<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7375;0.7525;0.935;0.95;1" values="0;0;1;1;0;0"/></text><text x="105" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.95;0.965;1" values="0;0;1;1"/></text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4125;0.4165;0.4835;0.4875;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4125;0.4875;1" path="M172,160 L318,160"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">key 7f3a</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5;0.504;0.5523;0.5563;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.5563;1" path="M482,160 L598,160"/><circle r="6" fill="#facc15"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle">seen 7f3a?</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5938;0.5978;0.6398;0.6438;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5938;0.6438;1" path="M598,160 L482,160"/><circle r="6" fill="#4ade80"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">yes, 1001</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6562;0.6603;0.7272;0.7312;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6562;0.7312;1" path="M318,160 L172,160"/><circle r="6" fill="#4ade80"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">order 1001</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7375;0.7525;0.935;0.95;1" values="0;0;1;1;0;0"/><path d="M96,112 L102.3,118.3 L114,105.7" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">The retry reuses key 7f3a, so the server returns order 1001. One charge.</text></svg>
