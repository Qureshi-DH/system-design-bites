<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Rate limiting</title><desc id="desc">A user and a bot send requests through a rate limiter with a token bucket per client. The bot spends its five tokens in about two seconds and every request after that bounces back with a 429. The user's requests always pass through to the auth service.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">RATE LIMITING</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M180,112 C240,112 250,150 300,150" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M180,248 C240,248 250,210 300,210" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M500,180 L610,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="40" y="84" width="140" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="110" y="110" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">User</text><text x="110" y="127" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">3 requests a minute</text><rect x="40" y="220" width="140" height="56" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="1.6"/><text x="110" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Bot</text><text x="110" y="263" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">1,000 a minute</text><rect x="300" y="96" width="200" height="168" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="400" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Rate limiter</text><text x="400" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">token bucket per client</text><text x="318" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">user</text><text x="318" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">bot</text><rect x="610" y="150" width="150" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="685" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Auth service</text><text x="685" y="195" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">only real traffic</text><rect x="360" y="167" width="20" height="20" rx="5" fill="#facc15"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.15;0.17;0.925;0.975;1" values="1;1;0.12;0.12;1;1"/></rect><rect x="386" y="167" width="20" height="20" rx="5" fill="#facc15"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.65;0.67;0.925;0.975;1" values="1;1;0.12;0.12;1;1"/></rect><rect x="412" y="167" width="20" height="20" rx="5" fill="#facc15"/><rect x="438" y="167" width="20" height="20" rx="5" fill="#facc15"/><rect x="464" y="167" width="20" height="20" rx="5" fill="#facc15"/><rect x="360" y="211" width="20" height="20" rx="5" fill="#fb923c"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1333;0.1533;0.925;0.975;1" values="1;1;0.12;0.12;1;1"/></rect><rect x="386" y="211" width="20" height="20" rx="5" fill="#fb923c"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2167;0.2367;0.925;0.975;1" values="1;1;0.12;0.12;1;1"/></rect><rect x="412" y="211" width="20" height="20" rx="5" fill="#fb923c"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3;0.32;0.925;0.975;1" values="1;1;0.12;0.12;1;1"/></rect><rect x="438" y="211" width="20" height="20" rx="5" fill="#fb923c"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3833;0.4033;0.925;0.975;1" values="1;1;0.12;0.12;1;1"/></rect><rect x="464" y="211" width="20" height="20" rx="5" fill="#fb923c"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4667;0.4867;0.925;0.975;1" values="1;1;0.12;0.12;1;1"/></rect><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.05;0.054;0.146;0.15;1" values="0;0;1;1;0;0"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.05;0.15;1" path="M180,112 C240,112 250,150 300,150"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.175;0.179;0.2627;0.2667;1" va