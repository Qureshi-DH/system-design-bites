<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Distributed tracing</title><desc id="desc">A ride request with trace ID abc goes from the rider app to the gateway, then to matching, which calls the maps service six times, one after another. Each hop draws a span bar on a shared timeline as it happens. When the request finishes after 2.4 seconds, the six sequential maps calls light up as the slow part.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">DISTRIBUTED TRACING</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M166,88 L226,88" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M356,88 L416,88" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M546,88 L606,88" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="36" y="64" width="130" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="101" y="93.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Rider app</text><rect x="226" y="64" width="130" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="291" y="93.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Gateway</text><rect x="