<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">CI/CD</title><desc id="desc">Two commits ride a pipeline of build, test, staging and production. The first passes every stage, each box turning green, and ships. The second fails its tests, the line stops, staging and production are skipped, and the author is pinged.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">CI/CD</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M100,226 L700,226" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="100" cy="226" r="5" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><circle cx="250" cy="226" r="5" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><circle cx="400" cy="226" r="5" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><circle cx="550" cy="226" r="5" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><circle cx="700" cy="226" r="5" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="41" y="116" width="118" height="64" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="100" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Developer</text><text x="100" y="163" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">git push</text><rect x="191" y="116" width="118" height="64" rx=