eight="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="91" y="106.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Alice</text><rect x="36" y="152" width="110" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="33" y="149" width="116" height="50" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.04;0.41;0.425;1" values="0;0;1;1;0;0"/></rect><text x="91" y="178.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Bob</text><rect x="36" y="224" width="110" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="33" y="221" width="116" height="50" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.475;0.49;0.91;0.925;1" values="0;0;1;1;0;0"/></rect><text x="91" y="250.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Chen</text><rect x="210" y="80" width="120" height="44" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.6"/><text x="270" y="106.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Admin</text><rect x="210" y="152" width="120" height="44" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.6"/><text x="270" y="178.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Editor</text><rect x="210" y="224" width="120" height="44" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.6"/><text x="270" y="250.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Billing</text><rect x="400" y="82" width="170" height="40" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="485" y="106.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">reports.write</text><rect x="400" y="154" width="170" height="40" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="485" y="178.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">invoices.refund</text><rect x="400" y="226" width="170" height="40" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="485" y="250.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">users.manage</text><rect x="397" y="151" width="176" height="46" rx="13" fill="none" stroke="#4ade80" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.625;0.64;0.91;0.925;1" values="0;0;1;1;0;0"/></rect><rect x="626" y="146" width="146" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="699" y="172" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Refund endpoint</text><text x="699" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">checks one permission</text><text x="699" y="132" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#22d3ee" text-anchor="middle" opacity="0">Bob asks for a refund<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.04;0.41;0.425;1" values="0;0;1;1;0;0"/></text><text x="699" y="132" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#22d3ee" text-anchor="middle" opacity="0">Chen asks for a refund<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.475;0.49;0.91;0.925;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0625;0.0665;0.1085;0.1125;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0625;0.1125;1" path="M146,174 L210,174"/><circle r="5" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1187;0.1227;0.171;0.175;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1187;0.175;1" path="M330,174 C365,174 365,102 400,102"/><circle r="5" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.215;0.41;0.425;1" values="0;0;1;1;0;0"/><path d="M691,228 L707,244 M707,228 L691,244" stroke="#f87171" stroke-width="3" stroke-linecap="round"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.215;0.41;0.425;1" values="0;0;1;1;0;0"/><rect x="641.64" y="256" width="114.72" height="24" rx="12" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="699" y="272.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">403 Forbidden</text></g><text x="485" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#f87171" text-anchor="middle" opacity="0">Bob has no invoices.refund<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.215;0.41;0.425;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5125;0.5165;0.5585;0.5625;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5125;0.5625;1" path="M146,246 L210,246"/><circle r="5" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5687;0.5727;0.621;0.625;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5687;0.625;1" path="M330,246 C365,246 365,174 400,174"/><circle r="5" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6312;0.6352;0.671;0.675;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6312;0.675;1" path="M570,174 L626,174"/><circle r="5" fill="#4ade80"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6813;0.6963;0.91;0.925;1" values="0;0;1;1;0;0"/><path d="M691,236 L696.6,241.6 L707,230.4" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6813;0.6963;0.91;0.925;1" values="0;0;1;1;0;0"/><rect x="634.2" y="256" width="12