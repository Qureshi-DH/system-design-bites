<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Head of line blocking</title><desc id="desc">A server sends three dashboard widgets: revenue, users and orders. The users packet is lost. Over TCP, the orders packet arrives but sits in the phone's buffer until users is resent. Over QUIC, orders goes straight to the dashboard and only the users widget waits.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">HEAD OF LINE BLOCKING</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><text x="40" y="72" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="start">HTTP/2 over TCP</text><text x="186" y="72" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">one line for every stream</text><text x="675" y="72" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Dashboard</text><path d="M140,118 L340,118" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M510,118 L590,118" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="40" y="92" width="100" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="90" y="123.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Server</text><rect x="340" y="88" width="170" height="60" rx="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><text x="425" y="103" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">phone buffer</text><rect x="590" y="80" width="170" height="78" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.05;0.054;0.2293;0.2333;1" values="0;0;1;1;0;0"/><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.05;0.2333;1" path="M140,118 L590,118"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.104;0.1377;0.1417;1" values="0;0;1;1;0;0"/><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1;0.1417;1" path="M140,118 L240,118"/><circle r="6" fill="#a78bfa"><animate attributeName="fill" dur="6s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1333" values="#a78bfa;#f87171"/></circle></g><g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1417;0.1617;0.4133;0.4333;1" values="0;0;1;1;0;0"/><path d="M233,111 L247,125 M247,111 L233,125" stroke="#f87171" stroke-width="3" stroke-linecap="round"/></g><g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.15;0.154;0.546;0.55;1" values="0;0;1;1;0;0"/><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.15;0.2833;1" path="M140,118 L470,118"/><circle r="6" fill="#60a5fa"></circle></g><g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4;0.404;0.546;0.55;1" values="0;0;1;1;0;0"/><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4;0.5217;1" path="M140,118 L440,118"/><circle r="6" fill="#a78bfa"></circle></g><text x="150" y="106" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="start" opacity="0">users resent<animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3833;0.4033;0.5133;0.5333;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.55;0.554;0.6043;0.6083;1" values="0;0;1;1;0;0"/><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.55;0.6083;1" path="M440,118 L590,118"/><circle r="6" fill="#a78bfa"></circle></g><g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5533;0.5573;0.5993;0.6033;1" values="0;0;1;1;0;0"/><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5533;0.6033;1" path="M470,118 L590,118"/><circle r="6" fill="#60a5fa"></circle></g><g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2917;0.3117;0.53;0.55;1" values="0;0;1;1;0;0"/><rect x="334.16" y="152" width="181.68" height="24" rx="12" fill="#fb923c" fill-opacity="0.16" stroke="#fb923c" stroke-width="1.2"/><text x="425" y="168.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">orders waits for users</text></g><rect x="602" y="88" width="146" height="19" rx="4" fill="none" stroke="#334155" stroke-width="1.2"/><rect x="602" y="88" width="146" height="19" rx="4" fill="#22d3ee