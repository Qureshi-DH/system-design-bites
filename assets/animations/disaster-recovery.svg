<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Disaster recovery</title><desc id="desc">Clients reach the payments API in the primary region while its database replicates to a pilot light DR region with servers off. The primary region goes dark. The DR plan starts the standby servers, promotes the replica and points DNS at the DR region, and traffic flows there.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">DISASTER RECOVERY</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M140,136 L176,136" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2563;0.275;0.925;0.9438;1" values="1;1;0;0;1;1"/><path d="M276,128 C312,128 312,124 344,124" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.275;0.2938;0.9062;0.925;1" values="0;0;1;1;0;0"/><path d="M276,128 C312,128 312,124 344,124" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"></path></g><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5312;0.55;0.925;0.9438;1" values="1;1;0;0;1;1"/><path d="M276,144 C318,144 306,258 344,258" fill="none" stroke="#334155" stroke-width="2"