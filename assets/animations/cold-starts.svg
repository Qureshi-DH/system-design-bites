<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Cold starts</title><desc id="desc">A fan's first request finds no warm copy of the function, so the platform starts a VM, loads the code, boots the JVM, and runs init while the fan waits 4.2 seconds. The second request lands on the warm copy and returns in 80 milliseconds. After sitting idle, the copy is reclaimed and the next request will be cold again.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">COLD STARTS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M170,180 L420,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="40" y="148" width="130" height="64" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="105" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Fan</text><text x="105" y="195" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">buys a ticket</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0875;0.1025;0.41;0.425;1" values="0;0;1;1;0;0"/><rect x="72.13" y="224.5" width="65.74" height="23" rx="11.5" fill="#fb923c" fill-opacity="0.16" stroke="#fb923c" stroke-width="1.2"/><text x="105" y="239.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle">waiting</text></g><rect x="420" y="110" width="190" height="140" rx="10" fill="#172033" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 5"/><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0875;0.1025;0.36;0.375;1" values="0;0;1;1;0;0"/><rect x="420" y="110" width="190" height="140" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.375;0.39;0.56;0.575;1" values="0;0;1;1;0;0"/><rect x="420" y="110" width="190" height="140" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.6"/><rect x="417" y="107" width="196" height="146" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4625;0.4775;0.51;0.525;1" values="0;0;1;1;0;0"/></rect></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.575;0.59;0.76;0.775;1" values="0;0;1;1;0;0"/><rect x="420" y="110" width="190" height="140" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/></g><text x="515" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Function copy</text><text x="515" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle" opacity="0">no warm copy<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0725;0.0875;1" values="1;1;0;0"/></text><text x="515" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#fb923c" text-anchor="middle" opacity="0">booting<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0875;0.1025;0.36;0.375;1" values="0;0;1;1;0;0"/></text><text x="515" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#4ade80" text-anchor="middle" opacity="0">warm<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.375;0.39;0.56;0.575;1" values="0;0;1;1;0;0"/></text><text x="515" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">idle<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.575;0.59;0.76;0.775;1" values="0;0;1;1;0;0"/></text><text x="515" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle" opacity="0">reclaimed<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.775;0.79;1" values="0;0;1;1"/></text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0875;0.1025;0.36;0.375;1" values="0;0;1;1;0;0"/><rect x="440" y="200" width="150" height="10" rx="3" fill="#172033" stroke="#334155"/><rect x="440" y="200" width="0" height="10" rx="3" fill="#fb923c"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0875;0.3625;1" values="0;0;150;150"/></rect></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.575;0.59;0.76;0.775;1" values="0;0;1;1;0;0"/><rect x="440" y="200" width="150" height="10" rx="3" fill="#172033" stroke="#334155"/><rect x="440" y="200" width="150" height="10" rx="3" fill="#64748b"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.575;0.775;1" values="150;150;0;0"/></rect></g><text x="515" y="230" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">4 s of boot<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0875;0.1025;0.36;0.375;1" values="0;0;1;1;0;0"/></text><text x="515" y="230" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">shut down when idle<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.575;0.59;0.76;0.775;1" values="0;0;1;1;0;0"/></text><text x="640" y="116" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">cold start steps</text><text x="660" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">start VM</text><text x="660" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start" opacity="0">start VM<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.15;0.165;0.76;0.775;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.15;0.165;0.76;0.775;1" values="0;0;1;1;0;0"/><path d="M641,137 L645.2,141.2 L653,132.8" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="660" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">load 80 MB code</text><text x="660" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start" opacity="0">load 80 MB code<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.225;0.24;0.76;0.775;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.225;0.24;0.76;0.775;1" values="0;0;1;1;0;0"/><path d="M641,163 L645.2,167.2 L653,158.8" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="660" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">boot JVM</text><text x="660" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start" opacity="0">boot JVM<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3;0.315;0.76;0.775;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3;0.315;0.76;0.775;1" values="0;0;1;1;0;0"/><path d="M641,189 L645.2,193.2 L653,184.8" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="660" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">run init</text><text x="660" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start" opacity="0">run init<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3625;0.3775;0.76;0.775;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3625;0.3775;0.76;0.775;1" values="0;0;1;1;0;0"/><path d="M641,215 L645.2,219.2 L653,210.8" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.029;0.0835;0.0875;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.025;0.0875;1" path="M170,180 L420,180"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">request 1</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.375;0.379;0.421;0.425;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.375;0.425;1" path="M420,180 L170,180"/><circle r="6" fill="#4ade80"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.425;0.44;0.935;0.95;1" values="0;0;1;1;0;0"/><rect x="245.08" y="140.5" width="99.84" height="23" rx="11.5" fill="#fb923c" fill-opacity="0.16" stroke="#fb923c" stroke-width="1.2"/><text x="295" y="155.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle">first: 4.2 s</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4625;0.4665;0.4898;0.4938;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linea