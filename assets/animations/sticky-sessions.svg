<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Sticky sessions</title><desc id="desc">A chat client's first request lands on server 1, which keeps the session in memory and replies with a sticky cookie. The next requests carry the cookie, so the load balancer sends them to server 1 every time. Then server 1 crashes, the next request goes to server 2, which has never heard of the session, and the user has to start over.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">STICKY SESSIONS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M150,180 L210,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5475;0.5625;0.975;0.9833;1" values="1;1;0;0;1;1"/><path d="M330,180 C376,180 376,86 420,86" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><path d="M330,180 C376,180 376,144 420,144" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M330,180 C376,180 376,202 420,202" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M330,180 C376,180 376,260 420,260" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5625;0.5775;0.96;0.975;1" values="0;0;1;1;0;0"/><path d="M330,180 C376,180 376,86 420,86" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity="0.5"></path></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1875;0.2025;0.5225;0.5375;1" values="0;0;1;1;0;0"/><path d="M330,180 C376,180 376,86 420,86" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" values="0;-192"/></path></g><rect x="30" y="150" width="120" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="90" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Chat client</text><text x="90" y="195" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">no cookie yet<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1788;0.1938;0.975;0.9833;1" values="1;1;0;0;1;1"/></text><text x="90" y="195" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#facc15" text-anchor="middle" opacity="0">cookie: server 1<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1938;0.2087;0.96;0.975;1" values="0;0;1;1;0;0"/></text><rect x="210" y="154" width="120" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="270" y="185.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Load balancer</text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5413;0.5563;0.975;0.9833;1" values="1;1;0;0;1;1"/><rect x="420" y="64" width="140" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="490" y="91.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Server 1</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5563;0.5713;0.96;0.975;1" values="0;0;1;1;0;0"/><rect x="420" y="64" width="140" height="44" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.6" stroke-dasharray="6 5"/><text x="490" y="91.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Server 1</text></g><rect x="420" y="122" width="140" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="417" y="119" width="146" height="50" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6937;0.7087;0.735;0.75;1" values="0;0;1;1;0;0"/></rect><text x="490" y="149.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Server 2</text><rect x="420" y="180" width="140" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="490" y="207.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Server 3</text><rect x="420" y="238" width="140" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="490" y="265.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Server 4</text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.55;0.565;0.96;0.975;1" values="0;0;1;1;0;0"/><path d="M535,79 L549,93 M549,79 L535,93" stroke="#f87171" stroke-width="3" stroke-linecap="round"/></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0938;0.1087;0.5225;0.5375;1" values="0;0;1;1;0;0"/><rect x="597.76" y="74" width="144.48" height="24" rx="12" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-width="1.2"/><text x="670" y="90.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">session in memory</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5375;0.5525;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="616.36" y="74" width="107.28" height="24" rx="12" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="670" y="90.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">session gone</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7;0.715;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="605.2" y="132" width="129.6" height="24" rx="12" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="670" y="148.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">session unknown</text></g><text x="670" y="116" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">only on server 1<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1125;0.1275;0.5225;0.5375;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.029;0.0523;0.0563;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.025;0.0563;1" path="M150,180 L210,180"/><circle r="5" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0625;0.0665;0.096;0.1;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0625;0.1;1" path="M330,180 C376,180 376,86 420,86"/><circle r="5" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1187;0.1227;0.1522;0.1562;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1187;0.1562;1" path="M420,86 C376,86 376,180 330,180"/><circle r="5" fill="#4ade80"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1625;0.1665;0.1898;0.1938;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1625;0.1938;1" path="M210,180 L150,180"/><circle r="5" fill="#4ade80"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.225;0.229;0.2522;0.2562;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.225;0.2562;1" path="M150,180 L210,180"/><circle r="5" fill="#22d3ee"></circle><text y="-10" font-family="ui-mono