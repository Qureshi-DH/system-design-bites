<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Graceful shutdown</title><desc id="desc">A payments pod is serving requests when Kubernetes sends SIGTERM. It keeps serving for a moment, then stops accepting new requests, lets the three in flight requests finish one by one, closes its Postgres pool and exits with code 0 long before the SIGKILL deadline.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">GRACEFUL SHUTDOWN</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.31;0.325;0.9375;0.9525;1" values="1;1;0;0;1;1"/><path d="M160,180 L260,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.325;0.34;0.9225;0.9375;1" values="0;0;1;1;0;0"/><path d="M160,180 L260,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity="0.6"></path></g><text x="210" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle" opacity="0">no new work<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.325;0.34;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><path d="M598,88 C566,88 566,140 542,140" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity="0.6"></path><path d="M540,240 L620,240" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6475;0.6625;0.9375;0.9525;1" values="1;1;0;0;1;1"/><path d="M540,240 L620,240" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="16s" repeatCount="indefinite" values="0;-192"/></path></g><rect x="30" y="150" width="130" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="95" y="184.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Load balancer</text><rect x="600" y="64" width="160" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="680" y="92.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Kubernetes</text><path d="M620,206 v68 a60,10 0 0 0 120,0 v-68" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="680" cy="206" rx="60" ry="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><text x="680" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Postgres</text><text x="680" y="260" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">connection pool</text><rect x="260" y="118" width="280" height="184" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="400" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Payments pod</text><text x="278" y="191" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">req 1</text><rect x="326" y="182" width="170" height="10" rx="3" fill="#172033" stroke="#334155"/><rect x="326" y="182" width="0" height="10" rx="3" fill="#22d3ee"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0688;0.425;0.9375;0.975;1" values="0;0;170;170;0;0"/></rect><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.425;0.44;0.9225;0.9375;1" values="0;0;1;1;0;0"/><path d="M508,187 L512.2,191.2 L520,182.8" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.029;0.0648;0.0688;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.025;0.0688;1" path="M162,180 L258,180"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4312;0.4352;0.471;0.475;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4312;0.475;1" path="M258,180 L162,180"/><circle r="6" fill="#4ade80"></circle></g><text x="278" y="215" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">req 2</text><rect x="326" y="206" width="170" height="10" rx="3" fill="#172033" stroke="#334155"/><rect x="326" y="206" width="0" height="10" rx="3" fill="#22d3ee"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1437;0.5125;0.9375;0.975;1" values="0;0;170;170;0;0"/></rect><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5125;0.5275;0.9225;0.9375;1" values="0;0;1;1;0;0"/><path d="M508,211 L512.2,215.2 L520,206.8" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.104;0.1397;0.1437;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1;0.1437;1" path="M162,180 L258,180"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5187;0.5227;0.5585;0.5625;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5187;0.5625;1" path="M258,180 L162,180"/><circle r="6" fill="#4ade80"></circle></g><text x="278" y="239" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">req 3</text><rect x="326" y="230" width="170" height="10" rx="3" fill="#172033" stroke="#334155"/><rect x="326" y="230" width="0" height="10" rx="3" fill="#22d3ee"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2812;0.6;0.9375;0.975;1" values="0;0;170;170;0;0"/></rect><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6;0.615;0.9225;0.9375;1" values="0;0;1;1;0;0"/><path d="M508,235 L512.2,239.2 L520,230.8" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2375;0.2415;0.2772;0.2812;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2375;0.2812;1" path="M162,180 L258,180"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6062;0.6102;0.646;0.65;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6062;0.65;1" path="M258,180 L162,180"/><circle r="6" fill="#4ade80"></circle></g><text x="278" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">grace</text><rect x="326" y="266" width="170" height="8" rx="3" fill="#172033" stroke="#334155"/><rect x="326" y="266" width="0" height="8" rx="3" fill="#fb923c"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1812;0.7;0.9375;0.975;1" values="0;0;56.1;56.1;0;0"/></rect><text x="496" y="292" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">SIGKILL at 30 s</text><line x1="496" y1="262" x2="496" y2="278" stroke="#f87171" stroke-width="2"/><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.129;0.1772;0.1812;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.125;0.1812;1" path="M598,88 C566,88 566,140 542,140"/><circle r="6" fill="#facc15"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle">SIGTERM</text></g><circle cx="400" cy="150" r="20" fill="none" stroke="#facc15" stroke-width="2" opacity="0"><animate attributeName="r" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1812;0.2812;1" values="20;20;70;70"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1812;0.1825;0.2812;1" values="0;0;0.9;0;0"/></circle><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.625;0.629;0.6585;0.6625;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.625;0.6625;1" path="M542,240 L618,240"/><circle r="6" fill="#a78bfa"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">close</text></g><text x="680" y="302" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle" opacity="0">pool closed<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6625;0.6775;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><rect x="259" y="117" width="282" height="186" rx="10" fill="#0f172a" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7375;0.7875;0.9375;0.975;1" values="0;0;0.5;0.5;0;0"/></rect><text x="400" y="162" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle" opacity="0">serving<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1663;0.1812;1" values="1;1;0;0"/></text><text x="400" y="162" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#facc15" text-anchor="middle" opacity="0">SIGTERM: keep serving 5 s<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1812;0.1962;0.31;0.325;1" values="0;0;1;1;0;0"/></text><text x="400" y="162" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fb923c" text-anchor="middle" opacity="0">finish in flight requests<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.325;0.34;0.61;0.625;1" values="0;0;1;1;0;0"/></text><text x="400" y="162" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle" opacity="0">close the DB pool<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.625;0.64;0.685;0.7;1" values="0;0;1;1;0;0"/></text><text x="400" y="162" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle" opacity="0">exit 0<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7;0.715;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><text x="400" y="162" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle" opacity="0">serving<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.9375;0.9525;1" values="0;0;1;1"/></text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7;0.715;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="326.54" y="280.5" width="58.92" height="23" rx="11.5" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="356" y="295.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">exit 0</text></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">On SIGTERM the pod stops new work, finishes what it started, then exits.</text></svg>
