<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Logical clocks</title><desc id="desc">Three servers each keep a Lamport counter. Every local event adds 1. Server A sends its counter 2 to server B, which jumps from 1 to 3. B sends 4 to server C, which jumps from 2 to 5. The chain of causes lights up with numbers that only go up.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">LOGICAL CLOCKS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><text x="744" y="74" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">time</text><path d="M752,70 L764,70 M759,65 L764,70 L759,75" fill="none" stroke="#64748b" stroke-width="1.5"/><path d="M180,100 L756,100" stroke="#334155" stroke-width="2"/><text x="32" y="105" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="start">Server A</text><rect x="118" y="82" width="46" height="36" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><path d="M180,190 L756,190" stroke="#334155" stroke-width="2"/><text x="32" y="195" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="start">Server B</text><rect x="118" y="172" width="46" height="36" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><path d="M180,280 L756,280" stroke="#334155" stroke-width="2"/><text 