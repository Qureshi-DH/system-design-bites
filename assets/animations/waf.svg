<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">WAF</title><desc id="desc">Fans and scanner bots send requests to a ticketing site through a web application firewall. Each bot request matches a rule, such as SQL injection, XSS, or a known exploit, and bounces back with a 403. The fans' requests match nothing and pass through to the app.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">WAF</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M176,108 C232,108 236,140 290,140" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M176,248 C232,248 236,220 290,220" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M490,175 L600,175" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="36" y="80" width="140" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="106" y="106" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Fans</text><text x="106" y="123" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">buying tickets</text><rect x="36" y="220" width="140" height="56" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.6"/><text x="106" y="246" font-family="system-ui,-apple-sys