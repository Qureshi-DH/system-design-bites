<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Service discovery</title><desc id="desc">Two pricing instances send heartbeats to a service registry. A third one starts and registers, the trip service asks the registry where pricing is, gets three addresses, and calls the new one. Then pricing 1 dies, misses its heartbeats, and is dropped from the list.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">SERVICE DISCOVERY</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M610,103 C550,103 540,160 490,160" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M610,180 L490,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.075;0.09;0.935;0.95;1" values="0;0;1;1;0;0"/><path d="M610,257 C550,257 540,205 490,205" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><path d="M190,180 L300,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M115,210 C115,302 560,302 610,262" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><rect x="40" y="150" width="150" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="115" y="178" font-family="system-ui,-app