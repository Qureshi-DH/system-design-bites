<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Heartbeats</title><desc id="desc">Three workers send small alive messages to a coordinator every 2 seconds. Worker 7 freezes and its heartbeats stop. The coordinator counts the silence up to its 10 second timeout, marks worker 7 dead, and hands job 88 to worker 12.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">HEARTBEATS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M180,96 C330,96 330,146 480,146" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M180,180 C330,180 330,192 480,192" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M180,264 C330,264 330,244 480,244" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="40" y="70" width="140" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="110" y="94" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Worker 3</text><text x="110" y="111" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">job 41</text><rect x="40" y="154" width="140" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="110" y="178" font-family="system-ui,-apple-system,'Sego