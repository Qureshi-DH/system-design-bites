<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Single responsibility principle</title><desc id="desc">Three teams send change requests to a wallet app. On the left one accounts service answers to security, compliance and growth, so when compliance adds a review status, the release also changes login and 4,000 customers are locked out. On the right each team owns its own service, the compliance change ships alone and logins keep working.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">SINGLE RESPONSIBILITY PRINCIPLE</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><line x1="400" y1="62" x2="400" y2="312" stroke="#334155" stroke-width="1.4" stroke-dasharray="4 6"/><text x="208" y="76" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#facc15" text-anchor="middle">Before: three bosses</text><path d="M82.0,134 L82.0,176" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M208.0,134 L208.0,176" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M334.0,134 L334.0,176" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M82.0,268 L82.0,236" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="30" y="96" width="104" height="38" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/>