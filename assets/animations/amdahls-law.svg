<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Amdahl's law</title><desc id="desc">A 100 minute video job has 10 serial minutes and 90 minutes of encoding that splits across workers. Workers grow from 1 to 100 and the encoding part shrinks, but the job never drops below 10 minutes, so the speedup climbs to 5.3x at 10 workers, 9.2x at 100, and flattens under its 10x ceiling.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">AMDAHL'S LAW</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><text x="60" y="80" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#facc15" text-anchor="start" opacity="1">1 worker<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1188;0.8938" values="1;0;1"/></text><text x="60" y="80" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#facc15" text-anchor="start" opacity="0">2 workers<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1188;0.1937" values="0;1;0"/></text><text x="60" y="80" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#facc15" text-anchor="start" opacity="0">5 workers<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1937;0.2687" values="0;1;0"/></text><text x="60" y="80" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#facc15" text-anchor="start" opacity="0">10 workers<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2687;0.4062" values="0;1;0"/></text><text x="60" y="80" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#facc15" text-anchor="start" opacity="0">20 workers<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4062;0.4813" values="0;1;0"/></text><text x="60" y="80" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#facc15" text-anchor="start" opacity="0">50 workers<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4813;0.5563" values="0;1;0"/></text><text x="60" y="80" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#facc15" text-anchor="start" opacity="0">100 workers<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5563;0.8938" values="0;1;0"/></text><text x="250" y="80" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">one video job, start to finish</text><rect x="60" y="92" width="28" height="32" rx="4" fill="#fb923c"/><rect x="88" y="92" width="504" height="32" fill="#22d3ee" fill-opacity="0.85"><animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.1375;0.175;0.2125;0.25;0.2875;0.3875;0.425;0.4625;0.5;0.5375;0.575;0.875;0.9125;1" values="504;504;252;252;100.8;100.8;50.4;50.4;25.2;25.2;10.08;10.08;5.04;5.04;504;504"/></rect><rect x="592" y="92" width="28" height="32" rx="4" fill="#fb923c"><animate attributeName="x" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.1375;0.175;0.2125;0.25;0.2875;0.3875;0.425;0.4625;0.5;0.5375;0.575;0.875;0.9125;1" values="592;592;340;340;188.8;188.8;138.4;138.4;113.2;113.2;98.08;98.08;93.04;93.04;592;592"/></rect><rect x="57" y="89" width="67.04" height="38" rx="6" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5875;0.6025;0.8475;0.8625;1" values="0;0;1;1;0;0"/></rect><g><animateTransform type="translate" attributeName="transform" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.1375;0.175;0.2125;0.25;0.2875;0.3875;0.425;0.4625;0.5;0.5375;0.575;0.875;0.9125;1" values="0,0;0,0;-252,0;-252,0;-403.2,0;-403.2,0;-453.6,0;-453.6,0;-478.8,0;-478.8,0;-493.92,0;-493.92,0;-498.96,0;-498.96,0;0,0;0,0"/><text x="632" y="114" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#e2e8f0" text-anchor="start" opacity="1">100 min<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1188;0.8938" values="1;0;1"/></text><text x="632" y="114" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#e2e8f0" text-anchor="start" opacity="0">55 min<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1188;0.1937" values="0;1;0"/></text><text x="632" y="114" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#e2e8f0" text-anchor="start" opacity="0">28 min<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1937;0.2687" values="0;1;0"/></text><text x="632" y="114" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#e2e8f0" text-anchor="start" opacity="0">19 min<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2687;0.4062" values="0;1;0"/></text><text x="632" y="114" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#e2e8f0" text-anchor="start" opacity="0">14.5 min<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4062;0.4813" values="0;1;0"/></text><text x="632" y="114" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#e2e8f0" text-anchor="start" opacity="0">11.8 min<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4813;0.5563" values="0;1;0"/></text><text x="632" y="114" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#e2e8f0" text-anchor="start" opacity="0">10.9 min<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5563;0.8938" values="0;1;0"/></text></g><text x="232" y="114" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#facc15" text-anchor="start" opacity="0">never under 10 min<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5875;0.6025;0.8475;0.8625;1" values="0;0;1;1;0;0"/></text><rect x="60" y="138" width="12" height="12" rx="2" fill="#fb923c"/><text x="78" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">serial: download 5 + stitch 5 min</text><rect x="320" y="138" width="12" height="12" rx="2" fill="#22d3ee"/><text x="338" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">parallel: 90 min of encoding, split across workers</text><path d="M80,182 L80,294 L386,294" fill="none" stroke="#475569" stroke-width="1.4"/><text x="80" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">speedup</text><text x="72" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">5x</text><text x="72" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#facc15" text-anchor="end">10x</text><text x="83" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">1</text><text x="230" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">50</text><text x="380" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">100 workers</text><path d="M80,194 L384,194" stroke="#facc15" stroke-width="1.6" stroke-dasharray="6 5"/><text x="390" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#facc15" text-anchor="start">ceiling 10x</text><path d="M83,284 L86,275.8182 L89,269 L92,263.2308 L95,258.2857 L98,254 L101,250.25 L104,246.9412 L107,244 L110,241.3684 L113,239 L116,236.8571 L119,234.9091 L122,233.1304 L125,231.5 L128,230 L131,228.6154 L134,227.3333 L137,226.1429 L140,225.0345 L143,224 L146,223.0323 L149,222.125 L152,221.2727 L155,220.4706 L158,219.7143 L161,219 L164,218.3243 L167,217.6842 L170,217.0769 L173,216.5 L176,215.9512 L179,215.4286 L182,214.9302 L185,214.4545 L188,214 L191,213.5652 L194,213.1489 L197,212.75 L200,212.3673 L2