<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">SLOs</title><desc id="desc">A chart draws the rolling 28 day SLI for orders reaching restaurant tablets within 30 seconds, against a 99.5 percent target line. While the line stays above the target the SLO is met and the team keeps shipping. A bad week drags it to 99.4 percent, the SLO is missed and reliability work comes first, until the line recovers.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">SLOS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><rect x="36" y="64" width="540" height="248" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="52" y="88" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="start">Rolling 28 day SLI</text><text x="560" y="88" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">orders on the tablet within 30 s</text><path d="M96,100.0 H556" stroke="#334155" stroke-width="1"/><text x="88" y="104" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">100%</text><path d="M96,280.0 H556" stroke="#334155" stroke-width="1"/><text x="88" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">99%</text><rec