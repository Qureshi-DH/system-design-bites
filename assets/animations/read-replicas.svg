<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Read replicas</title><desc id="desc">A user saves a new photo caption, which goes to the leader. The reload reads from replica 1, which lags 800 ms behind, so the old caption comes back. With the rule that recent writers read from the leader, the next reload goes to the leader and shows the new caption.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">READ REPLICAS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M310,170 C355,170 355,99 400,99" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M310,180 C355,180 355,187 400,187" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M310,190 C355,190 355,275 400,275" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M128,180 L170,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M550,92 C600,92 600,186 550,186" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity="0.55"><animate attributeName="stroke-dashoffset" dur="16s" repeatCount="indefinite" values="0;-192"/></path><path d="M550,92 C628,92 628,274 550,274" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity="0.55"><animate attributeName="stroke