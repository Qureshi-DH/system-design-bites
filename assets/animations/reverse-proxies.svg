efinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0187;0.0562;1" path="M140,180 L210,180"/><circle r="5" fill="#a78bfa"></circle><text y="-10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">HTTPS</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0938;0.0978;0.1273;0.1313;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0938;0.1313;1" path="M370,180 L440,180"/><circle r="5" fill="#22d3ee"></circle><text y="-10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">HTTP</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1375;0.1415;0.1585;0.1625;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1375;0.1625;1" path="M570,180 L620,180"/><circle r="5" fill="#a78bfa"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1687;0.1727;0.1897;0.1937;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1687;0.1937;1" path="M620,180 L570,180"/><circle r="5" fill="#a78bfa"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.204;0.2335;0.2375;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2;0.2375;1" path="M440,180 L370,180"/><circle r="5" fill="#4ade80"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3;0.304;0.3335;0.3375;1" value