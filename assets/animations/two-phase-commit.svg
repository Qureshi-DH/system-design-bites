="6" fill="#4ade80"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">yes</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1063;0.1103;0.171;0.175;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1063;0.175;1" path="M370,263 C290,263 290,192 200,192"/><circle r="6" fill="#4ade80"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">yes</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5812;0.5852;0.646;0.65;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5812;0.65;1" path="M370,139 C290,139 290,172 200,172"/><circle r="6" fill="#4ade80"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">yes</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5812;0.5852;0.646;0.65;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5812;0.65;1" path="M370,263 C290,263 290,192 200,192"/><circle r="6" fill="#4ade80"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">yes</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.75;0.754;0.946;0.95;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="