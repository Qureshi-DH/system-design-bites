<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">CAP theorem</title><desc id="desc">Two copies of the same story run side by side. The link between Region A and Region B breaks, and a driver cashes out 50 dollars in Region A. A second request reaches Region B, which never heard about it. The CP system answers try again later. The AP system answers with the stale 50 dollar balance. When the link heals, Region B catches up.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">CAP THEOREM</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M24,193 L776,193" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 6"/><text x="30" y="82" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#facc15" text-anchor="start">CP: refuse to answer</text><path d="M140,128 L200,128" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M650,128 L600,128" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M320,128 L480,128" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1125;0.1275;0.7725;0.7875;1" values="0;0;1;1;0;0"/><path d="M330,128 L470,128" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-d