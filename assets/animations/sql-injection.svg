<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">SQL injection</title><desc id="desc">The same order code input travels two ways. Glued into the SQL text, its quote breaks out, the condition becomes always true, and the database returns all 1.2 million orders. Sent as a parameter, it stays in its own box as plain data and the database finds no order.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">SQL INJECTION</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M206,172 C232,172 228,116 250,116" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M206,200 C232,200 228,240 250,240" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M570,116 L620,116" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M570,240 L620,240" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="36" y="140" width="170" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="121" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">Order code box</text><rect x="69" y="186" width="104" height="26" rx="6" fill="#172033" stroke="#22d3ee" stroke-width="1.4"/><text x="121" y="203.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#22d3ee" text-anchor="middle">' OR '1'='1</text><text x="250" y="76" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="start">Glued into the SQL text</text><rect x="250" y="86" width="320" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="266" y="121" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve" opacity="0"><tspan fill="#e2e8f0">WHERE code = '</tspan><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1725;0.1875;1" values="1;1;0;0"/></text><rect x="378" y="104" width="108" height="24" rx="4" fill="none" stroke="#64748b" stroke-dasharray="4 4" opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1688;0.1875;0.9688;0.9938;1" values="1;1;0;0;1;1"/></rect><text x="490" y="121" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve" opacity="0"><tspan fill="#e2e8f0">'</tspan><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1725;0.1875;1" values="1;1;0;0"/></text><text x="266" y="121" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve" opacity="0"><tspan fill="#e2e8f0">WHERE code = '</tspan><tspan fill="#f87171">' OR '1'='1</tspan><tspan fill="#e2e8f0">'</tspan><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1875;0.2025;0.9475;0.9625;1" values="0;0;1;1;0;0"/></text><text x="410" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#f87171" text-anchor="middle" opacity="0">the quote breaks out: always true<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2375;0.2525;0.9475;0.9625;1" values="0;0;1;1;0;0"/></text><text x="250" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="start">Sent as a parameter</text><rect x="250" y="206" width="320" height="96" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="266" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve"><tspan fill="#e2e8f0">WHERE code = $1</tspan></text><rect x="266" y="254" width="288" height="34" rx="6" fill="none" stroke="#4ade80" stroke-width="1.3" stroke-dasharray="5 4"/><text x="278" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve"><tspan fill="#94a3b8">$1 =</tspan></text><text x="544" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="end" opacity="0">just data<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1875;0.2025;0.9475;0.9625;1" values="0;0;1;1;0;0"/></text><g><animateTransform type="translate" attributeName="transform" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.05;0.175;1" values="0,0;0,0;311,-83;311,-83"/><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0375;0.05;0.175;0.1938;1" values="0;0;1;1;0;0"/><rect x="69" y="186" width="104" height="26" rx="6" fill="#172033" stroke="#22d3ee" stroke-width="1.4"/><text x="121" y="203.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#22d3ee" text-anchor="middle">' OR '1'='1</text></g></g><g><animateTransform type="translate" attributeName="transform" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.05;0.175;0.975;0.9762;1" values="0,0;0,0;251,72;251,72;0,0;0,0"/><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0375;0.05;0.95;0.975;1" values="0;0;1;1;0;0"/><rect x="69" y="186" width="104" height="26" rx="6" fill="#172033" stroke="#22d3ee" stroke-width="1.4"/><text x="121" y="203.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#22d3ee" text-anchor="middle">' OR '1'='1</text></g></g><path d="M620,90 v52 a70,10 0 0 0 140,0 v-52" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="690" cy="90" rx="70" ry="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><ellipse cx="690" cy="116" rx="76" ry="42" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.35;0.365;0.3975;0.4125;1" values="0;0;1;1;0;0"/></ellipse><text x="690" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Orders DB</text><path d="M620,214 v52 a70,10 0 0 0 140,0 v-52" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="690" cy="214" rx="70" ry="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><ellipse cx="690" cy="240" rx="76" ry="42" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.35;0.365;0.3975;0.4125;1" values="0;0;1;1;0;0"/></ellipse><text x="690" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Orders DB</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.275;0.279;0.346;0.35;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.275;0.35;1" path="M570,116 L620,116"/><circle r="6" fill="#f87171"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.275;0.279;0.346;0.35;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.275;0.35;1" path="M570,240 L620,240"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.375;0.39;0.9475;0.9625;1" values="0;0;1;1;0;0"/><rect x="625.2" y="160" width="129.6" height="24" rx="12" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="690" y="176.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">all 1.2M orders</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.375;0.39;0.9475;0.9625;1" values="0;0;1;1;0;0"/><rect x="625.2" y="284" width="129.6" height="24" rx="12" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="690" y="300.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">order not found</text></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Glued in, the input rewrites the query. As a parameter, it stays data.</text></svg>
