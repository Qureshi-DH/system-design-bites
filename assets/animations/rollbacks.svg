<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Rollbacks</title><desc id="desc">A timeline of a release. Version 2 is deployed and the error rate jumps. One rollback command puts version 1 back and errors drop. Underneath, the database keeps every row version 2 wrote in its new format, because code can go back but data cannot.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">ROLLBACKS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><text x="40" y="101" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="start">Code</text><text x="40" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="start">Errors</text><text x="40" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="start" opacity="0">0.2%<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2975;0.3125;1" values="1;1;0;0"/></text><text x="40" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="start" opacity="0">6%<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3125;0.3275;0.61;0.625;1" values="0;0;1;1;0;0"/></text><text x="40" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="start" opacity="0">0.2%<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.625;0.64;1" values="0;0;1;1"/></text><text x="40" y="254" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="start">Data</text><text x="40" y="270" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">rows written</text><rect x="130.0" y="84" width="0" height="26" rx="5" fill="#60a5fa" fill-opacity="0.25" stroke="#60a5fa" stroke-width="1.4"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0;0.25;0.95;0.9512;1" values="0;0;177.0;177.0;0;0"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.875;0.95;1" values="1;1;0;1"/></rect><text x="220" y="102" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle" opacity="0">v1<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.15;0.165;0.935;0.95;1" values="0;0;1;1;0;0"/></text><rect x="310.0" y="84" width="0" height="26" rx="5" fill="#fb923c" fill-opacity="0.25" stroke="#fb923c" stroke-width="1.4"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.575;0.95;0.9512;1" values="0;0;231.0;231.0;0;0"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.875;0.95;1" values="1;1;0;1"/></rect><text x="427" y="102" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fb923c" text-anchor="m