<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">RTO and RPO</title><desc id="desc">A timeline runs from 09:30. Writes arrive and the last backup at 09:45 saves them. The region fails at 10:00 and the writes since 09:45 are lost: that 15 minute gap is the RPO. Users see errors until service is back at 10:40: that 40 minute gap is the RTO.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">RTO AND RPO</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M70,200 L732,200" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="195" y1="196" x2="195" y2="204" stroke="#475569" stroke-width="2"/><text x="195" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">09:45</text><line x1="300" y1="196" x2="300" y2="204" stroke="#475569" stroke-width="2"/><text x="300" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">10:00</text><line x1="580" y1="196" x2="580" y2="204" stroke="#475569" stroke-width="2"/><text x="580" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">10:40</text><rect x="90" y="185" width="0" height="9" fill="#4ade80" opacity="0.85"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.25;0.92