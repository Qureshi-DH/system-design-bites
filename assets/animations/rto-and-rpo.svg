tributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1125;0.1313;0.9062;0.925;1" values="0;0;1;1;0;0"/><path d="M181,109.76 v20.48 a14,5.76 0 0 0 28,0 v-20.48" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="195" cy="109.76" rx="14" ry="5.76" fill="#172033" stroke="#475569" stroke-width="1.6"/><text x="195" y="96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">last backup</text></g><circle cx="195" cy="120" r="12" fill="none" stroke="#4ade80" stroke-width="2" opacity="0"><animate attributeName="r" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.225;1" values="12;12;32;32"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.1263;0.225;1" values="0;0;0.9;0;0"/></circle><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.2687;0.9062;0.925;1" values="0;0;1;1;0;0"/><line x1="300" y1="104" x2="300" y2="206" stroke="#f87171" stroke-width="2.5"/><text x="300" y="96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">region fails</text></g><circle cx="300" cy="150" r="8" fill="none" stroke="#f87171" stroke-width="2" opacity="0"><animate attributeName="r" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.35;1" values="8;8;34;34"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.2512;0.35;1" values="0;0;0.9;0;0"/></circle><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.675;0.6938;0.9062;0.925;1" values="0;0;1;1;0;0"/><line x1="580" y1="104" x2="580" y2="206" stroke="#4ade80" stroke-width="2.5"/><text x="580" y="96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">service back</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3125;0.3312;0.9062;0.925;1" values="0;0;1;1;0;0"/><path d="M195,232 L195,242 L300,242 L300,232" fill="none" stroke="#fb923c" stroke-width="2.2"/><text x="247.5" y="266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#fb923c" text-anchor="middle">RPO 15 min</text><text x="247.5" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">writes lost</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7125;0.7313;0.9062;0.925;1" values="0;0;1;1;0;0"/><path d="M300,232 L300,242 L580,242 L580,232" fill="none" stroke="#f87171" stroke-width="2.2"/><text x="440" y="266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f87171" text-anchor="middle">RTO 40 min</text><text x="440" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">users see errors</text></g><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.9187;0.9375;0.9812;1;1" values="1;1;0;0;1;1"/><g><animateTransform type="translate" attributeName="transform" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.25;0.45;0.675;0.6875;0.7875;0.9438;0.9688;1" values="0,0;0,0;210,0;210,0;490,0;490,0;595,0;595,0;0,0;0,0"/><line x1="90" y1="150" x2="90" y2="206" stroke="#facc15" stroke-width="2" stroke-dasharray="3 3"/><path d="M84,144 L96,144 L90,152 Z" fill="#facc15"/></g></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">RPO looks back at the writes you lose. RTO looks ahead at the downtime.</text></svg>
