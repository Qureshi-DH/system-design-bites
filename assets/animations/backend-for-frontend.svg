dth="1.6"/><text x="680" y="183.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Users service</text><rect x="600" y="240" width="160" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="680" y="267.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Trending service</text><text x="680" y="302" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">shared by both</text><text x="520" y="302" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">internal hops, a couple of ms</text><g opacity="0"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0429;0.0469;0.1531;0.1571;1" values="0;0;1;1;0;0"/><animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0429;0.1571;1" path="M180,114 L290,114"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1643;0.1683;0.196;0.2;1" values="0;0;1;1;0;0"/><animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1643;0.2;1" path="M440,104 C520,104 520,88 600,88"/><circle r="5" fill="#a78bfa"></circle></g><g opacity="0"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2071;0.2111;0.2389;0.2429;1" values="0;0;1;1;0;0"/><animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2071;0.2429;1" path="M600,88 C520,88 520,104 440,104"/><circle r="5" fill="#a78bfa"></circle></g><g opacity="0