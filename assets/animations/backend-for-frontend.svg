<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Backend for frontend</title><desc id="desc">The mobile app makes one call, GET /home, over the slow mobile network. The mobile BFF calls the posts and users services in parallel inside the data center and returns 20 posts with small images in 60 KB. The web BFF calls posts, users, and trending and returns 50 posts with a trending sidebar. The mobile team owns its app and BFF and ships them together.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">BACKEND FOR FRONTEND</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M180,114 L290,114" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M180,242 L290,242" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M440,104 C520,104 520,88 600,88" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"></path><path d="M440,124 C520,124 520,170 600,170" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"></path><path d="M440,230 C520,230 520,102 600,102" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"></path><path d="M440,242 C520,242 520,186 600,186" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"></path><path d="M440,254 C520,254 520,262 600,26