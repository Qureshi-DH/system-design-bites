<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Kubernetes</title><desc id="desc">The desired state says 6 replicas, spread as 2 pods on each of 3 nodes. Node 3 fails and its 2 pods vanish. After the default 5 minute wait, the controller compares want 6 with have 4 and starts 2 new pods on the healthy nodes until actual matches desired again.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">KUBERNETES</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M220,92 L300,92" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" values="0;-192"/></path><text x="260" y="82" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">compare</text><rect x="40" y="64" width="180" height="56" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="130" y="90" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Desired state</text><text x="130" y="107" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">replicas: 6</text><rect x="300" y="64" width="200" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="297" y="61" wi