<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Write ahead log</title><desc id="desc">A wallet top up of 50 dollars is appended to the write ahead log and flushed before Postgres replies committed, while the data file on disk still says 120. The power cuts out and memory is lost. On restart Postgres replays the log after the last checkpoint and the data file says 170.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">WRITE AHEAD LOG</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M158,170 L226,170" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M416,130 L470,130" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M416,236 C480,236 500,256 560,256" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><text x="488" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">later, in batches</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4625;0.4775;0.6225;0.6375;1" values="0;0;1;1;0;0"/><path d="M725,168 C725,194 704,192 704,212" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path></g><rect x="28" y="140" width="130" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="93" y="165" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Wallet service</text><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1975;0.2125;0.9375;0.9525;1" values="1;1;0;0;1;1"/><text x="93" y="183" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">add $50</text></g><text x="93" y="183" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4ade80" text-anchor="middle" opacity="0">shows $170<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2125;0.2275;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><rect x="226" y="92" width="190" height="162" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="223" y="89" width="196" height="168" rx="13" fill="#f87171" fill-opacity="0.18" stroke="#f87171" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3625;0.3775;0.4475;0.4625;1" values="0;0;1;1;0;0"/></rect><text x="321" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Postgres</text><rect x="244" y="134" width="154" height="60" rx="6" fill="#172033" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 5"/><text x="256" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">memory</text><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1475;0.1625;0.9375;0.9525;1" values="1;1;0;0;1;1"/><text x="321" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#e2e8f0" text-anchor="middle">wallet 9: $120</text></g><text x="321" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#fb923c" text-anchor="middle" opacity="0">wallet 9: $170<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1625;0.1775;0.3475;0.3625;1" values="0;0;1;1;0;0"/></text><text x="321" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#f87171" text-anchor="middle" opacity="0">wiped<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.375;0.39;0.5725;0.5875;1" values="0;0;1;1;0;0"/></text><text x="321" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#4ade80" text-anchor="middle" opacity="0">wallet 9: $170<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5875;0.6025;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><rect x="470" y="92" width="300" height="76" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="620" y="112" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Write ahead log</text><rect x="484" y="124" width="62" height="32" rx="5" fill="#172033" stroke="#334155"/><text x="515" y="144" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">w3 +5</text><rect x="554" y="124" width="62" height="32" rx="5" fill="#172033" stroke="#334155"/><text x="585" y="144" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">w7 +12</text><rect x="624" y="124" width="62" height="32" rx="5" fill="#172033" stroke="#334155"/><text x="655" y="144" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">w2 +30</text><path d="M688,120 L688,160" stroke="#facc15" stroke-width="1.5" stroke-dasharray="3 3"/><text x="684" y="184" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#facc15" text-anchor="end">checkpoint</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.15;0.165;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="694" y="124" width="62" height="32" rx="5" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1.5"/></g><text x="725" y="144" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#22d3ee" text-anchor="middle" opacity="0">w9 +50<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.15;0.165;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><path d="M560,220 v76 a95,10 0 0 0 190,0 v-76" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="655" cy="220" rx="95" ry="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><text x="655" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Data file</text><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5725;0.5875;0.9375;0.9525;1" values="1;1;0;0;1;1"/><text x="655" y="268" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#e2e8f0" text-anchor="middle">wallet 9: $120</text></g><text x="655" y="268" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#4ade80" text-anchor="middle" opacity="0">wallet 9: $170<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5875;0.6025;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.029;0.0648;0.0688;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.025;0.0688;1" path="M158,170 L226,170"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">+50</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0938;0.0978;0.1397;0.1437;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0938;0.1437;1" path="M416,130 L470,130"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">append</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1625;0.1665;0.2085;0.2125;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1625;0.2125;1" path="M226,170 L158,170"/><circle r="6" fill="#4ade80"></circle></g><circle cx="321" cy="173" r="20" fill="none" stroke="#f87171" stroke-width="2" opacity="0"><animate attributeName="r" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3625;0.45;1" values="20;20;110;110"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3625;0.3637;0.45;1" values="0;0;0.9;0;0"/></circle><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5;0.504;0.5835;0.5875;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.5875;1" path="M725,168 C725,194 704,192 704,212"/><circle r="7" fill="#facc15"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1625;0.1775;0.3475;0.3625;1" values="0;0;1;1;0;0"/><rect x="278.52" y="274" width="84.96" height="24" rx="12" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="321" y="290.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">committed</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3625;0.3775;0.4475;0.4625;1" values="0;0;1;1;0;0"/><rect x="278.52" y="274" width="84.96" height="24" rx="12" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="321" y="290.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">power cut</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4625;0.4775;0.5975;0.6125;1" values="0;0;1;1;0;0"/><rect x="241.32" y="274" width="159.36" height="24" rx="12" fill="#facc15" fill-opacity="0.16" stroke="#facc15" stroke-width="1.2"/><text x="321" y="290.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#facc15" text-anchor="middle">restart, replay log</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6125;0.6275;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="267.36" y="274" width="107.28" height="24" rx="12" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="321" y="290.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">nothing lost</text></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Each change is logged first. After a crash, replay brings it back.</text></svg>
