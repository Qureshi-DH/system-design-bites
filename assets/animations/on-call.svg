<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">On call</title><desc id="desc">A weekly rotation passes the pager from Ana to Ben. Monitoring sees checkout errors over 5 percent and the paging tool calls Ben, who is asleep. After 10 minutes with no answer it escalates to Cara, the secondary, who acknowledges the page.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">ON CALL</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><rect x="40" y="64" width="170" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="56" y="89" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="start">Ana</text><text x="194" y="89" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="end">week 1</text><rect x="220" y="64" width="170" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="236" y="89" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="start">Ben</text><text x="374" y="89" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="end">week 2</text><rect x="400" y="64" width="170" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="416" y="89" font-family="s