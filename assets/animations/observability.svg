ont-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">service</text><rect x="250" y="140" width="120" height="82" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="310" y="179" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Collector</text><text x="310" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">one pipeline</text><path d="M420,76 v42 a50,10 0 0 0 100,0 v-42" fill="#1e293b" stroke="#a78bfa" stroke-width="1.6"/><ellipse cx="470" cy="76" rx="50" ry="10" fill="#172033" stroke="#a78bfa" stroke-width="1.6"/><ellipse cx="470" cy="97" rx="56" ry="37" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4375;0.4525;0.4975;0.5125;1" values="0;0;1;1;0;0"/></ellipse><text x="470" y="107" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Logs</text><path d="M420,160 v42 a50,10 0 0 0 100,0 v-42" fill="#1e293b" stroke="#60a5fa" stroke-width="1.6"/><ellipse cx="470" cy="160" rx="50" ry="10" fill="#172033" stroke="#60a5fa" stroke-width="1.6"/><ellipse cx="470" cy="181" rx="56" ry="37" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4375;0.4525;0.4975;0.5125;1" values="0;0;1;1;0;0"/></ellipse><text x="470" y="191" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Metrics</text><path d="M420,244 v42 a50,10 0 0 0 100,0 v-42" fill="#1e293b" stroke="#f472b6" stroke-width="1.6"/><ellipse cx="470" cy="244" rx="50" ry="10" fil