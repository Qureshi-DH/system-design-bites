rif" font-size="14" font-weight="700" fill="#fb923c" text-anchor="middle" opacity="0">wallet API, 2.1 s<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5625;0.5775;0.9475;0.9625;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6125;0.6275;0.9475;0.9625;1" values="0;0;1;1;0;0"/><rect x="607.04" y="240" width="151.92" height="24" rx="12" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="683" y="256.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">answered in 12 min</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.029;0.0897;0.0938;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.025;0.0938;1" path="M106,136 L106,220"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0312;0.0353;0.1022;0.1062;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0312;0.1062;1" path="M176,108 C222,108 212,166 250,166"/><circle r="5" fill="#a78bfa"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1125;0.1165;0.1835;0.1875;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1125;0.1875;1" path="M176,248 C222,248 212,196 250,196"/><circle r="5" fill="#a78bfa"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0513;0.0553;0.1222;0.1263;1" values="0;0;1;1;0;