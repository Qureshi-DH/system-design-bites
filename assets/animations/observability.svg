<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Observability</title><desc id="desc">A checkout request passes through the checkout and payment services. Each one emits a log line, a metric, and a trace span to one collector, which files them in a log store, a metrics store, and a trace store. Because they share a request ID, the engineer's new question about slow wallet payments gets answered from data already there.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">OBSERVABILITY</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M106,136 L106,220" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M176,108 C222,108 212,166 250,166" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M176,248 C222,248 212,196 250,196" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M370,166 C396,166 394,97 420,97" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"></path><path d="M370,181 L420,181" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"></path><path d="M370,196 C396,196 394,265 420,265" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"></path><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="lin