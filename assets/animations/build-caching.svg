<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Build caching</title><desc id="desc">Two Docker builds of the same app run side by side. With no cache every layer runs, and npm ci alone takes most of the 10 minutes. With the layer cache only the app code changed, so the first three layers are reused and the build ends in 90 seconds.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">BUILD CACHING</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><text x="36" y="80" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="start">No cache</text><text x="36" y="98" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">every step runs</text><rect x="36" y="112" width="348" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.4"/><rect x="36" y="112" width="0" height="28" rx="6" fill="#fb923c" fill-opacity="0.2"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0375;0.0875;0.9313;0.9688;1" values="0.00;0.00;348.00;348.00;0.00;0.00"/></rect><text x="48" y="131" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="start">FROM node:20</text><text x="372" y="131" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="end" opacity="0">built<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0875;0.1025;0.9537;0.9688;1" values="0;0;1;1;0;0"/></text><rect x="36" y="148" width="348" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.4"/><rect x="36" y="148" width="0" height="28" rx="6" fill="#fb923c" fill-opacity="0.2"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0875;0.125;0.9313;0.9688;1" values="0.00;0.00;348.00;348.00;0.00;0.00"/></rect><text x="48" y="167" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="start">COPY lockfile</text><text x="372" y="167" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="end" opacity="0">built<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.14;0.9537;0.9688;1" values="0;0;1;1;0;0"/></text><rect x="36" y="184" width="348" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.4"/><rect x="36" y="184" width="0" height="28" rx="6" fill="#fb923c" fill-opacity="0.2"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.5625;0.9313;0.9688;1" values="0.00;0.00;348.00;348.00;0.00;0.00"/></rect><text x="48" y="203" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="start">RUN npm ci</text><text x="372" y="203" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="end" opacity="0">running<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.14;0.5475;0.5625;1" values="0;0;1;1;0;0"/></text><text x="372" y="203" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="end" opacity="0">built<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5625;0.5775;0.9537;0.9688;1" values="0;0;1;1;0;0"/></text><rect x="36" y="220" width="348" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.4"/><rect x="36" y="220" width="0" height="28" rx="6" fill="#fb923c" fill-opacity="0.2"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5625;0.6062;0.9313;0.9688;1" values="0.00;0.00;348.00;348.00;0.00;0.00"/></rect><text x="48" y="239" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="start">COPY source</text><text x="372" y="239" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="end" opacity="0">built<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6062;0.6212;0.9537;0.9688;1" values="0;0;1;1;0;0"/></text><rect x="36" y="256" width="348" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.4"/><rect x="36" y="256" width="0" height="28" rx="6" fill="#fb923c" fill-opacity="0.2"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6062;0.6438;0.9313;0.9688;1" values="0.00;0.00;348.00;348.00;0.00;0.00"/></rect><text x="48" y="275" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="start">CMD node</text><text x="372" y="275" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="end" opacity="0">built<animate attributeName="opacity" dur="16s" repeatCount="indefini