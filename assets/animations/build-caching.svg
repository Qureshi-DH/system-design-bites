r" keyTimes="0;0.0563;0.0713;0.9537;0.9688;1" values="0;0;1;1;0;0"/></text><rect x="416" y="148" width="348" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.4"/><rect x="416" y="148" width="0" height="28" rx="6" fill="#facc15" fill-opacity="0.16"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.075;0.085;0.9313;0.9688;1" values="0.00;0.00;348.00;348.00;0.00;0.00"/></rect><text x="428" y="167" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="start">COPY lockfile</text><text x="752" y="167" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#facc15" text-anchor="end" opacity="0">cached<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.075;0.09;0.9537;0.9688;1" values="0;0;1;1;0;0"/></text><rect x="416" y="184" width="348" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.4"/><rect x="416" y="184" width="0" height="28" rx="6" fill="#facc15" fill-opacity="0.16"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0938;0.1037;0.9313;0.9688;1" values="0.00;0.00;348.00;348.00;0.00;0.00"/></rect><text x="428" y="203" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="start">RUN npm ci</text><text x="752" y="203" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#facc15" text-anchor="end" opacity="0">cached, saves 8 min<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0938;0.1087;0.9537;0.9688;1" values="0;0;1;1;0;0"/></text><rect x="416" y="220" width="348" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.4"/><rect x="416" y="220" width="