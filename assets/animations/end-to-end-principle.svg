e" calcMode="linear" keyTimes="0;0.375;0.39;0.4475;0.4625;1" values="0;0;1;1;0;0"/><path d="M705,247 L719,261 M719,247 L705,261" stroke="#f87171" stroke-width="3" stroke-linecap="round"/></g><text x="712" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle" opacity="0">got a1f3<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.75;0.765;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><text x="712" y="256" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle" opacity="0">stored<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.75;0.765;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><text x="330" y="240" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle" opacity="0">every hop check passed<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3688;0.3838;0.435;0.45;1" values="0;0;1;1;0;0"/></text><text x="400" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle" opacity="0">hash mismatch: resend the chunk<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4375;0.4525;0.56;0.575;1" values="0;0;1;1;0;0"/></text><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Every hop's check passed. Only the end to end hash caught the flipped bit.</text></svg>
