<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Normalization vs denormalization</title><desc id="desc">Left, articles point at one author row and a join stitches the name in on every read. Right, the author name is copied into every article, so reads skip the join. When the author is renamed, the left side changes one row, while the right side must rewrite every copy and one missed copy drifts.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">NORMALIZATION VS DENORMALIZATION</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M400,64 L400,316" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><text x="206" y="74" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Normalized, stored once</text><path d="M228,132 C250,132 250,156 270,156" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0875;0.1025;0.31;0.325;1" values="0;0;1;1;0;0"/><path d="M228,132 C250,132 250,156 270,156" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4875;0.5025;0.585;0.6;1" values="0;0;1;1;0;0"/><pa