<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Dependency hell</title><desc id="desc">A photo app uses an image resizer and a storage SDK, which both need the same HTTP client. The SDK updates and now needs version 2 while the resizer needs version 1. The two versions collide, only one can be installed, and the resizer crashes until a lockfile pins the old SDK.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">DEPENDENCY HELL</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M370,100 C370,120 235,114 235,134" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M430,100 C430,120 565,114 565,134" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3563;0.375;0.6062;0.625;1" values="1;1;0;0;1;1"/><path d="M235,186 C235,208 285,206 285,228" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"></path></g><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1375;0.1562;0.6062;0.625;1" values="1;1;0;0;1;1"/><path d="M565,186 C565,214 345,200 345,228" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"></path></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1625;0.1812;0.6;0.6188;1" values="0;0;1;1;0;0"/><path d="M565,186 C565,208 520,206 520,228" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"></path></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.375;0.3937;0.6;0.6188;1" values="0;0;1;1;0;0"/><path d="M235,186 C235,216 445,200 455,228" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path></g><rect x="320" y="58" width="160" height="42" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="400" y="84.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Photo app</text><rect x="150" y="134" width="170" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="235" y="157" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Image resizer</text><text x="235" y="175" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">needs 1.x</text><rect x="480" y="134" width="170" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="565" y="157" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Storage SDK</text><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1313;0.15;1" values="1;1;0;0"/><text x="565" y="175" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">needs 1.x</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.15;0.1687;0.6;0.6188;1" values="0;0;1;1;0;0"/><text x="565" y="175" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#fb923c" text-anchor="middle">new version needs 2.x</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6188;0.6375;1" values="0;0;1;1"/><text x="565" y="175" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">needs 1.x</text></g><circle cx="565" cy="160" r="30" fill="none" stroke="#fb923c" stroke-width="2" opacity="0"><animate attributeName="r" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1437;0.2437;1" values="30;30;70;70"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1437;0.145;0.2437;1" values="0;0;0.9;0;0"/></circle><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.45;0.4688;0.6;0.6188;1" values="0;0;1;1;0;0"/><rect x="147" y="131" width="176" height="58" rx="12" fill="none" stroke="#f87171" stroke-width="2.5"/></g><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3563;0.375;0.6;0.6188;1" values="1;1;0;0;1;1"/><g><animateTransform type="translate" attributeName="transform" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.225;0.2625;0.3625;0.375;1" values="0,0;0,0;10,0;10,0;0,0;0,0"/><rect x="230" y="228" width="150" height="46" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.6"/><text x="305" y="255.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">HTTP client 1.x</text></g></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1625;0.1812;0.6;0.6188;1" values="0;0;1;1;0;0"/><g><animateTransform type="translate" attributeName="transform" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1625;0.2125;0.225;0.2625;0.3625;0.3875;1" values="70,0;70,0;0,0;0,0;-10,0;-10,0;0,0;0,0"/><rect x="420" y="228" width="150" height="46" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="1.6"/><text x="495" y="255.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">HTTP client 2.x</text></g></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2625;0.2812;0.35;0.3688;1" values="0;0;1;1;0;0"/><rect x="237" y="225" width="326" height="52" rx="12" fill="none" stroke="#f87171" stroke-width="2.5"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2625;0.2775;0.3538;0.3688;1" values="0;0;1;1;0;0"/><path d="M393,244 L407,258 M407,244 L393,258" stroke="#f87171" stroke-width="3" stroke-linecap="round"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0375;0.0415;0.0897;0.0938;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0375;0.0938;1" path="M370,100 C370,120 235,114 235,134"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.104;0.1397;0.1437;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1;0.1437;1" path="M235,186 C235,208 285,206 285,228"/><circle r="6" fill="#4ade80"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4188;0.4228;0.471;0.475;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4188;0.475;1" path="M370,100 C370,120 235,114 235,134"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4813;0.4853;0.5772;0.5812;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4813;0.5437;1" path="M235,186 C235,216 445,200 455,228"/><circle r="6" fill="#f87171"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.45;0.465;0.6038;0.6188;1" values="0;0;1;1;0;0"/><path d="M313,127 L327,141 M327,127 L313,141" stroke="#f87171" stroke-width="3" stroke-linecap="round"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7375;0.7415;0.7897;0.7937;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7375;0.7937;1" path="M370,100 C370,120 235,114 235,134"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.8;0.804;0.8397;0.8438;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8;0.8438;1" path="M235,186 C235,208 285,206 285,228"/><circle r="6" fill="#4ade80"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.265;0.3662;0.3812;1" values="0;0;1;1;0;0"/><rect x="268.24" y="290" width="263.52" height="24" rx="12" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="400" y="306.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">only one version can be installed</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3937;0.4088;0.5975;0.6125;1" values="0;0;1;1;0;0"/><rect x="275.68" y="290" width="248.64" height="24" rx="12" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="400" y="306.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">resizer crashes on every upload</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.625;0.64;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="298" y="290" width="204" height="24" rx="12" fill="#facc15" fill-opacity="0.16" stroke="#facc15" stroke-width="1.2"/><text x="400" y="306.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#facc15" text-anchor="middle">lockfile pins the old SDK</text></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Both libraries need the HTTP client, at different versions. Only one fits.</text></svg>
