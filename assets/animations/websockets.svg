<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">WebSockets</title><desc id="desc">Maya's phone sends an HTTP request asking to upgrade, and the chat server answers 101 Switching Protocols. The connection stays open as a WebSocket. Maya and Sam send messages at the same moment and they cross in both directions, followed by constant small updates, with no new requests.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">WEBSOCKETS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M180,162 L330,162" fill="none" stroke="#334155" stroke-width="2"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.175;0.1938;0.95;0.9688;1" values="1;1;0;0;1;1"/></path><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1812;0.1962;0.9475;0.9625;1" values="0;0;1;1;0;0"/><rect x="180" y="151" width="150" height="22" rx="11" fill="#facc15" fill-opacity="0.10" stroke="#facc15" stroke-width="1.4"/></g><circle cx="255" cy="162" r="10" fill="none" stroke="#facc15" stroke-width="2" opacity="0"><animate attributeName="r" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1812;0.2812;1" values="10;10;60;60"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1812;0.1825;0.2812;1" values="0;0;0.9;0;0"/></circle><rect x="470" y="151" width="150" height="22" rx="11" fill="#facc15" fill-opacity="0.10" stroke="#facc15" stroke-width="1.