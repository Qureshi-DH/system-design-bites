<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Strangler fig</title><desc id="desc">Clients talk only to a routing layer. At first every route goes to the legacy monolith. Statements, cards, payees, and login move one at a time to new services, each followed by a request that now lands on the new code, until the legacy monolith is empty and gets switched off.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">STRANGLER FIG</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M156,180 L214,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7875;0.85;0.95;1" values="1;1;0.3;0.3;1"/><path d="M354,164 C400,164 400,118 440,118" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><path d="M354,196 C400,196 400,250 440,250" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="36" y="152" width="120" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="96" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Clients</text><text x="96" y="195" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">web and mobile</text><rect x="214" y="132" width="140" height="96" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="284" y="172" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Routing layer</text><text x="284" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">0 of 4 moved<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.185;0.2;1" values="1;1;0;0"/></text><text x="284" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">1 of 4 moved<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.215;0.36;0.375;1" values="0;0;1;1;0;0"/></text><text x="284" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">2 of 4 moved<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.375;0.39;0.535;0.55;1" values="0;0;1;1;0;0"/></text><text x="284" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">3 of 4 moved<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.55;0.565;0.71;0.725;1" values="0;0;1;1;0;0"/></text><text x="284" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">4 of 4 moved<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.725;0.74;1" values="0;0;1;1"/></text><g><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7875;0.85;0.95;1" values="1;1;0.3;0.3;1"/><rect x="440" y="64" width="320" height="108" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="456" y="88" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="start">Legacy monolith</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.825;0.84;0.935;0.95;1" values="0;0;1;1;0;0"/><rect x="630.08" y="72.5" width="99.84" height="23" rx="11.5" fill="#facc15" fill-opacity="0.16" stroke="#facc15" stroke-width="1.2"/><text x="680" y="87.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle">switched off</text></g><rect x="440" y="196" width="320" height="108" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.6"/><text x="456" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="start">New services</text><g><animateTransform type="translate" attributeName="transform" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1375;0.2;0.9375;0.9437;1" values="0,0;0,0;0,132;0,132;0,0;0,0"/><g><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1375;0.2;0.95;1" values="1;1;0;0;1"/><rect x="471" y="116" width="118" height="24" rx="12" fill="#fb923c" fill-opacity="0.16" stroke="#fb923c" stroke-width="1.2"/><text x="530" y="132.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">/statements</text></g><g><animate attributeName="opacity" dur="16s" repeatCoun