<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Race conditions</title><desc id="desc">Player 7 has 100 gold. Game server 1 adds a 50 gold quest reward and game server 2 adds 30 for a sword sale at the same moment. Both read 100, server 1 writes 150, then server 2 writes 130, so the quest reward is lost and she ends with 130 instead of 180.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">RACE CONDITIONS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M210,160 L320,160" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M590,160 L480,160" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="40" y="126" width="170" height="68" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="125" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Game server 1</text><text x="125" y="175" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">quest, +50 gold</text><rect x="590" y="126" width="170" height="68" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="675" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Game server 2</text><text x="675" y="175" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">sword sale, +30</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1714;0.1905;0.2095;0.2286;1" values="0;0;1;1;0;0"/><text x="125" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#22d3ee" text-anchor="middle">read 100</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2286;0.25;0.8929;0.9143;1" values="0;0;1;1;0;0"/><text x="125" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#22d3ee" text-anchor="middle">100 + 50 = 150</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1714;0.1905;0.2095;0.2286;1" values="0;0;1;1;0;0"/><text x="675" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#22d3ee" text-anchor="middle">read 100</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2286;0.25;0.8929;0.9143;1" values="0;0;1;1;0;0"/><text x="675" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#22d3ee" text-anchor="middle">100 + 30 = 130</text></g><path d="M320,106 v108 a80,10 0 0 0 160,0 v-108" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="400" cy="106" rx="80" ry="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.35;0.3671;0.44;0.4571;1" values="0;0;1;1;0;0"/><path d="M320,106 v108 a80,10 0 0 0 160,0 v-108" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><ellipse cx="400" cy="106" rx="80" ry="10" fill="#172033" stroke="#facc15" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5;0.5171;0.8971;0.9143;1" values="0;0;1;1;0;0"/><path d="M320,106 v108 a80,10 0 0 0 160,0 v-108" fill="#1e293b" stroke="#f87171" stroke-width="1.6"/><ellipse cx="400" cy="106" rx="80" ry="10" fill="#172033" stroke="#f87171" stroke-width="1.6"/></g><text x="400" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Postgres</text><text x="400" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">player 7 gold</text><g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3357;0.3571;0.9143;0.9357;1" values="1;1;0;0;1;1"/><text x="400" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="28" font-weight="700" fill="#e2e8f0" text-anchor="middle">100</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3571;0.3786;0.4786;0.5;1" values="0;0;1;1;0;0"/><text x="400" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="28" font-weight="700" fill="#e2e8f0" text-anchor="middle">150</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5;0.5214;0.8929;0.9143;1" values="0;0;1;1;0;0"/><text x="400" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="28" font-weight="700" fill="#f87171" text-anchor="middle">130</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5571;0.5743;0.8971;0.9143;1" values="0;0;1;1;0;0"/><rect x="342.64" y="244" width="114.72" height="24" rx="12" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="400" y="260.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">should be 180</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6;0.6171;0.8971;0.9143;1" values="0;0;1;1;0;0"/><rect x="286.84" y="278" width="226.32" height="24" rx="12" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="400" y="294.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">the +50 quest reward is lost</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0429;0.0469;0.096;0.1;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0429;0.1;1" path="M210,160 L320,160"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">read</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.05;0.054;0.1031;0.1071;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.05;0.1071;1" path="M590,160 L480,160"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">read</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1143;0.1183;0.1674;0.1714;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1143;0.1714;1" path="M320,160 L210,160"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">100</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1214;0.1254;0.1746;0.1786;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1214;0.1786;1" path="M480,160 L590,160"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">100</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2857;0.2897;0.3531;0.3571;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2857;0.3571;1" path="M210,160 L320,160"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">150</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4286;0.4326;0.496;0.5;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4286;0.5;1" path="M590,160 L480,160"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">130</text></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Both read 100 before either writes, so the second write erases the first.</text></svg>
