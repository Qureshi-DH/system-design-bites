<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">SLAs</title><desc id="desc">A payments API's monthly uptime is drawn against two lines: the internal SLO at 99.95 percent and the looser contract SLA at 99.9 percent. A 30 minute outage drops uptime below the SLO, so alarms fire and deploys freeze, but the SLA still holds. A second outage pushes it below the SLA, and service credits of 10 percent of every bill come due.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">SLAS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><rect x="36" y="64" width="540" height="248" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="52" y="88" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="start">June uptime, payments API</text><text x="92" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">100%</text><path d="M100,114.0 H556" stroke="#334155" stroke-width="1"/><path d="M100,168.0 H556" stroke="#facc15" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M100,168.0 H556" stroke="#facc15" stroke-width="5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2444;0.2594;0.3044;0.3194;1" values="0;0;1;1;0;0"/></path><text x="92" y="172" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#facc15" text-anchor="end">99.95%</text><text x="556" y="161" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#facc15" text-anchor="end">SLO, internal</text><path d="M100,222.0 H556" stroke="#f87171" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M100,222.0 H556" stroke="#f87171" stroke-width="5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5289;0.5439;0.5889;0.6039;1" values="0;0;1;1;0;0"/></path><text x="92" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="end">99.9%</text><text x="556" y="215" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="end">SLA, in the contract</text><text x="100" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">June 1</text><text x="556" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">June 30</text><defs><clipPath id="slaR"><rect x="97" y="106" width="0" height="178"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0375;0.7875;0.9875;0.9938;1" values="0;0;462;462;0;0"/></rect></clipPath></defs><g><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.95;0.9875;1" values="1;1;0;0"/><g clip-path="url(#slaR)"><polyline points="100.0,114.0 225.8,114.0 225.8,189.0 398.8,189.0 398.8,239.0 556.0,239.0" fill="none" stroke="#22d3ee" stroke-width="2.8" stroke-linejoin="round"/></g></g><text x="233.7931" y="136" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#fb923c" text-anchor="start" opacity="0">30 min outage<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2444;0.2594;0.935;0.95;1" values="0;0;1;1;0;0"/></text><text x="406.7586" y="257" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="start" opacity="0">20 min more<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5289;0.5439;0.935;0.95;1" values="0;0;1;1;0;0"/></text><circle cx="225.7931" cy="189" r="8" fill="none" stroke="#fb923c" stroke-width="2" opacity="0"><animate attributeName="r" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2444;0.3444;1" values="8;8;26;26"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2444;0.2456;0.3444;1" values="0;0;0.9;0;0"/></circle><circle cx="398.7586" cy="239" r="8" fill="none" stroke="#f87171" stroke-width="2" opacity="0"><animate attributeName="r" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5289;0.6289;1" values="8;8;26;26"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5289;0.5301;0.6289;1" values="0;0;0.9;0;0"/></circle><rect x="596" y="64" width="170" height="248" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="612" y="88" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="start">Downtime in June</text><text x="612" y="114" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="start" opacity="0">0 min<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2294;0.2444;1" values="1;1;0;0"/></text><text x="612" y="114" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="start" opacity="0">30 min<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2444;0.2594;0.5139;0.5289;1" values="0;0;1;1;0;0"/></text><text x="612" y="114" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="start" opacity="0">50 min<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5289;0.5439;0.935;0.95;1" values="0;0;1;1;0;0"/></text><text x="612" y="114" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="start" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.95;0.965;1" values="0;0;1;1"/></text><path d="M608,128 H754" stroke="#334155" stroke-width="1"/><text x="612" y="150" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#facc15" text-anchor="start">SLO 99.95%</text><text x="612" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4ade80" text-anchor="start" opacity="0">on track<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0063;0.0212;0.2294;0.2444;1" values="0;0;1;1;0;0"/></text><text x="612" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#fb923c" text-anchor="start" opacity="0">missed: deploys freeze<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2444;0.2594;0.935;0.95;1" values="0;0;1;1;0;0"/></text><text x="612" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#f87171" text-anchor="start">SLA 99.9%</text><text x="612" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4ade80" text-anchor="start" opacity="0">met, nobody owed<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0063;0.0212;0.5139;0.5289;1" values="0;0;1;1;0;0"/></text><text x="612" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#f87171" text-anchor="start" opacity="0">missed<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5289;0.5439;0.935;0.95;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5664;0.5814;0.935;0.95;1" values="0;0;1;1;0;0"/><rect x="603.8" y="240.5" width="154.4" height="23" rx="11.5" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="681" y="255.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle">credit: 10% of bills</text></g><text x="681" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f87171" text-anchor="middle" opacity="0">$160,000 owed<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5914;0.6064;0.935;0.95;1" values="0;0;1;1;0;0"/></text><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">The SLO line trips first and the team reacts. Cross the SLA and you pay.</text></svg>
