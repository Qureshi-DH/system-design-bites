<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Vector search</title><desc id="desc">The search dog on a beach goes through an embedding model and becomes a 512 number vector, a point among photo vectors where similar photos sit close together. An HNSW index starts at an entry point, takes long hops in its sparse top layer, then short hops in the dense bottom layer, and returns the nearest photos in about 20 ms without comparing every vector.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">VECTOR SEARCH</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><rect x="250" y="64" width="520" height="248" rx="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><text x="266" y="88" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">HNSW index over 80 million photos</text><path d="M323,207 L323,188" stroke="#334155" stroke-width="1.2"/><path d="M323,207 L341,216" stroke="#334155" stroke-width="1.2"/><path d="M323,188 L340,195" stroke="#334155" stroke-width="1.2"/><path d="M353,204 L357,189" stroke="#334155" stroke-width="1.2"/><path d="M353,204 L340,195" stroke="#334155" stroke-width="1.2"/><path d="M302,208 L298,192" stroke="#334155" stroke-width="1.2"/><path d="M302,208 L323,207" stroke="#334155" stroke-width="1.2"/><path d="M307,176 L298,192" stroke="#334155" stroke-width="1.2"/><path d="M307,176 L323,188" stroke="#334155" stroke-width="1.2"/><path d="M340,195 L357,189" stroke="#33