<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Replication</title><desc id="desc">The checkout service writes order 7 to the leader in zone A. The leader copies it to the zone B follower and waits for its ack before answering saved. The zone C follower gets the copy asynchronously a moment later.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">REPLICATION</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M196,180 L316,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M466,166 C536,166 540,104 606,104" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M466,196 C536,196 540,240 606,240" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><text x="506" y="90" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">sync, wait</text><text x="506" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">async, later</text><rect x="36" y="152" width="160" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="33" y="149" width="166" height="62" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5417;0.5617;0.63;0.65;1" values="0;0;1;1;0;0"/></rect><text x="116" y="185.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Checkout service</text><path d="M316,144 v72 a75,10 0 0 0 150,0 v-72" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><ellipse cx="391" cy="144" rx="75" ry="10" fill="#172033" stroke="#facc15" stroke-width="1.6"/><ellipse cx="391" cy="180" rx="81" ry="52" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1667;0.1867;0.2467;0.2667;1" values="0;0;1;1;0;0"/></ellipse><text x="391" y="184" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Leader</text><text x="391" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">zone A</text><path d="M606,72 v60 a75,10 0 0 0 150,0 v-60" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="681" cy="72" rx="75" ry="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><ellipse cx="681" cy="102" rx="81" ry="46" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3083;0.3283;0.38;0.4;1" values="0;0;1;1;0;0"/></ellipse><text x="681" y="106" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Follower</text><text x="681" y="122" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">zone B</text><path d="M606,210 v60 a75,10 0 0 0 150,0 v-60" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="681" cy="210" rx="75" ry="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><ellipse cx="681" cy="240" rx="81" ry="46" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7333;0.7533;0.7967;0.8167;1" values="0;0;1;1;0;0"/></ellipse><text x="681" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Follower</text><text x="681" y="260" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">zone C</text><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.05;0.054;0.1543;0.1583;1" values="0;0;1;1;0;0"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.05;0.1583;1" path="M196,180 L316,180"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">order 7</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1833;0.1873;0.296;0.3;1" values="0;0;1;1;0;0"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1833;0.3;1" path="M466,166 C536,166 540,104 606,104"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.325;0.329;0.4293;0.4333;1" values="0;0;1;1;0;0"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.325;0.4333;1" path="M606,104 C540,104 536,166 466,166"/><circle r="6" fill="#4ade80"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">got it</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4417;0.4457;0.5377;0.5417;1" values="0;0;1;1;0;0"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4417;0.5417;1" path="M316,180 L196,180"/><circle r="6" fill="#4ade80"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">saved</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6;0.604;0.7293;0.7333;1" values="0;0;1;1;0;0"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6;0.7333;1" path="M466,196 C536,196 540,240 606,240"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1667;0.1867;0.93;0.95;1" values="0;0;1;1;0;0"/><rect x="355.96" y="236" width="70.08" height="24" rx="12" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.2"/><text x="391" y="252.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#22d3ee" text-anchor="middle">order 7</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3083;0.3283;0.93;0.95;1" values="0;0;1;1;0;0"/><rect x="645.96" y="152" width="70.08" height="24" rx="12" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.2"/><text x="681" y="168.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#22d3ee" text-anchor="middle">order 7</text></g><text x="681" y="305" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle" opacity="0">1 write behind<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1667;0.1867;0.7133;0.7333;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7417;0.7617;0.93;0.95;1" values="0;0;1;1;0;0"/><rect x="645.96" y="288" width="70.08" height="24" rx="12" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.2"/><text x="681" y="304.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#22d3ee" text-anchor="middle">order 7</text></g><text x="116" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle" opacity="0">waiting for zone B<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1667;0.1867;0.5217;0.5417;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.55;0.57;0.93;0.95;1" values="0;0;1;1;0;0"/><rect x="88.4" y="226" width="55.2" height="24" rx="12" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="116" y="242.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">saved</text></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Zone B confirms before the client hears saved. Zone C catches up later.</text></svg>
