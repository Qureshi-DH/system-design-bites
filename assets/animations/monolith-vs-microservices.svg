s-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Checkout</text><text x="206" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">function calls in memory</text><path d="M156,241.36 v33.28 a50,9.36 0 0 0 100,0 v-33.28" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="206" cy="241.36" rx="50" ry="9.36" fill="#172033" stroke="#475569" stroke-width="1.6"/><ellipse cx="206" cy="258" rx="56" ry="32" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1875;0.2;0.2125;0.225;1" values="0;0;1;1;0;0"/></ellipse><text x="206" y="267.68" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">One DB</text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0375;0.0415;0.0835;0.0875;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0375;0.0875;1" path="M94,86 L94,132"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">order</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0938;0.0978;0.106;0.11;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0938;0.11;1" path="M136,156 L166,156"/><circle r="5" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1163;0.1203;0.1285;0.1325;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" re