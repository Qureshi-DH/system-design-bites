<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Event streaming</title><desc id="desc">A trip service appends numbered events to the end of a log. Two consumer groups, billing and ETA, each keep their own offset pointer and move through the same events at different speeds. Billing then rewinds its pointer to offset 0 and replays history while ETA carries on.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">EVENT STREAMING</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M636,180 L600.0,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" values="0;-192"/></path><rect x="636" y="150" width="134" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="703" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Trip service</text><text x="703" y="195" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">appends</text><rect x="50.0" y="160" width="40" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="70" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">0</text><rect x="96.0" y="160" width="40" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="116" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">1</text><rect x="142.0" y="160" width="40" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="162" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">2</text><rect x="188.0" y="160" width="40" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="208" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">3</text><rect x="234.0" y="160" width="40" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="254" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">4</text><rect x="280.0" y="160" width="40" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="300" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">5</text><rect x="326.0" y="160" width="40" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="346" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">6</text><rect x="372.0" y="160" width="40" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="392" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">7</text><rect x="418.0" y="160" width="40" height="40" rx="6" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="4 4"/><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1125;0.1275;0.935;0.95;1" values="0;0;1;1;0;0"/><rect x="418.0" y="160" width="40" height="40" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.6"/><text x="438" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">8</text></g><rect x="464.0" y="160" width="40" height="40" rx="6" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="4 4"/><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3125;0.3275;0.935;0.95;1" values="0;0;1;1;0;0"/><rect x="464.0" y="160" width="40" height="40" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.6"/><text x="484" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">9</text></g><rect x="510.0" y="160" width="40" height="40" rx="6" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="4 4"/><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5125;0.5275;0.935;0.95;1" values="0;0;1;1;0;0"/><rect x="510.0" y="160" width="40" height="40" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.6"/><text x="530" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">10</text></g><rect x="556.0" y="160" width="40" height="40" rx="6" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="4 4"/><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7125;0.7275;0.935;0.95;1" values="0;0;1;1;0;0"/><rect x="556.0" y="160" width="40" height="40" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.6"/><text x="576" y="185" font-famil