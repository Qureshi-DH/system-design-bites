 fill="none" stroke="#facc15" stroke-width="2.2" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5563;0.5713;0.6225;0.6375;1" values="0;0;1;1;0;0"/></rect><rect x="93.0" y="157" width="46" height="46" rx="8" fill="none" stroke="#facc15" stroke-width="2.2" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6375;0.6525;0.7475;0.7625;1" values="0;0;1;1;0;0"/></rect><rect x="139.0" y="157" width="46" height="46" rx="8" fill="none" stroke="#facc15" stroke-width="2.2" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7625;0.7775;0.8725;0.8875;1" values="0;0;1;1;0;0"/></rect><defs><marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker></defs><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4875;0.5025;0.61;0.625;1" values="0;0;1;1;0;0"/><path d="M346.0,112 C346.0,76 70.0,76 70.0,112" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow1)"></path></g><text x="208" y="72" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#facc15" text-anchor="middle" opacity="0">rewind to offset 0<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4875;0.5025;0.61;0.625;1" values="0;0;1;1;0;0"/></text><g><animateTransform type="translate" attributeName="transform" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.075;0.1125;0.2;0.2375;0.325;0.3625;0.425;0.4625;0.5125;0.55;0.625;0.6625;0.75;0.7875;1" values="162,0;162,0;208,0;208,0;254,0;254,0;300,0;300,0;346,0;346,0;70,0;70,0;116,0;116,0;162,0;162,0"/><path d="M-7,146 L7,146 L0,156 z" fi