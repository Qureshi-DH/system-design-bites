<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Database indexing</title><desc id="desc">Both sides look for conversation 812 in a table of 500 million messages. On the left a full scan reads row after row while the counter climbs to 500 million. On the right the query walks a B tree from the root through two branch pages to the leaf for 812, reading 4 pages.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">DATABASE INDEXING</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M400,64 L400,316" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><text x="206" y="74" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">No index, full scan</text><rect x="40" y="88" width="332" height="190" rx="8" fill="#172033" stroke="#475569" stroke-width="1.6"/><rect x="50" y="98" width="312" height="18" rx="3" fill="#1e293b"/><rect x="50" y="120" width="312" height="18" rx="3" fill="#1e293b"/><rect x="50" y="142" width="312" height="18" rx="3" fill="#1e293b"/><rect x="50" y="164" width="312" height="18" rx="3" fill="#1e293b"/><rect x="50" y="186" width="312" height="18" rx="3" fill="#1e293b"/><rect x="50" y="208" width="312" height="18" rx="3" fill="#1e293b"/><rect x="50" y="230" width="312" height="18" rx="3" fill="#1e293b"/><rect x="50" y="252" width="312" height="18" rx="3" fill="#1e293b"/><g opacity="0"><animate att