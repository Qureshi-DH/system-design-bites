<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">XSS</title><desc id="desc">An attacker saves a profile bio containing a script tag, and the profile service stores it. Two visitors open the profile. The page that pastes the bio in raw runs the script as the visitor, while the page that escapes it shows the tag as harmless plain text.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">XSS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M176,180 L236,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M321,224 L321,252" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M406,160 C470,160 470,122 530,122" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M406,200 C470,200 470,254 530,254" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="36" y="150" width="140" height="60" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.6"/><text x="106" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Attacker</text><text x="106" y="195" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">bio with &lt;script&gt;</text><rect x="236" y="136" width="170" height="88" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="321" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Profile service</text><text x="321" y="195" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">builds the HTML</text><path d="M266,262 v40 a55,10 0 0 0 110,0 v-40" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="321" cy="262" rx="55" ry="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><ellipse cx="321" cy="282" rx="61" ry="36" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1875;0.2025;0.235;0.25;1" values="0;0;1;1;0;0"/></ellipse><text x="321" y="292" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Users DB</text><rect x="530" y="64" width="240" height="116" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><path d="M531,88 H769" stroke="#334155" stroke-width="1.2"/><circle cx="546" cy="76" r="3.5" fill="#475569"/><circle cx="558" cy="76" r="3.5" fill="#475569"/><circle cx="570" cy="76" r="3.5" fill="#475569"/><text x="590" y="80" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="start">Visitor, no escaping</text><text x="546" y="112" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="start">Bio:</text><rect x="530" y="196" width="240" height="116" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><path d="M531,220 H769" stroke="#334155" stroke-width="1.2"/><circle cx="546" cy="208" r="3.5" fill="#475569"/><circle cx="558" cy="208" r="3.5" fill="#475569"/><circle cx="570" cy="208" r="3.5" fill="#475569"/><text x="590" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="start">Visitor, escaped</text><text x="546" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="start">Bio:</text><rect x="410.64" y="84" width="114.72" height="24" rx="12" fill="#fb923c" fill-opacity="0.16" stroke="#fb923c" stroke-width="1.2"/><text x="468" y="100.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">pasted in raw</text><rect x="406.92" y="284" width="122.16" height="24" rx="12" fill="#facc15" fill-opacity="0.16" stroke="#facc15" stroke-width="1.2"/><text x="468" y="300.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#facc15" text-anchor="middle">&lt; becomes &amp;lt;</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.029;0.1085;0.1125;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.025;0.1125;1" path="M176,180 L236,180"/><circle r="6" fill="#f87171"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.129;0.1835;0.1875;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.125;0.1875;1" path="M321,224 L321,252"/><circle r="6" fill="#f87171"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.254;0.3272;0.3312;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.25;0.3312;1" path="M530,122 C470,122 470,160 406,160"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">GET</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.254;0.3272;0.3312;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.25;0.3312;1" path="M530,254 C470,254 470,200 406,200"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">GET</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3375;0.3415;0.396;0.4;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3375;0.4;1" path="M321,252 L321,224"/><circle r="6" fill="#f87171"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.425;0.429;0.521;0.525;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.425;0.525;1" path="M406,160 C470,160 470,122 530,122"/><circle r="6" fill="#f87171"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle">&lt;script&gt;</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.425;0.429;0.521;0.525;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.425;0.525;1" path="M406,200 C470,200 470,254 530,254"/><circle r="6" fill="#f87171"><animate attributeName="fill" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.475" values="#f87171;#4ade80"/></circle></g><rect x="531" y="89" width="238" height="90" rx="0" fill="#f87171" fill-opacity="0.10" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5375;0.5563;0.9437;0.9688;1" values="0;0;1;1;0;0"/></rect><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5375;0.5525;0.9475;0.9625;1" values="0;0;1;1;0;0"/><rect x="600.08" y="124" width="99.84" height="24" rx="12" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="650" y="140.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">script runs</text></g><text x="650" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#f87171" text-anchor="middle" opacity="0">as the visitor, with their session<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.55;0.565;0.9475;0.9625;1" values="0;0;1;1;0;0"/></text><circle cx="650" cy="136" r="20" fill="none" stroke="#f87171" stroke-width="2" opacity="0"><animate attributeName="r" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5375;0.6375;1" values="20;20;60;60"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5375;0.5387;0.6375;1" values="0;0;0.9;0;0"/></circle><text x="578" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#e2e8f0" text-anchor="start" opacity="0">&lt;script&gt;alert(1)&lt;/script&gt;<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5375;0.5525;0.9475;0.9625;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.55;0.565;0.9475;0.9625;1" values="0;0;1;1;0;0"/><rect x="570.32" y="274" width="159.36" height="24" rx="12" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="650" y="290.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">shown as plain text</text></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Same stored bio. Unescaped, it runs. Escaped, it is just text.</text></svg>
