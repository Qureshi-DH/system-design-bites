<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Backups</title><desc id="desc">Postgres takes a full backup each night and archives its write ahead log in small pieces through the day, and they stack up on a timeline. At 14:32 a bad migration drops a table. The restore loads Tuesday's full backup and replays each piece of log, in order, up to 14:31 into a fresh copy, and the missing table is copied back with zero rows lost.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">BACKUPS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M156,138 C182,138 172,196 194,196" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity="0.6"><animate attributeName="stroke-dashoffset" dur="16s" repeatCount="indefinite" values="0;-192"/></path><path d="M190,196 L752,196" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5875;0.6063;0.9062;0.925;1" values="0;0;1;1;0;0"/><path d="M538,206 C538,276 300,276 156,276" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"></path></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6875;0.7063;0.9062;0.925;1" values="0;0;1;1;0;0"/><path d="M96,238 L96,178" fill="none" stroke="#4ade80" stroke-width="2"