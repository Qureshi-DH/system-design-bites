<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Consensus</title><desc id="desc">A Kubernetes API sends a write to the etcd leader while zone B, with 2 of the 5 servers, is offline. The leader and two followers save entry 901, which is 3 of 5, a majority, so the entry is committed and the API gets its OK. When zone B comes back, its servers catch up and every log shows the entry.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">CONSENSUS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><rect x="528" y="196" width="244" height="118" rx="12" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="6 5"/><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0375;0.0562;0.5562;0.575;1" values="0;0;1;1;0;0"/><rect x="528" y="196" width="244" height="118" rx="12" fill="none" stroke="#f87171" stroke-width="1.8" stroke-dasharray="6 5"/></g><g opacity="1"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.0375;0.575;0.5938;1" values="1;1;0;0;1;1"/><text x="650" y="187" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">zone B</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0375;0.0562;0.5562;0.575;1" values="0;0;1;1;0;0"/><text x="650" y="187" font-family="system-ui,-apple-system,'Segoe UI',