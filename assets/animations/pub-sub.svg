<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Pub/Sub</title><desc id="desc">Checkout publishes one OrderPlaced message to the orders topic, and email, inventory and analytics each get their own copy at the same moment. Then a fraud service subscribes, and the next publish reaches all four while checkout stays unchanged.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">PUB/SUB</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M190,180 L270,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="14s" repeatCount="indefinite" values="0;-168"/></path><path d="M420,180 C490,180 490,92.0 560,92.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="14s" repeatCount="indefinite" values="0;-168"/></path><path d="M420,180 C490,180 490,150.0 560,150.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="14s" repeatCount="indefinite" values="0;-168"/></path><path d="M420,180 C490,180 490,208.0 560,208.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="14s" repeatCount="indefinite" values="0;-168"/></path><g opacity="0"><animate attr