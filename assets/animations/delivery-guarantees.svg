<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Delivery guarantees</title><desc id="desc">Three lanes deliver the same 120 dollar payment event to a ledger. At most once acks first and the worker crashes, so the credit is lost. At least once credits, loses the ack, gets the event again and credits twice. Effectively once also gets it twice, but the ledger sees the event ID already recorded and skips it.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">DELIVERY GUARANTEES</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M290,98 L390,98" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M510,98 L556,98" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M290,182 L390,182" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M510,182 L556,182" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M290,266 L390,266" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M510,266 L556,266" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><text x="30" y="95" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="start">At most once</text><text x="30" y="113" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">ack, then work</text><rect x="190" y="76" width="100" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="240" y="103.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Queue</text><rect x="390" y="76" width="120" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="450" y="103.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Worker</text><path d="M556,82 v32 a40,9 0 0 0 80,0 v-32" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="596" cy="82" rx="40" ry="9" fill="#172033" stroke="#475569" stroke-width="1.6"/><text x="30" y="179" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="start">At least once</text><text x="30" y="197" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">work, then ack</text><rect x="190" y="160" width="100" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="187" y="157" width="106" height="50" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.325;0.34;0.385;0.4;1" values="0;0;1;1;0;0"/></rect><text x="240" y="187.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Queue</text><rect x="390" y="160" width="120" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/>