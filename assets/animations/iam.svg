<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">IAM</title><desc id="desc">The receipt service assumes its role and gets temporary credentials that start expiring right away. Its PutObject call to the receipts bucket matches the policy and is allowed. Its attempt to read the payments database is not in the policy, so it is denied by default.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">IAM</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M186,182 L286,182" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M466,160 C530,160 540,118 600,118" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M466,206 C530,206 540,262 600,262" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><rect x="36" y="150" width="150" height="64" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="111" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Receipt service</text><text x="111" y="197" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">runs with a role</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1875;0.2025;0.8975;0.9125;1" values="0;0;1;1;0;0"/><rect x="47.44" y="228.5" width="127.12" height="23" rx="11.5" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="111" y="243.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">temp credentials</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.9125;0.9275;0.9725;0.9875;1" values="0;0;1;1;0;0"/><rect x="30.39" y="228.5" width="161.22" height="23" rx="11.5" fill="#fb923c" fill-opacity="0.16" stroke="#fb923c" stroke-width="1.2"/><text x="111" y="243.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle">expired, get new ones</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1875;0.2025;0.9725;0.9875;1" values="0;0;1;1;0;0"/><rect x="46" y="258" width="130" height="8" rx="3" fill="#172033" stroke="#334155"/><rect x="46" y="258" width="130" height="8" rx="3" fill="#4ade80"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1875;0.9125;1" values="130;130;0;0"/></rect></g><text x="111" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="0">expires in 1 hour<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1875;0.2025;0.8975;0.9125;1" values="0;0;1;1;0;0"/></text><rect x="286" y="120" width="180" height="124" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="376" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">IAM policy</text><rect x="300" y="160" width="152" height="40" rx="5" fill="#4ade80" fill-opacity="0.15" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3;0.315;0.385;0.4;1" values="0;0;1;1;0;0"/></rect><rect x="300" y="210" width="152" height="24" rx="5" fill="#f87171" fill-opacity="0.15" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5375;0.5525;0.66;0.675;1" values="0;0;1;1;0;0"/></rect><text x="376" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#4ade80" text-anchor="middle">allow s3:PutObject</text><text x="376" y="193" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#4ade80" text-anchor="middle">on receipts bucket</text><text x="376" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">anything else: deny</text><path d="M600,80 v76 a83,10 0 0 0 166,0 v-76" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="683" cy="80" rx="83" ry="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><ellipse cx="683" cy="118" rx="89" ry="54" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3875;0.4025;0.435;0.45;1" values="0;0;1;1;0;0"/></ellipse><text x="683" y="122" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Receipts</text><text x="683" y="138" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">S3 bucket</text><path d="M600,224 v76 a83,10 0 0 0 166,0 v-76" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="683" cy="224" rx="83" ry="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><text x="683" y="266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Payments DB</text><text x="683" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">not in policy</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.029;0.096;0.1;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.025;0.1;1" path="M186,182 L286,182"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">assume role</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1125;0.1165;0.1835;0.1875;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1125;0.1875;1" path="M286,182 L186,182"/><circle r="6" fill="#4ade80"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">1 hour creds</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2375;0.2415;0.296;0.3;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2375;0.3;1" path="M186,182 L286,182"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">PutObject</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3125;0.3165;0.3835;0.3875;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3125;0.3875;1" path="M466,160 C530,160 540,118 600,118"/><circle r="6" fill="#4ade80"></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3875;0.4025;0.4725;0.4875;1" values="0;0;1;1;0;0"/><rect x="650.13" y="178.5" width="65.74" height="23" rx="11.5" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="683" y="193.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">allowed</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.475;0.479;0.5335;0.5375;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.475;0.5375;1" path="M186,182 L286,182"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">read payments</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.55;0.554;0.596;0.6;1" values="0;0;1;1;0;0"/><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.55;0.6;1" path="M466,206 C494,206 512,220 530,236"/><circle r="6" fill="#22d3ee"><animate attributeName="fill" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.575" values="#22d3ee;#f87171"/></circle></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6;0.615;0.785;0.8;1" values="0;0;1;1;0;0"/><path d="M523,229 L537,243 M537,229 L523,243" stroke="#f87171" stroke-width="3" stroke-linecap="round"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6;0.615;0.785;0.8;1" values="0;0;1;1;0;0"/><rect x="463.03" y="260.5" width="133.94" height="23" rx="11.5" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="530" y="275.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle">denied by default</text></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">The role gets short lived credentials that can reach one bucket only.</text></svg>
