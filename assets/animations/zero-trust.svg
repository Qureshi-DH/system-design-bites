<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Zero trust</title><desc id="desc">A reporter and an attacker are both inside the network. Every request goes through an identity aware proxy that checks the user, the device, and the app permission. The reporter gets the publishing system but is refused the database admin tool. The attacker with a phished password fails the user and device checks.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">ZERO TRUST</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><rect x="28" y="66" width="176" height="246" rx="10" fill="#172033" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="25" y="63" width="182" height="252" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6222;0.6356;0.6867;0.7;1" values="0;0;1;1;0;0"/></rect><text x="116" y="86" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">inside the network</text><path d="M188,127 C240,127 240,150 290,150" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M188,245 C240,245 240,220 290,220" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M480,150 C540,150 540,120 590,120" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M480,220 C540,220 540,252 590,252" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="44" y="96" width="144" height="62" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="116" y="125" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Reporter</text><text x="116" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">managed laptop, SSO</text><rect x="44" y="214" width="144" height="62" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.6"/><text x="116" y="243" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Attacker</text><text x="116" y="260" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">phished password</text><rect x="290" y="96" width="190" height="180" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="385" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Identity aware proxy</text><rect x="304" y="148" width="162" height="26" rx="6" fill="#172033"/><circle cx="320" cy="161" r="6" fill="#64748b"><animate attributeName="fill" dur="18s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1;0.2889;0.4111;0.5778;0.7;0.9333" values="#64748b;#4ade80;#64748b;#4ade80;#64748b;#f87171;#64748b"/></circle><text x="334" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e2e8f0" text-anchor="start">user identity</text><rect x="304" y="182" width="162" height="26" rx="6" fill="#172033"/><circle cx="320" cy="195" r="6" fill="#64748b"><animate attributeName="fill" dur="18s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1222;0.2889;0.4333;0.5778;0.7222;0.9333" values="#64748b;#4ade80;#64748b;#4ade80;#64748b;#f87171;#64748b"/></circle><text x="334" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e2e8f0" text-anchor="start">device health</text><rect x="304" y="216" width="162" height="26" rx="6" fill="#172033"/><circle cx="320" cy="229" r="6" fill="#64748b"><animate attributeName="fill" dur="18s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1444;0.2889;0.4556;0.5778" values="#64748b;#4ade80;#64748b;#f87171;#64748b"/></circle><text x="334" y="234" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e2e8f0" text-anchor="start">app permission</text><rect x="590" y="92" width="176" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="587" y="89" width="182" height="62" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2222;0.2356;0.2756;0.2889;1" values="0;0;1;1;0;0"/></rect><text x="678" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Publishing system</text><text x="678" y="135" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">sports desk group</text><rect x="590" y="224" width="176" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="678" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">DB admin tool</text><text x="678" y="267" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">data team only</text><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0222;0.0262;0.0738;0.0778;1" values="0;0;1;1;0;0"/><animateMotion dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0222;0.0778;1" path="M188,127 C240,127 240,150 290,150"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">publishing</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1667;0.1707;0.2182;0.2222;1" values="0;0;1;1;0;0"/><animateMotion dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1667;0.2222;1" path="M480,150 C540,150 540,120 590,120"/><circle r="6" fill="#4ade80"></circle></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2222;0.2356;0.2978;0.3111;1" values="0;0;1;1;0;0"/><rect x="645.13" y="58.5" width="65.74" height="23" rx="11.5" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="678" y="73.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">allowed</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3333;0.3373;0.3849;0.3889;1" values="0;0;1;1;0;0"/><animateMotion dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3333;0.3889;1" path="M188,127 C240,127 240,150 290,150"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">db admin</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4667;0.4707;0.496;0.5;1" values="0;0;1;1;0;0"/><animateMotion dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4667;0.5;1" path="M480,220 C500,220 510,224 520,230"/><circle r="5" fill="#f87171"></circle></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5;0.5133;0.5867;0.6;1" values="0;0;1;1;0;0"/><path d="M515,225 L529,239 M529,225 L515,239" stroke="#f87171" stroke-width="3" stroke-linecap="round"/></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4778;0.4911;0.5867;0.6;1" values="0;0;1;1;0;0"/><rect x="614.44" y="288.5" width="127.12" height="23" rx="11.5" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="678" y="303.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle">403, wrong group</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6222;0.6262;0.6738;0.6778;1" values="0;0;1;1;0;0"/><animateMotion dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6222;0.6778;1" path="M188,245 C240,245 240,220 290,220"/><circle r="6" fill="#f87171"></circle></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7556;0.7596;0.8071;0.8111;1" values="0;0;1;1;0;0"/><animateMotion dur="18s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7556;0.8111;1" path="M290,220 C240,220 240,245 188,245"/><circle r="6" fill="#f87171"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle">denied</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7333;0.7467;0.9422;0.9556;1" values="0;0;1;1;0;0"/><rect x="270.29" y="288.5" width="229.42" height="23" rx="11.5" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="385" y="303.96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle">no security key, unknown laptop</text></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Every request proves user, device, and access. Being inside earns nothing.</text></svg>
