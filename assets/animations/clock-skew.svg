<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Clock skew</title><desc id="desc">Server A's clock is correct and server B's clock runs 3 seconds slow. Alice asks Dinner at 8 through server A, stamped 19:00:00. Bob answers Yes 2 seconds later through server B, stamped 18:59:59. The chat sorts by timestamp, so Bob's answer jumps above Alice's question.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">CLOCK SKEW</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M134,98 L190,98" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M134,222 L190,222" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M370,98 C420,98 420,150 470,150" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M370,222 C420,222 420,150 470,150" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="24" y="72" width="110" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="79" y="103.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Alice</text><rect x="24" y="196" width="110" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="79" y="227.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Bob</text><rect x="190" y="64" width="180" height="68" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="190" y="188" width="180" height="68" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="1.6"/><text x="280" y="89" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Server A</text><text x="280" y="213" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Server B</text><g opacity="1"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0575;0.0625;1" values="1;1;0;0"/><text x="280" y="117" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4ade80" text-anchor="middle">18:59:58</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0625;0.0675;0.1825;0.1875;1" values="0;0;1;1;0;0"/><text x="280" y="117" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4ade80" text-anchor="middle">18:59:59</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1875;0.1925;0.3075;0.3125;1" values="0;0;1;1;0;0"/><text x="280" y="117" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4ade80" text-anchor="middle">19:00:00</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3125;0.3175;0.4325;0.4375;1" values="0;0;1;1;0;0"/><text x="280" y="117" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4ade80" text-anchor="middle">19:00:01</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4375;0.4425;0.5575;0.5625;1" values="0;0;1;1;0;0"/><text x="280" y="117" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4ade80" text-anchor="middle">19:00:02</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5625;0.5675;0.6825;0.6875;1" values="0;0;1;1;0;0"/><text x="280" y="117" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4ade80" text-anchor="middle">19:00:03</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6875;0.6925;0.8075;0.8125;1" values="0;0;1;1;0;0"/><text x="280" y="117" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4ade80" text-anchor="middle">19:00:04</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.8125;0.8175;0.9325;0.9375;1" values="0;0;1;1;0;0"/><text x="280" y="117" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4ade80" text-anchor="middle">19:00:05</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.9375;0.9425;1" values="0;0;1;1"/><text x="280" y="117" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#4ade80" text-anchor="middle">19:00:06</text></g><g opacity="1"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0575;0.0625;1" values="1;1;0;0"/><text x="280" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#fb923c" text-anchor="middle">18:59:55</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0625;0.0675;0.1825;0.1875;1" values="0;0;1;1;0;0"/><text x="280" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#fb923c" text-anchor="middle">18:59:56</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1875;0.1925;0.3075;0.3125;1" values="0;0;1;1;0;0"/><text x="280" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#fb923c" text-anchor="middle">18:59:57</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3125;0.3175;0.4325;0.4375;1" values="0;0;1;1;0;0"/><text x="280" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#fb923c" text-anchor="middle">18:59:58</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4375;0.4425;0.5575;0.5625;1" values="0;0;1;1;0;0"/><text x="280" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#fb923c" text-anchor="middle">18:59:59</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5625;0.5675;0.6825;0.6875;1" values="0;0;1;1;0;0"/><text x="280" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#fb923c" text-anchor="middle">19:00:00</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6875;0.6925;0.8075;0.8125;1" values="0;0;1;1;0;0"/><text x="280" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#fb923c" text-anchor="middle">19:00:01</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.8125;0.8175;0.9325;0.9375;1" values="0;0;1;1;0;0"/><text x="280" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#fb923c" text-anchor="middle">19:00:02</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.9375;0.9425;1" values="0;0;1;1"/><text x="280" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#fb923c" text-anchor="middle">19:00:03</text></g><text x="280" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">clock correct</text><text x="280" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">clock 3 s slow</text><rect x="470" y="64" width="306" height="236" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="623" y="90" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">Chat, sorted by timestamp</text><g><animateTransform type="translate" attributeName="transform" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5875;0.6375;0.9625;0.9875;1" values="0,0;0,0;0,54;0,54;0,0;0,0"/><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3375;0.3525;0.935;0.95;1" values="0;0;1;1;0;0"/><rect x="490" y="106" width="266" height="42" rx="10" fill="#172033" stroke="#60a5fa" stroke-width="1.6"/><text x="506" y="132" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Alice: Dinner at 8?</text><text x="742" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="end">19:00:00</text></g></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6;0.615;0.935;0.95;1" values="0;0;1;1;0;0"/><rect x="490" y="106" width="266" height="42" rx="10" fill="#172033" stroke="#a78bfa" stroke-width="1.6"/><text x="506" y="132" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Bob: Yes</text><text x="742" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#fb923c" text-anchor="end">18:59:59</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.65;0.665;0.935;0.95;1" values="0;0;1;1;0;0"/><rect x="532.16" y="234" width="181.68" height="24" rx="12" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="623" y="250.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">the answer shows first</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.175;0.179;0.246;0.25;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.175;0.25;1" path="M134,98 L190,98"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2625;0.2665;0.3335;0.3375;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2625;0.3375;1" path="M370,98 C420,98 420,150 470,150"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">19:00:00</text></g><text x="162" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" opacity="0">2 s later<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4125;0.4275;0.56;0.575;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.425;0.429;0.496;0.5;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.425;0.5;1" path="M134,222 L190,222"/><circle r="6" fill="#a78bfa"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5125;0.5165;0.5835;0.5875;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5125;0.5875;1" path="M370,222 C420,222 420,150 470,150"/><circle r="6" fill="#fb923c"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle">18:59:59</text></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Bob replied 2 s later, but server B's slow clock stamped it earlier.</text></svg>
