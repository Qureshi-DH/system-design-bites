<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">API gateways</title><desc id="desc">The rider app sends GET /home to the API gateway. The gateway checks the token and the rate limit, calls the users, nearby cars, pricing, and saved places services in parallel, and merges their answers into one response. A request with a bad token gets a 401, and one over the limit gets a 429, and neither reaches any service.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">API GATEWAYS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M140,180 L220,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M400,180 C480,180 480,89 560,89" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M400,180 C480,180 480,149 560,149" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M400,180 C480,180 480,209 560,209" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M400,180 C480,180 480,269 560,269" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="30" y="152" width="110" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="85" y="185.25" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Rider app</text><rect x="220" y="112" width="180" height="136" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="310" y="138" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">API gateway</text><rect x="232" y="154" width="156" height="22" rx="6" fill="#172033"/><text x="242" y="169" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">token</text><rect x="232" y="180" width="156" height="22" rx="6" fill="#172033"/><text x="242" y="195" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">rate limit, 60/min</text><rect x="232" y="206" width="156" height="22" rx="6" fill="#172033"/><text x="242" y="221" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">route and merge</text><rect x="560" y="68" width="170" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="557" y="65" width="176" height="48" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1938;0.2063;0.2188;0.2313;1" values="0;0;1;1;0;0"/></rect><text x="645" y="93.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Users</text><rect x="560" y="128" width="170" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="557" y="125" width="176" height="48" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1938;0.2063;0.2188;0.2313;1" values="0;0;1;1;0;0"/></rect><text x="645" y="153.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Nearby cars</text><rect x="560" y="188" width="170" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="557" y="185" width="176" height="48" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1938;0.2063;0.2188;0.2313;1" values="0;0;1;1;0;0"/></rect><text x="645" y="213.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Pricing</text><rect x="560" y="248" width="170" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="557" y="245" width="176" height="48" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1938;0.2063;0.2188;0.2313;1" values="0;0;1;1;0;0"/></rect><text x="645" y="273.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Saved places</text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0187;0.0227;0.0648;0.0688;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0187;0.0688;1" path="M140,180 L220,180"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">GET /home</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes