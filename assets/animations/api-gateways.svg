" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1437;0.1477;0.1898;0.1938;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1437;0.1938;1" path="M400,180 C480,180 480,209 560,209"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2313;0.2353;0.271;0.275;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2313;0.275;1" path="M560,209 C480,209 480,180 400,180"/><circle r="6" fill="#4ade80"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1437;0.1477;0.1898;0.1938;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1437;0.1938;1" path="M400,180 C480,180 480,269 560,269"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2313;0.2353;0.271;0.275;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2313;0.275;1" path="M560,269 C480,269 480,180 400,180"/><circle r="6" fill="#4ade80"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2812;0.2963;0.3287;0.3438;1" values="0;0;1;1;0;0"/><path d="M368,217 L372.2,221.2 L380,212.8" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2938;0.2978;0.3648;0.3688;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2938;0.3438;1" path=