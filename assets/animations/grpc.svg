<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">gRPC</title><desc id="desc">One pricing.proto file generates a client stub for the dispatch service and a server stub for the pricing service. Dispatch calls GetQuote like a local function, the stub sends a 300 byte Protobuf message over a shared HTTP/2 connection, and a quote comes back. Then the location service streams driver locations to dispatch, one reply after another.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">GRPC</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M330,84 C260,84 221,105 221,142" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><path d="M470,84 C540,84 579,105 579,142" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"></path><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.04;0.1225;0.1375;1" values="0;0;1;1;0;0"/><path d="M330,84 C260,84 221,105 221,142" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" values="0;-192"/></path></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.025;0.04;0.1225;0.1375;1" values="0;0;1;1;0;0"/><path d="M470,84 C540,84 579,105 579,142" fill="none" 