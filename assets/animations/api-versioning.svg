indefinite" calcMode="linear" keyTimes="0;0.5462;0.5646;0.92;0.9385;1" values="0;0;1;1;0;0"/><rect x="46.48" y="168" width="137.04" height="24" rx="12" fill="#fb923c" fill-opacity="0.16" stroke="#fb923c" stroke-width="1.2"/><text x="115" y="184.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">Sunset: Oct 2027</text></g><g opacity="0"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1846;0.1886;0.2575;0.2615;1" values="0;0;1;1;0;0"/><animateMotion dur="13s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1846;0.2615;1" path="M190,244 C230,244 230,184 270,184"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">GET /v2</text></g><g opacity="0"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2692;0.2732;0.3498;0.3538;1" values="0;0;1;1;0;0"/><animateMotion dur="13s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2692;0.3538;1" path="M400,184 L630,184"/><circle r="6" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3769;0.3809;0.4575;0.4615;1" values="0;0;1;1;0;0"/><animateMotion dur="13s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3769;0.4615;1" path="M630,184 L400,184"/><circle r="6" fill="#4ade80"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">2490</text></g><g opacity="0"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4692;0.4732;0.5422;0.5462;1" values="0;0;1;1;0;0"/><animateMotion dur="13s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4692;0.5462;1" path="M270,184 C230,184 230,244 190,244"/><circle r="6" fill="#4ade80"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">2490</text></g><text x="115" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#4ade80" text-anchor="middle" opacity="0">total_cents: 2490<animate attributeName="opacity" dur="13s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5462;0.5646;0.92;0.9385;1" values="0;0;1;1;0;0"/></text><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">v1 still works through an adapter until sunset. v2 gets the new shape.</text></svg>
