<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Quorum</title><desc id="desc">A game server writes a new sword, version 2, to three replicas and counts it saved after 2 acks, from A and B. The copy to C is still on its way. An inventory read asks B and C. C still has version 1, but B is in both sets, so the read sees version 2 and returns the sword.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">QUORUM</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M174,170 C250,170 250,104 325,104" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M174,180 L325,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M174,190 C250,190 250,256 325,256" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M626,180 L475,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M626,190 C550,190 550,256 475,256" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.225;0.24;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="311" y="66" width="178" height="152" rx="12" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="7 5"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatC