<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Leader election</title><desc id="desc">Three billing schedulers share one lease in etcd. Scheduler 1 holds the crown, renews the lease and sends the billing job until it crashes. The lease drains to zero, both standbys ask for it, Scheduler 2 gets it and becomes the new leader while Scheduler 3 is told it is taken.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">LEADER ELECTION</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M300,99 C250,99 244,168 194,168" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M300,180 C250,180 244,181 194,181" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M300,261 C250,261 244,194 194,194" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M470,99 C540,99 550,168 610,168" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M470,180 C540,180 550,180 610,180" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M470,261 C540,261 550,192 610,192" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M44,130 v92 a75,10 0 0 0 150,0 v-92" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="119" cy="130" rx="75" ry="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><text x="119" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">etcd</text><text x="119" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">billing leader</text><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5437;0.5625;0.9625;0.975;1" values="1;1;0;0;1;1"/><text x="119" y="104" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">holder: Scheduler 1</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5625;0.5813;0.6437;0.6625;1" values="0;0;1;1;0;0"/><text x="119" y="104" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">holder: none</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6625;0.6813;0.9437;0.9625;1" values="0;0;1;1;0;0"/><text x="119" y="104" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">holder: Scheduler 2</text></g><rect x="54" y="248" width="130" height="10" rx="3" fill="#172033" stroke="#334155"/><rect x="54" y="248" width="100.49" height="10" rx="3" fill="#facc15"><animate attributeName="width" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0625;0.065;0.1875;0.19;0.5625;0.6625;0.665;0.7875;0.79;0.9125;0.915;1" values="100.49;78.78;130;86.71;130;0;0;130;86.71;130;86.71;130;100.49"/></rect><text x="119" y="278" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">lease, 15 s to live</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5625;0.5775;0.66;0.675;1" values="0;0;1;1;0;0"/><rect x="61.64" y="290" width="114.72" height="24" rx="12" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="119" y="306.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">lease expired</text></g><rect x="300" y="72" width="170" height="54" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="344" y="96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="start">Scheduler 1</text><rect x="300" y="153" width="170" height="54" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="344" y="177" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="start">Scheduler 2</text><rect x="300" y="234" width="170" height="54" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="344" y="258" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="start">Scheduler 3</text><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2188;0.2375;0.9625;0.975;1" values="1;1;0;0;1;1"/><text x="344" y="113" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#facc15" text-anchor="start">leader</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2375;0.2562;0.9437;0.9625;1" v