ere the time goes<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3725;0.3875;0.9125;0.9275;1" values="1;1;0;0;1;1"/></text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3625;0.3812;0.6;0.6188;1" values="0;0;1;1;0;0"/><rect x="60" y="236" width="566.7" height="28" rx="4" fill="#fb923c"/><text x="72" y="255" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">database: 1.5 s, 51 queries</text><rect x="626.7" y="236" width="83.5" height="28" fill="#475569"/><rect x="710.2" y="236" width="3.4" height="28" fill="#60a5fa"/><rect x="713.6" y="236" width="7.6" height="28" fill="#a78bfa"/><path d="M715.1,267 L715.1,276" stroke="#94a3b8" stroke-width="1.4"/><text x="721.1111" y="291" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="end">ranking 9 ms, JSON 20 ms</text><text x="343.3333" y="291" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fb923c" text-anchor="middle">the real hot spot</text></g><rect x="60" y="236" width="661.1" height="28" rx="4" fill="#4ade80" opacity="0"><animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6125;0.6875;1" values="661.1111111111111;661.1111111111111;113.33333333333333;113.33333333333333"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5875;0.6063;0.8937;0.9125;1" values="0;0;1;1;0;0"/></rect><text x="185.3333" y="255" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#4ade80" text-anchor="start" opacity="0">about 300 ms, in an afternoon<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6875;0.7025;0.8975;0.9125;1" values="0;0;1;1;0;0"/></text><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Two weeks of tuning saved 50 ms. The trace found 1.5 s in the database.</text></svg>
