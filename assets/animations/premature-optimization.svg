<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Premature optimization</title><desc id="desc">A social feed loads in 1.8 seconds. Two weeks of tuning the JSON and ranking code bring it to 1.75 seconds. Then a trace shows 1.5 seconds spent on 51 database queries, while ranking takes 9 ms and JSON 20 ms. One join plus an index takes the feed to about 300 ms.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">PREMATURE OPTIMIZATION</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M118,130 L168,130" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M338,130 L508,130" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="30" y="108" width="88" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="74" y="134.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">User</text><rect x="168" y="104" width="170" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><rect x="165" y="101" width="176" height="58" rx="13" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0625;0.0775;0.31;0.325;1" values="0;0;1;1;0;0"/></rect><text x="253" y="128" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Feed service</text><text x="253" y="145" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">JSON, ranking</text><path d="M508,110 v40 a55,10 0 0 0 110,0 v-40" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><ellipse cx="563" cy="110" rx="55" ry="10" fill="#172033" stroke="#475569" stroke-width="1.6"/><text x="563" y="134" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Postgres</text><text x="563" y="150" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">posts, users</text><rect x="652" y="104" width="118" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="711" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">feed load</text><g opacity="1"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2563;0.275;1" values="1;1;0;0"/><text x="711" y="134" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="middle">1.8 s</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.275;0.2938;0.6687;0.6875;1" values="0;0;1;1;0;0"/><text x="711" y="134" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#fb923c" text-anchor="middle">1.75 s</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6875;0.7063;0.8937;0.9125;1" values="0;0;1;1;0;0"/><text x="711" y="134" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#4ade80" text-anchor="middle">~300 ms</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.9125;0.9313;1" values="0;0;1;1"/><text x="711" y="134" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="middle">1.8 s</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0125;0.0165;0.0523;0.0563;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0125;0.0563;1" path="M118,130 L168,130"/><circle r="5" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0625;0.0775;0.31;0.325;1" values="0;0;1;1;0;0"/><rect x="180.76" y="170" width="144.48" height="24" rx="12" fill="#fb923c" fill-opacity="0.16" stroke="#fb923c" stroke-width="1.2"/><text x="253" y="186.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">2 weeks of tuning</text></g><text x="423" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fb923c" text-anchor="middle" opacity="0">51 queries<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3625;0.3775;0.56;0.575;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3625;0.3665;0.4022;0.4062;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTime