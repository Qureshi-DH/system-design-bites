<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Multi region deployment</title><desc id="desc">Players in America, Europe and Asia each reach the game servers in their nearest region, Virginia, Frankfurt and Singapore, at about 30 ms. Player profiles replicate from the primary database in Virginia to read replicas in the other two. Frankfurt goes down and European players are routed to Virginia at 90 ms instead of not playing.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">MULTI REGION DEPLOYMENT</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M130,112 L130,170" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M670,112 L670,170" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4062;0.425;0.925;0.9438;1" values="1;1;0;0;1;1"/><path d="M400,112 L400,170" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.425;0.4437;0.9062;0.925;1" values="0;0;1;1;0;0"/><path d="M400,112 L400,170" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" opacity="0.25"></path></g><g opacity="0"><animate attributeName="opacity" dur="16s" repe