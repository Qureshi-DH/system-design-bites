<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Serialization formats</title><desc id="desc">One playback event with four fields is encoded twice. As JSON it is readable text that repeats every field name and takes 57 bytes. As Protobuf it becomes 10 bytes of binary, with small field numbers instead of names. Size bars grow as each encoding is written, and the Protobuf one stops far sooner.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">SERIALIZATION FORMATS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><rect x="40" y="92" width="160" height="156" rx="10" fill="#172033" stroke="#22d3ee" stroke-width="1.6"/><text x="120" y="116" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">Playback event</text><text x="54" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">user_id</text><text x="186" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="end">42</text><text x="54" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">video_id</text><text x="186" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="end">7</text><text x="54" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">position</text><text x="186" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="end">312</text><text x="54" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">bitrate</text><text x="186" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="end">4500</text><path d="M200,124 L238,124" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M200,232 L238,232" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0429;0.0469;0.0817;0.0857;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0429;0.0857;1" path="M200,124 L238,124"/><circle r="5" fill="#22d3ee"></circle></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0429;0.0469;0.0817;0.0857;1" values="0;0;1;1;0;0"/><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0429;0.0857;1" path="M200,232 L238,232"/><circle r="5" fill="#22d3ee"></circle></g><text x="248" y="92" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="start">JSON</text><text x="298" y="92" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">field names in every message</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.1171;0.9257;0.9429;1" values="0;0;1;1;0;0"/><text x="248" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600"><tspan fill="#94a3b8">{</tspan><tspan fill="#fb923c">"user_id"</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#e2e8f0">42</tspan><tspan fill="#94a3b8">,</tspan><tspan fill="#fb923c">"video_id"</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#e2e8f0">7</tspan><tspan fill="#94a3b8">,</tspan><tspan fill="#fb923c">"position"</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#e2e8f0">312</tspan><tspan fill="#94a3b8">,</tspan><tspan fill="#fb923c">"bitrate"</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#e2e8f0">4500</tspan><tspan fill="#94a3b8">}</tspan></text></g><rect x="246" y="112" width="432" height="24" fill="#0f172a"><animate attributeName="x" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.2857;1" values="246;246;678;678"/><animate attributeName="width" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.2857;1" values="432;432;0;0"/></rect><rect x="248" y="144" width="0" height="14" rx="3" fill="#fb923c"><animate attributeName="width" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.2857;0.9286;0.9429;1" values="0;0;448;448;0;0"/></rect><text x="704" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fb923c" text-anchor="start" opacity="0">57 bytes<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2857;0.3029;0.9257;0.9429;1" values="0;0;1;1;0;0"/></text><text x="248" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="start">Protobuf</text><text x="326" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">field numbers, binary</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.1171;0.9257;0.9429;1" values="0;0;1;1;0;0"/><text x="248" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#4ade80">08 2a 10 07 18 b8 02 20 94 23</text></g><rect x="246" y="220" width="230" height="24" fill="#0f172a"><animate attributeName="x" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.1332;1" values="246;246;476;476"/><animate attributeName="width" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.1332;1" values="230;230;0;0"/></rect><rect x="248" y="252" width="0" height="14" rx="3" fill="#4ade80"><animate attributeName="width" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.1332;0.9286;0.9429;1" values="0;0;80;80;0;0"/></rect><text x="336" y="264" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#4ade80" text-anchor="start" opacity="0">10 bytes<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1332;0.1503;0.9257;0.9429;1" values="0;0;1;1;0;0"/></text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3286;0.3457;0.9257;0.9429;1" values="0;0;1;1;0;0"/><rect x="435.76" y="247" width="144.48" height="24" rx="12" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="508" y="263.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">almost 6x smaller</text></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">The same event as JSON is 57 bytes. As Protobuf it is 10 bytes.</text></svg>
