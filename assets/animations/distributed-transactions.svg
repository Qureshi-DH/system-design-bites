<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Distributed transactions</title><desc id="desc">Checkout for a 40 dollar lamp must change three services all or nothing. The payment service charges the card, the inventory service times out, and the order is never saved, so the customer paid for nothing. Three ways out appear: two phase commit, saga, and outbox.</desc><rect width="800" height="360" rx="16" fill="#0f172a"/><rect x="0.5" y="0.5" width="799" height="359" rx="16" fill="none" stroke="#1e293b"/><text x="28" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#facc15">DISTRIBUTED TRANSACTIONS</text><text x="772" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">system design bites</text><path d="M186,148 C240,148 246,88 300,88" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M186,148 C240,148 246,148 300,148" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M186,148 C240,148 246,208 300,208" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="288" y="56" width="194" height="184" rx="14" fill="none" stroke="#facc15" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="6 5"/><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.275;0.2938;0.9187;0.9375;1" values="0;0;1;1;0;0"/><rect x="288" y="56" width="194" height="184" rx="14" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="6 5"/></g><rect x="36" y="116" width="150" height="64" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="111" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Checkout</text><text x="111" y="163" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">all or nothing</text><rect x="300" y="64" width="170" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="385" y="86" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Payment</text><text x="385" y="103" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">charge $40</text><rect x="300" y="124" width="170" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="385" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Inventory</text><text x="385" y="163" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">reserve lamp</text><rect x="300" y="184" width="170" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="385" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Orders</text><text x="385" y="223" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">save order</text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0938;0.1125;0.9187;0.9375;1" values="0;0;1;1;0;0"/><rect x="300" y="64" width="170" height="48" rx="10" fill="none" stroke="#4ade80" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0938;0.1087;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="505.08" y="76" width="99.84" height="24" rx="12" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-width="1.2"/><text x="555" y="92.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">charged $40</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.275;0.2938;0.9187;0.9375;1" values="0;0;1;1;0;0"/><rect x="300" y="124" width="170" height="48" rx="10" fill="none" stroke="#f87171" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.275;0.29;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="512.52" y="136" width="84.96" height="24" rx="12" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="555" y="152.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">timed out</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3125;0.3275;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="512.52" y="196" width="84.96" height="24" rx="12" fill="#64748b" fill-opacity="0.16" stroke="#64748b" stroke-width="1.2"/><text x="555" y="212.32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">never ran</text></g><text x="696" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="48" font-weight="700" fill="#facc15" text-anchor="middle" opacity="0">?<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.35;0.365;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><text x="696" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle" opacity="0">paid for nothing<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.35;0.365;0.9225;0.9375;1" values="0;0;1;1;0;0"/></text><circle cx="696" cy="136" r="8" fill="none" stroke="#facc15" stroke-width="2" opacity="0"><animate attributeName="r" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.35;0.45;1" values="8;8;34;34"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.35;0.3512;0.45;1" values="0;0;0.9;0;0"/></circle><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4375;0.4525;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="108" y="258" width="184" height="50" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="200" y="281" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Two phase commit</text><text x="200" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">all vote, then commit</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5;0.515;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="308" y="258" width="184" height="50" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="400" y="281" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Saga</text><text x="400" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">undo with a refund</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5625;0.5775;0.9225;0.9375;1" values="0;0;1;1;0;0"/><rect x="508" y="258" width="184" height="50" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.6"/><text x="600" y="281" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Outbox</text><text x="600" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">never lose a step</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0312;0.0353;0.0897;0.0938;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0312;0.0938;1" path="M186,148 C240,148 246,88 300,88"/><circle r="6" fill="#22d3ee"></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">charge</text></g><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.129;0.271;0.275;1" values="0;0;1;1;0;0"/><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.125;0.1875;1" path="M186,148 C240,148 246,148 300,148"/><circle r="6" fill="#22d3ee"><animate attributeName="fill" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1875;0.2562" values="#22d3ee;#fb923c;#f87171"/></circle><text y="-11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">reserve</text></g><text x="400.0" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">The card is charged, then stock times out. Three patterns fix this.</text></svg>
